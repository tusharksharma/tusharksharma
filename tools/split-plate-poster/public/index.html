<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Split Plate Poster</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header>
      <h1>Split Plate Poster</h1>
      <p class="subtitle">One video, three platforms.</p>
    </header>

    <form id="postForm">
      <label class="dropzone" id="dropzone" for="videoInput">
        <input type="file" id="videoInput" name="video" accept="video/*" hidden />
        <span id="dropzoneText">Drop a video here, or tap to choose one</span>
        <video id="preview" hidden controls></video>
      </label>

      <label class="field">
        Caption
        <textarea id="caption" name="caption" rows="4" placeholder="Caption, hashtags, anything that goes with the video..."></textarea>
      </label>

      <fieldset class="platforms">
        <label class="platform-option">
          <input type="checkbox" name="platform" value="youtube" checked />
          <span>YouTube Shorts</span>
        </label>
        <label class="platform-option">
          <input type="checkbox" name="platform" value="instagram" checked />
          <span>Instagram Reels</span>
        </label>
        <label class="platform-option">
          <input type="checkbox" name="platform" value="tiktok" checked />
          <span>TikTok</span>
          <span class="badge" title="Posts privately until your TikTok app passes their content audit">private for now</span>
        </label>
      </fieldset>

      <button type="submit" id="postButton">Post everywhere</button>
    </form>

    <section id="results" hidden>
      <h2>Results</h2>
      <ul id="resultsList"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
