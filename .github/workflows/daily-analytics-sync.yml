name: Daily GA4 Analytics Sync

on:
  schedule:
    # Runs every day at 08:00 UTC (midnight PST / 1am PDT)
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Pull latest GA4 metrics into public/analytics-data.json and dist/analytics-data.json
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-analytics.mjs

      - name: Commit and push updated analytics snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/analytics-data.json dist/analytics-data.json
          if git diff --staged --quiet; then
            echo "No changes in analytics snapshot."
          else
            git commit -m "chore(analytics): daily GA4 usage & location snapshot sync"
            git push origin HEAD:main
          fi
