    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cookies & Cream Iced Proffee","description":"One HighKey sandwich cookie does double duty as the chocolate-syrup rim AND the crumb topping, with black cocoa carrying the dark-cookie flavor from inside the concentrate. 140 cal / 22g protein per glass, 5-minute build.","image":"https://thesplitplate.com/images/cookies-and-cream-iced-proffee/hero-cookies-and-cream-iced-proffee-polished.webp","totalTime":"PT5M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Sauce","recipeCuisine":"American","recipeIngredient":["1 tsp sugar-free chocolate syrup (rim tack only — spread on a small plate, not into the glass)","1 HighKey Original sandwich cookie, broken up — part goes into the rim, part is reserved as the topping (almond-flour based; verify the current package for tree-nut allergen)","1 tbsp instant coffee (creator's strong-coffee dose; use 1/2 tbsp for a milder drink)","1 tsp black cocoa powder (the dark sandwich-cookie flavor — regular Dutch cocoa reads milder and browner)","1/2 serving unflavored whey isolate (~14g protein — adjust by brand)","2 tsp monk fruit / erythritol sweetener","2-3 tbsp hot water (hot but NOT boiling — start with 2 tbsp, add the third only if needed)","Ice, as needed","1/2 cup Fairlife fat-free ultra-filtered milk","Reserved cookie crumbs from the cookie above (no second cookie needed)"],"recipeInstructions":[{"@type":"HowToStep","name":"Build The Cookie Rim","text":"Spread 1 tsp sugar-free chocolate syrup on a small plate. Break the sandwich cookie into the syrup and RESERVE a spoonful of loose crumbs for the topping before you rim — once the crumbs are in the syrup they're too wet to sit on top of the drink. Press and rotate the glass rim through the remaining crumbs.","image":"https://thesplitplate.com/images/cookies-and-cream-iced-proffee/step-03-cookie-crumb-rim-polished.webp"},{"@type":"HowToStep","text":"BUILD THE CONCENTRATE (into the rimmed glass): 1 tbsp instant coffee + 1 tsp black cocoa + 1/2 serving unflavored whey isolate + 2 tsp monk fruit sweetener. Blend the whey into the concentrate FIRST — this is the Proffee-series spine that prevents clumps.","image":"https://thesplitplate.com/images/cookies-and-cream-iced-proffee/step-06-whey-isolate-polished.webp"},{"@type":"HowToStep","name":"Add Hot Water + Froth","text":"2 tbsp hot (not boiling) water. Submerge the frother head BEFORE turning it on for splatter control. Froth until the concentrate is completely smooth — black cocoa clumps harder than plain coffee, so give it a few extra seconds. Add the third tbsp only if it needs help moving.","image":"https://thesplitplate.com/images/cookies-and-cream-iced-proffee/step-07-froth-smooth-polished.webp"},{"@type":"HowToStep","name":"Finish + Serve","text":"Fill the glass with ice, pour in 1/2 cup Fairlife fat-free ultra-filtered milk, spoon the reserved cookie crumbs over the top, stir once, and serve immediately.","image":"https://thesplitplate.com/images/cookies-and-cream-iced-proffee/step-10-cookie-crumb-topping-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"140 calories","proteinContent":"22g"},"keywords":"Morning coffee, Afternoon Powerup, Adult drink, High-protein, No cook, 5-minute build, Cookies and cream flavor, One-cookie build"}</script>
