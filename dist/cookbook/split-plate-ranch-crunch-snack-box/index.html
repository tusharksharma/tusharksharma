    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Ranch Crunch Snack Box","description":"Higher-protein savory snack box. Turkey + cucumber + carrots + Harvest Snaps + Greek-yogurt-forward ranch dip. ~230 cal / 27g protein per box.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/hero-final-ranch-crunch-box-polished.webp","totalTime":"PT10M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeCuisine":"American","recipeIngredient":["1 small container Fage 0% Greek yogurt (~5.3 oz single-serve, or 1 cup from a tub)","4 tbsp Daisy Light sour cream","Simply Organic Ranch dip seasoning, to taste (~1 tbsp per batch)","1 portion ranch dip (~1/4 of the batch)","3 oz Hillshire Farm carved oven-roasted turkey (or any deli turkey)","1/2 serving Harvest Snaps Lightly Salted (~11g / ~11 pieces — half the label serving)","Cucumber slices, as needed","Baby carrots or carrot sticks, as needed"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"1 divided snack box per person (4-compartment Bento-style — same box format as Snack Box Series Ep. 1-3). Build a batch of 4 in one pass.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/hero-final-ranch-crunch-box-polished.webp"},{"@type":"HowToStep","name":"Ranch Dip Base","text":"Add the full container of Fage 0% Greek yogurt to a small mixing bowl. This is ~80% of the dip volume.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/step-01-add-greek-yogurt-polished.webp"},{"@type":"HowToStep","name":"Sour Cream","text":"Add 4 tbsp Daisy Light sour cream. DO NOT skip this — the light sour cream is what makes the yogurt taste like actual ranch instead of plain Greek yogurt with seasoning.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/context-daisy-light-sour-cream.webp"},{"@type":"HowToStep","name":"Season","text":"Sprinkle Simply Organic ranch seasoning to taste (~1 tbsp per batch). Start light — taste after mixing.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/context-simply-organic-ranch-seasoning.webp"},{"@type":"HowToStep","name":"Mix","text":"Stir until thick, creamy, and evenly seasoned. Should look like actual ranch dip, not thin yogurt. Taste and add more seasoning if needed.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/step-02-mix-ranch-dip-polished.webp"},{"@type":"HowToStep","name":"Portion Dip","text":"Spoon ~1/4 of the batch into the dip compartment of each snack box.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/step-03-spoon-ranch-dip-polished.webp"},{"@type":"HowToStep","name":"Turkey","text":"Fold 3 oz carved turkey into the largest compartment of each box. Loose fan-folds hold up better than tight rolls.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/step-04-add-turkey-polished.webp"},{"@type":"HowToStep","name":"Cucumber","text":"Slice cucumber into thin rounds (kid-friendly bite-size). Fill the produce compartment. FOR KIDS UNDER 4 — see notes for safe cut sizes.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/step-05-add-cucumber-polished.webp"},{"@type":"HowToStep","name":"Carrots","text":"Add baby carrots or thick carrot sticks alongside the cucumber. Kids over 4 handle whole baby carrots; under 4, cut lengthwise (see notes).","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/step-06-add-carrots.webp"},{"@type":"HowToStep","name":"Harvest Snaps","text":"Fill the final compartment with 1/2 serving Harvest Snaps Lightly Salted per box (~11 pieces). If packing far ahead, add closer to serving so they stay crunchy.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/step-07-add-harvest-snaps-polished.webp"},{"@type":"HowToStep","name":"Lid + Chill","text":"Snap lid on. Refrigerate or pack with an ice pack — the box has dairy (dip) + turkey and needs to stay cold.","image":"https://thesplitplate.com/images/split-plate-ranch-crunch-snack-box/final-stacked-snack-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"230 calories","proteinContent":"27g"},"keywords":"Kid snack, Snack box, Post-lunch snack, After-school snack, Weekend snack, Busy-parent snack prep, Higher-protein snack, No cook"}</script>
