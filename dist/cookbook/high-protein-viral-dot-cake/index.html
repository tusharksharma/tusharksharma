    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Viral Dot Cake","description":"Viral dot cake, protein version. 3 ramekin cakes per batch, 250 cal / 25g protein each (base 170/19 + cheesecake frosting + sprinkles).","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/hero-finished-dot-cakes-polished.webp","totalTime":"PT25M","recipeYield":"3","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeIngredient":["2 scoops (62g) PEScience Select Gourmet Vanilla Protein Powder","3 large Happy Egg Co Organic Free-Range Eggs","1/4 cup (60ml) Fairlife Fat-Free Ultra-Filtered Milk","45g all-purpose flour","15g Whole Earth Monk Fruit Erythritol Sweetener Blend","15g Jell-O Sugar-Free Vanilla Instant Pudding Mix (about half a 1 oz box)","1 tsp Clabber Girl Double-Acting Baking Powder","1 tsp vanilla extract","Cooking spray (for ramekins)","1 serving (30g) Protein Cheesecake Frosting per cake — 60 cal / 6g protein each","Rainbow nonpareil sprinkles, ~5g per cake (~20 cal/cake)"],"recipeInstructions":[{"@type":"HowToStep","name":"Preheat","text":"Oven to 350°F. Spray 3 ramekins (6-8 oz size) with cooking spray."},{"@type":"HowToStep","name":"Dry Mix","text":"In a mixing bowl on a scale, combine 62g PEScience Vanilla + 45g AP flour + 15g Whole Earth Monk Fruit Erythritol + 15g Jell-O Sugar-Free Vanilla Pudding Mix + 1 tsp Clabber Girl baking powder. Whisk dry to break up any protein-powder clumps.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/step-baking-powder-polished.webp"},{"@type":"HowToStep","name":"Wet Mix","text":"In a separate bowl, whisk 3 eggs + 1/4 cup Fairlife + 1 tsp vanilla extract until uniform.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/context-happy-egg-polished.webp"},{"@type":"HowToStep","name":"Combine","text":"Pour the wet into the dry. Whisk until smooth — should be thick cake batter that just barely flows off the whisk. Don't overmix; lumps cook out.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/step-mix-batter-polished.webp"},{"@type":"HowToStep","name":"Fill Ramekins","text":"Divide batter evenly across 3 ramekins. Smooth the tops with a spatula. Ramekins should be ~3/4 full — the cakes rise then settle.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/step-fill-ramekins-polished.webp"},{"@type":"HowToStep","name":"Bake 350°f × 15 Min","text":"Tops should be golden + spring back lightly. Centers should still feel SOFT to the touch — the liquidy-molten center is the viral dot cake signature. Past 18 min = dry center = lost moment.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/step-baked-cakes-polished.webp"},{"@type":"HowToStep","name":"Cool + Trim","text":"Let ramekins cool 10 min on a wire rack, then chill in the fridge 30 min (or overnight). Once chilled, slice the domed top off each cake with a serrated knife so the surface is flat for frosting. The trimmed scraps = the 4th serving (snack them, freeze for parfaits, or compost)."},{"@type":"HowToStep","name":"Frost","text":"Spread one 30g serving of [Protein Cheesecake Frosting](/cookbook/protein-cheesecake-frosting) over each flat-trimmed cake top. Smooth to the edges. Thick frosting holds peaks; thin frosting pools — refer to the parent frosting recipe troubleshooting if it's too thin.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/step-cheesecake-frosting-polished.webp"},{"@type":"HowToStep","name":"Sprinkle Dip","text":"Pour ~5g rainbow nonpareils onto a shallow plate. Press the frosted top of each cake into the sprinkles to coat. Lift gently — frosting holds the sprinkles in place.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/step-sprinkle-pour-polished.webp"},{"@type":"HowToStep","name":"Scoop + Eat","text":"Best within 2 hours of frosting (sprinkle crunch fades after 4-6 hours as moisture migrates). Scoop through the sprinkle top + frosting + cake — molten center reveals itself on the spoon.","image":"https://thesplitplate.com/images/high-protein-viral-dot-cake/step-final-scoop-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"250 calories","proteinContent":"25g"},"keywords":"Dessert, Powerup, High protein, Viral, Baked, Make-ahead, Adults, Birthday-energy"}</script>
