    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Protein Tiramisu Cups with Cottage Cheese","description":"Individual tiramisu cups with cottage cheese, Greek yogurt, protein powder, coffee-dipped wafers and cocoa. Prepare ahead and chill overnight.","image":"https://thesplitplate.com/images/protein-tiramisu/hero-protein-tiramisu-polished.webp","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"Italian","recipeIngredient":["150g Fage Total 0% Greek Yogurt (1 small container)","150g Daisy 2% Cottage Cheese (1 small container)","84g Philadelphia Neufchâtel Cheese (3 portions of an 8 oz block)","2 scoops PEScience Select Protein, Vanilla (62g total)","3 tbsp Whole Earth Allulose + Monk Fruit sweetener blend (36g)","28 HighKey Vanilla Wafers (7 per ramekin × 4 ramekins, ~70g total)","About 1/2 cup black coffee (brewed strong, room temp) — for dipping the wafers only","1/2 tbsp Ghirardelli unsweetened cocoa powder (for the snowfall on top)"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Cottage Cheese Alone","text":"This is the most important step. Add the full 150g Daisy 2% to a blender or food processor. Blend until completely smooth — no visible curds. If you skip this and blend everything together, surviving curds wreck the mousse texture and you'll taste them all week. Non-negotiable.","image":"https://thesplitplate.com/images/protein-tiramisu/step-01-cottage-cheese-polished.webp"},{"@type":"HowToStep","name":"Add The Rest of The Cream","text":"Once cottage cheese is silky, add the Fage 0%, Neufchâtel (cut into chunks so it blends), 2 scoops PEScience Vanilla, and 3 tbsp Whole Earth sweetener. No coffee goes in the cream — all the coffee is in the wafer dip. Blend until thick, smooth, mousse-like — should hold a soft peak, not pour. If too thick, add a splash of milk or water.","image":"https://thesplitplate.com/images/protein-tiramisu/step-03-blend-mousse-polished.webp"},{"@type":"HowToStep","name":"Brew The Dip Coffee","text":"Brew about 1/2 cup strong black coffee and cool it to room temp. Pour into a shallow bowl wide enough to lay a wafer flat. This is the only coffee in the recipe.","image":"https://thesplitplate.com/images/protein-tiramisu/step-04-dip-vanilla-wafers-polished.webp"},{"@type":"HowToStep","name":"Dip, Don't Soak","text":"One wafer at a time — quick in, quick out. Roughly one second per side. The wafer should still feel structural when you place it. Soaked wafers turn into wet sludge by morning. This is where most home tiramisus die.","image":"https://thesplitplate.com/images/protein-tiramisu/step-04-dip-vanilla-wafers-polished.webp"},{"@type":"HowToStep","name":"Layer","text":"In each of 4 ramekins or 6 oz meal-prep containers — 3-4 dipped wafers on the bottom (snap if needed to fit), generous spoonful of cream (~1/4 of cream total ÷ 2 layers = ~1/8 per layer), 3-4 more dipped wafers, another generous spoonful of cream on top (7 wafers per ramekin × 4 ramekins = 28 wafers total). Smooth flat. Repeat for all 4 containers.","image":"https://thesplitplate.com/images/protein-tiramisu/step-06-layer-cream-polished.webp"},{"@type":"HowToStep","text":"CHILL OVERNIGHT — NOT 4 HOURS, OVERNIGHT: This is the second non-negotiable step. The protein powder needs to hydrate, the wafers need to soften from the coffee dip, and the flavors need to meld. Day 2 tastes dramatically better than fresh — the coffee bitterness smooths out and the cream sets like real tiramisu cream.","image":"https://thesplitplate.com/images/protein-tiramisu/step-07-cover-and-chill-polished.webp"},{"@type":"HowToStep","name":"Cocoa Dust Right Before Eating","text":"Don't dust ahead of time — cocoa absorbs moisture and goes patchy. Divide the listed 1/2 tbsp Ghirardelli cocoa among the four containers, dusting each only when you eat it. Use a fine mesh strainer for an even snowfall. The cocoa carries the tiramisu perception harder than anything else in the recipe.","image":"https://thesplitplate.com/images/protein-tiramisu/final-cocoa-dusted-tiramisu-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"236 calories","proteinContent":"24g"},"keywords":"Make-ahead, Dessert, Family-friendly, Cutting-friendly, Meal-prep"}</script>
