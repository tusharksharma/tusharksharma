    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Peanut Butter Cup Iced Proffee","description":"A concentrate-first protein coffee technique dressed up as a peanut butter cup. Chocolate-swirled cup + powdered peanut butter in the concentrate + Reese's Thin garnish. 160 cal / 23g protein per glass, 5-minute build.","image":"https://thesplitplate.com/images/peanut-butter-cup-iced-proffee/hero-peanut-butter-cup-iced-proffee-polished.webp","totalTime":"PT5M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Sauce","recipeIngredient":["1 tbsp sugar-free chocolate syrup (drizzled around the inside of a tall serving cup)","1 tbsp instant coffee (creator's strong-coffee dose; use 1/2 tbsp for a milder drink)","1/2 serving unflavored whey isolate (~14g protein — adjust by brand)","1/2 tbsp powdered peanut butter","2 tsp monk fruit / erythritol sweetener","2-3 tbsp hot water (hot but NOT boiling — start with 2 tbsp, add the third only if needed)","Ice, as needed","1/2 cup Fairlife fat-free ultra-filtered milk","1 tbsp sugar-free whipped cream","1/2 piece Reese's Thin, chopped or crumbled"],"recipeInstructions":[{"@type":"HowToStep","name":"Line The Cup","text":"Drizzle 1 tbsp sugar-free chocolate syrup around the INSIDE of a tall serving cup. Not on the bottom — spiral it around the interior wall so each sip picks up more chocolate as the drink drains.","image":"https://thesplitplate.com/images/peanut-butter-cup-iced-proffee/step-01-chocolate-swirl-polished.webp"},{"@type":"HowToStep","text":"BUILD CONCENTRATE (into the chocolate-lined cup): 1 tbsp instant coffee + 1/2 serving unflavored whey isolate + 1/2 tbsp powdered peanut butter + 2 tsp monk fruit sweetener. Powdered peanut butter (not spread) is the macro pick — peanut flavor without a fat load.","image":"https://thesplitplate.com/images/peanut-butter-cup-iced-proffee/step-04-add-peanut-butter-powder-polished.webp"},{"@type":"HowToStep","name":"Add Hot Water + Froth","text":"2 tbsp hot (not boiling) water. Submerge the frother BEFORE turning it on. Froth until completely smooth. Add the third tbsp only if the concentrate needs help moving.","image":"https://thesplitplate.com/images/peanut-butter-cup-iced-proffee/step-07-froth-concentrate-polished.webp"},{"@type":"HowToStep","name":"Add Ice + Milk","text":"Fill the cup with ice, then pour in 1/2 cup Fairlife fat-free ultra-filtered milk. Stir gently if you want the chocolate swirl incorporated immediately; leave it undisturbed if you want the sip-by-sip chocolate pull.","image":"https://thesplitplate.com/images/peanut-butter-cup-iced-proffee/step-09-add-ultra-filtered-milk-polished.webp"},{"@type":"HowToStep","name":"Finish + Serve","text":"Top with 1 tbsp sugar-free whipped cream and half a chopped or crumbled Reese's Thin. Serve immediately — whipped cream softens against the cold in 1-2 minutes.","image":"https://thesplitplate.com/images/peanut-butter-cup-iced-proffee/step-11-reeses-garnish-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"160 calories","proteinContent":"23g"},"keywords":"Morning coffee, Afternoon Powerup, Adult drink, High-protein, No cook, 5-minute build, Peanut butter cup, Chocolate + peanut butter"}</script>
