    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"TKS Sweet Heat Chicken","description":"Crazy Cuizine chicken + TKS Sauce. Drop the orange-sauce packet, gain a real glaze, keep the 20 minutes.","image":"https://thesplitplate.com/images/tks-sweet-heat-chicken/hero-tks-sweet-heat-chicken-polished.webp","totalTime":"PT20M","recipeYield":"2","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Base","recipeCuisine":"Asian","recipeIngredient":["1 lb Crazy Cuizine Mandarin Orange Chicken (frozen, ~half the Costco party box)","*** Discard the included orange-sauce packet — that's a sugar bomb, you're swapping it out ***","1 batch TKS Sauce — make ahead while chicken cooks, takes 2 minutes","1-2 scallions, sliced thin","1 tsp toasted sesame seeds"],"recipeInstructions":[{"@type":"HowToStep","name":"Air Fry The Chicken","text":"From frozen, 400°F for 9-12 min. Shake basket halfway. Goal: crispy + golden, NOT soggy. Pull when the edges crack when squeezed (or follow box: 'fully cooked, ready in 20 min'). Single layer in the basket — overcrowding = steamed not crisp."},{"@type":"HowToStep","name":"Make The Sauce","text":"While chicken cooks (you have ~10 min). Whisk together ginger-garlic paste + sesame chili oil + rice vinegar + soy + bone broth packet + hot honey sriracha in a small bowl. Whisk hard — the packet powder needs to fully dissolve. (Full method on the TKS Sauce page.)"},{"@type":"HowToStep","text":"DUMP THE ORANGE PACKET. Seriously. The Crazy Cuizine box ships with a packet of sugary orange sauce. That's the part you're replacing. Throw it in the trash. This is the move."},{"@type":"HowToStep","name":"Hot Dry Skillet — The Cling Step","text":"Heat a large nonstick or carbon-steel skillet on medium-high. NO oil — pan dry. When the pan is screaming hot (water droplet beads + skitters), add the crispy chicken."},{"@type":"HowToStep","name":"Toss With Sauce","text":"Pour the TKS Sauce around the edge of the hot pan (not directly on the chicken). It will hiss + bubble immediately. Toss aggressively for 60-90 seconds. The residual breading starch + the sauce reduce and caramelize together — natural restaurant glaze, no cornstarch slurry needed. Off heat the moment every piece is glossy."},{"@type":"HowToStep","name":"Plate + Garnish","text":"Pile chicken on a plate or in a bowl. Scatter sliced scallions + toasted sesame seeds on top (optional but recommended — visual lift, fresh bite, takes 10 seconds)."},{"@type":"HowToStep","name":"Pair (optional But The Whole Point)","text":"Serve over Spicy Umami Fried Rice for a complete dinner. Chicken alone = 480 cal / 36g protein per serving. With rice = ~810 cal / 52g protein. Real dinner, real macros."}],"nutrition":{"@type":"NutritionInformation","calories":"480 calories","proteinContent":"36g"},"keywords":"Quick dinner with Spicy Umami Fried Rice on the side, Solo lunch (one full serving = 480 cal / 36g protein), TKS Bowls (chicken + rice + veg), Wraps (chicken + Mission Zero tortilla + scallions), Air-fryer freezer-to-plate dinner"}</script>
