    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cannoli Cookie Creami","description":"Crumbl Creami Cut Week 7 — Cannoli Cookie protein Creami with a brown-sugar base and the recipe-specific mix-ins.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/hero-finished-cannoli-cookie-creami-polished.webp","totalTime":"PT1457M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"Italian","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp brown-sugar monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1/2 regular ice cream cone (blend INTO the base pre-freeze)","1/2 waffle cone (break in AFTER Regular Ice Cream cycle)","1 tbsp Lily's chocolate chips"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Base","text":"Combine Fairlife 2% milk + brown-sugar monk fruit + whey isolate + guar gum + salt + half a regular ice cream cone. Immersion blender until completely smooth. Brown-sugar sweetener is the Week 7 swap — matches the reference cookie's brown-sugar profile.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-blend-brown-sugar-base-polished.webp"},{"@type":"HowToStep","name":"Add Regular Cone Before Freeze","text":"The regular cone goes INTO the base pre-freeze so its flavor carries through every scoop. Don't sub the waffle cone here — waffle cone in the base loses its crunch.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-add-regular-cone-before-freeze-polished.webp"},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Pour into a Creami pint below the max-fill line. Freeze upright and level for a full 24 hours.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-add-regular-cone-before-freeze-polished.webp"},{"@type":"HowToStep","name":"Rest + Spin","text":"Pull the pint, rest at ROOM TEMPERATURE for 5 minutes. Process on Regular Ice Cream cycle.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-first-spin-polished.webp"},{"@type":"HowToStep","name":"Add Waffle Cone After Spin","text":"Break half a waffle cone into rough chunks. Make a narrow center well in the spun Creami, drop the chunks in.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-add-waffle-cone-after-spin-polished.webp"},{"@type":"HowToStep","name":"Respin — no Liquid","text":"Run Respin WITHOUT adding liquid. No-liquid Respin is what preserves the waffle-cone crunch; adding liquid softens the cone.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-respin-no-liquid-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop the Respun Creami into a bowl.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Top With Chips + Serve","text":"Top with 1 tbsp Lily's chocolate chips. Eat immediately — waffle cone stays crunchy for about 2-3 minutes before the frozen scoop starts to soften it.","image":"https://thesplitplate.com/images/cannoli-cookie-creami/step-add-chocolate-chips-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"380 calories","proteinContent":"42g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Make-ahead, Brown sugar"}</script>
