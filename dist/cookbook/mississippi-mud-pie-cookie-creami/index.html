    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Mississippi Mud Pie Cookie Creami","description":"Darkest Creami in the series so far: 2 tbsp Dutch cocoa in the base, cocoa grahams through Respin, Mid-Day Squares brownie garnish + sugar-free whipped cream + cocoa dusting on top. 390 cal / 46g protein whole pint.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/hero-food-forward-v2-polished.webp","totalTime":"PT1455M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"American","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","2 tbsp Dutch cocoa (intentionally dark — the darkest cocoa dose in the series so far)","0.5 oz (14g) cocoa grahams (Crazy Grahams filmed)","1/3 square chocolate brownie (Mid-Day Squares filmed) — chopped, garnish only","1 tbsp sugar-free whipped cream","Dutch cocoa, as needed for a light dusting"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Base","text":"Combine Fairlife 2% milk + monk fruit + whey isolate + guar gum + salt + 2 tbsp Dutch cocoa. Immersion blender until completely smooth. Zero cocoa lumps.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/step-add-dutch-cocoa-polished.webp"},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Pour into a Creami pint below the max-fill line. Freeze upright and level for a full 24 hours.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/context-mid-day-chocolate-brownie-polished.webp"},{"@type":"HowToStep","name":"Rest + Spin","text":"Pull the pint, rest at ROOM TEMPERATURE for 5 minutes. Process on Regular Ice Cream. First-spin texture is expected to look dark and slightly powdery — the Respin fixes it.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/step-dark-first-spin-result-polished.webp"},{"@type":"HowToStep","name":"Mix-in Cocoa Grahams","text":"Make a narrow center well. Drop in 0.5 oz (14g) of cocoa grahams (Crazy Grahams filmed). Run RESPIN without adding liquid — this is the crunchy cookie element.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/step-add-cocoa-grahams-polished.webp"},{"@type":"HowToStep","name":"Respin Result","text":"Post-Respin should read as a dark, smooth, cocoa-graham-flecked pint. If it's still powdery, add nothing and Respin one more time.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/step-respin-result-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop into a bowl. Reserve the pint for the finish — brownie + whipped cream + cocoa go on top of the scooped Creami, not the pint.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/step-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Chop Brownie","text":"Chop 1/3 of a Mid-Day Squares chocolate brownie into rustic bite-sized pieces. Garnish only — the brownie does NOT go through the machine.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/step-chop-brownie-square-polished.webp"},{"@type":"HowToStep","name":"Garnish + Whip + Dust","text":"Scatter the chopped brownie over the scoop. Add 1 tbsp sugar-free whipped cream. Light Dutch cocoa dusting on top for the mud-pie finish. Eat immediately — the cocoa-graham crunch is best in the first 2-3 minutes.","image":"https://thesplitplate.com/images/mississippi-mud-pie-cookie-creami/step-add-brownie-garnish-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"390 calories","proteinContent":"46g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Make-ahead, Dark-chocolate"}</scrip
