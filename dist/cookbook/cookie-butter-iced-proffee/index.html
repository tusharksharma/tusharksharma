    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cookie Butter Iced Proffee","description":"A concentrate-first protein coffee technique now carries cookie butter and Biscoff. 210 cal / 22g protein per glass (1:9.5 protein-to-cal), 5-minute build. Whey blends into a hot coffee concentrate with a crushed Biscoff cookie, then ice + fat-free ultra-filtered milk + cookie-butter rim + whipped topping + a second Biscoff crumble finish.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/hero-cookie-butter-iced-proffee-polished.webp","totalTime":"PT5M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Sauce","recipeCuisine":"American","recipeIngredient":["1 Biscoff cookie, crushed (goes INTO the concentrate — 1 more for the top later)","1/2 tbsp instant coffee","1/2 serving unflavored whey isolate (~14g protein — adjust by brand)","2 tsp monk fruit / erythritol sweetener","2-3 tbsp hot water (hot but NOT boiling — start with 2 tbsp, add the third only if needed)","Ice, as needed","1/2 cup Fairlife fat-free ultra-filtered milk","1 tsp cookie butter spread (for the rim — see step 5 for cleanest application)","1 tbsp sugar-free whipped topping","1 Biscoff cookie, crushed (garnish over the whipped topping)"],"recipeInstructions":[{"@type":"HowToStep","name":"Crush First Biscoff","text":"Crush 1 Biscoff cookie into the bottom of a tall blending cup. This cookie goes INSIDE the concentrate for spice depth throughout the drink; the second cookie stays whole for the garnish at the end.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-01-crush-biscoff-polished.webp"},{"@type":"HowToStep","name":"Add Coffee + Whey + Sweetener","text":"1/2 tbsp instant coffee, 1/2 serving unflavored whey isolate, and 2 tsp monk fruit sweetener into the blending cup with the crushed Biscoff.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-03-add-whey.webp"},{"@type":"HowToStep","name":"Add Hot Water","text":"2 tbsp hot (NOT boiling) water. Start with 2 tbsp; add the third only if the concentrate needs help moving. Hot water pulls flavor from the crushed Biscoff and dissolves the coffee faster than cold; not-quite-boiling protects the whey from denaturing.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-05-add-hot-water.webp"},{"@type":"HowToStep","name":"Blend Smooth","text":"Submerge the immersion-blender head BEFORE turning it on (splatter control). Blend until the concentrate is smooth with zero visible protein clumps or Biscoff chunks. This is the Proffee-series technique differentiator — whey dissolves into the hot concentrate NOW, not into cold milk later.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-06-blend-smooth-polished.webp"},{"@type":"HowToStep","name":"Rim The Serving Glass (recommended)","text":"Spread 1 tsp cookie butter around the rim of the SERVING glass while it's still empty — much cleaner than rimming a full drink. The filmed video builds the entire drink in one cup, which works but is harder to keep tidy. If following the video's one-cup method, rim carefully with the drink already in place.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-09-cookie-butter-rim-polished.webp"},{"@type":"HowToStep","name":"Add Ice + Milk","text":"Fill the rimmed serving glass with ice. Pour the concentrate over the ice, then add 1/2 cup Fairlife fat-free ultra-filtered milk. Fat-free is the macro-honesty pick — 2% pushes calories without adding protein.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-08-add-milk-polished.webp"},{"@type":"HowToStep","name":"Top With Whipped Topping","text":"Add 1 tbsp sugar-free whipped topping in a swirl over the drink.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-10-whipped-topping-polished.webp"},{"@type":"HowToStep","name":"Garnish + Serve","text":"Crush the second Biscoff cookie over the whipped topping. Serve immediately — the whipped topping softens against the cold drink after 1-2 minutes.","image":"https://thesplitplate.com/images/cookie-butter-iced-proffee/step-11-biscoff-garnish-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"210 calories","proteinContent":"22g"},"keywords":"Morning coffee, Afternoon Powerup, Adult drink, High-protein, No cook, 5-minute build, Cookie butter, Biscoff"}</script>
