    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Nilla Bean Float Cookie Creami","description":"Cola-float-inspired protein Creami with vanilla, black cocoa, 1/4 cup Diet Coke in the base, and salted-caramel CocoRolls through Respin + on top. 340 cal / 43g protein whole pint. Slightly icier than a standard base — honest review.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/hero-finished-nilla-bean-float-cookie-creami-polished.webp","totalTime":"PT1455M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1/2 tsp vanilla","1 tbsp black cocoa","1/4 cup Diet Coke (any diet cola — extra volume + slightly icier texture)","1/2 serving salted-caramel CocoRolls","1/4 serving salted-caramel CocoRolls"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Base","text":"Combine Fairlife 2% milk + monk fruit + whey isolate + guar gum + salt + 1/2 tsp vanilla + 1 tbsp black cocoa + 1/4 cup Diet Coke. Immersion blender until completely smooth. Zero lumps.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/context-vanilla.webp"},{"@type":"HowToStep","name":"Add Black Cocoa","text":"Black cocoa (1 tbsp) supplies the float-adjacent dark identity. Regular cocoa reads brown-brown; black cocoa reads cola-black — the color and flavor cue are both from this ingredient.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/step-add-black-cocoa-polished.webp"},{"@type":"HowToStep","name":"Add Diet Cola","text":"1/4 cup diet cola stirred into the base pre-freeze. Volume goes up ~25% vs a standard base — the trade is a slightly icier texture. Any diet cola works; Diet Coke is what the creator filmed.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/step-add-diet-cola-polished.webp"},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Pour into a Creami pint, keeping the mixture below the max-fill line. Freeze upright and level for a full 24 hours.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/step-add-diet-cola-polished.webp"},{"@type":"HowToStep","name":"Rest + Spin","text":"Pull the pint from the freezer, rest at ROOM TEMPERATURE for 5 minutes. Process on Regular Ice Cream. Powdery after the first spin is expected — the Respin fixes it.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/step-first-spin-result-polished.webp"},{"@type":"HowToStep","name":"Mix-in","text":"Make a narrow center well. Drop in 1/2 serving of salted-caramel CocoRolls. Run RESPIN without adding liquid — the cola is already in the base.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/step-add-cocorolls-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop into a bowl. Volume will be noticeably taller than a standard pint — the cola quarter-cup shows up here.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/step-scooped-bowl-polished.webp"},{"@type":"HowToStep","name":"Top + Serve","text":"Finish with another 1/4 serving of CocoRolls — added AFTER all machine processing so they stay crunchy. Eat immediately.","image":"https://thesplitplate.com/images/nilla-bean-float-cookie-creami/step-cocorolls-topping-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"340 calories","proteinContent":"43g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Make-ahead"}</script>
