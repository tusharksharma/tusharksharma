ages/pink-berry-cookie-creami/step-frozen-base-polished.webp"},{"@type":"HowToStep","name":"Mix-in","text":"Make a narrow center well. Drop in half a serving of vanilla wafers. Run RESPIN without adding liquid.","image":"https://thesplitplate.com/images/pink-berry-cookie-creami/step-add-vanilla-wafers-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop into a bowl. The Respin should give a smooth, evenly-mixed pink base with visible wafer pockets.","image":"https://thesplitplate.com/images/pink-berry-cookie-creami/step-respin-result-polished.webp"},{"@type":"HowToStep","name":"Top + Serve","text":"Finish with 4g freeze-dried strawberries — added AFTER all machine processing so they stay crunchy. Eat immediately.","image":"https://thesplitplate.com/images/pink-berry-cookie-creami/step-freeze-dried-strawberries-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"315 calories","proteinContent":"43g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Make-ahead"}</script>
