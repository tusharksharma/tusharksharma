    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"S'mores Iced Proffee","description":"A concentrate-first protein coffee technique with a thin marshmallow-creme + graham rim, two toasted marshmallows, and a sugar-free chocolate drizzle. 150 cal / 22g protein per glass, 5-minute build.","image":"https://thesplitplate.com/images/smores-iced-proffee/hero-smores-iced-proffee-polished.webp","totalTime":"PT5M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Sauce","recipeCuisine":"American","recipeIngredient":["very thin smear marshmallow creme (rim coat only — a heavy layer overwhelms the drink and messes up the glass)","1/2 sheet graham cracker, crushed on a plate","1 tbsp instant coffee (creator's strong-coffee dose; use 1/2 tbsp for a milder drink)","1/2 serving unflavored whey isolate (~14g protein — adjust by brand)","2 tsp monk fruit / erythritol sweetener","2-3 tbsp hot water (hot but NOT boiling — start with 2 tbsp, add the third only if needed)","Ice, as needed","1/2 cup Fairlife fat-free ultra-filtered milk","2 pieces Max Mallow marshmallows (or equivalent low-calorie marshmallows — macros vary by brand)","1/2 tbsp sugar-free chocolate syrup, for drizzling"],"recipeInstructions":[{"@type":"HowToStep","name":"Build The S'mores Rim","text":"Spread a VERY THIN smear of marshmallow creme around the rim of a tall serving glass. Crush half a graham cracker sheet on a plate and press the coated rim into the crumbs. Rim coat only — a heavy layer overwhelms the coffee and makes the glass messy.","image":"https://thesplitplate.com/images/smores-iced-proffee/step-02-graham-cracker-rim-polished.webp"},{"@type":"HowToStep","text":"BUILD THE CONCENTRATE (into the rimmed glass): 1 tbsp instant coffee + 1/2 serving unflavored whey isolate + 2 tsp monk fruit sweetener. Blend the whey into the concentrate FIRST — this is the Proffee-series spine that prevents clumps.","image":"https://thesplitplate.com/images/smores-iced-proffee/step-04-add-whey-isolate-polished.webp"},{"@type":"HowToStep","name":"Add Hot Water + Froth","text":"2 tbsp hot (not boiling) water. Submerge the frother head BEFORE turning it on for splatter control. Froth until the concentrate is completely smooth. Add the third tbsp only if it needs help moving.","image":"https://thesplitplate.com/images/smores-iced-proffee/step-07-froth-smooth-polished.webp"},{"@type":"HowToStep","name":"Add Ice + Milk","text":"Fill the glass with ice, then pour in 1/2 cup Fairlife fat-free ultra-filtered milk. Stir gently.","image":"https://thesplitplate.com/images/smores-iced-proffee/step-09-add-ultra-filtered-milk-polished.webp"},{"@type":"HowToStep","name":"Toast The Marshmallows Safely","text":"Place the two Max Mallow marshmallows on a heat-safe skewer or utensil and torch them AWAY from the glass and any plastic. Skewer method is the safest and cleanest — never torch marshmallows already sitting in the drink. Set the toasted marshmallows over the glass.","image":"https://thesplitplate.com/images/smores-iced-proffee/step-11-toast-marshmallows-polished.webp"},{"@type":"HowToStep","name":"Finish + Serve","text":"Drizzle 1/2 tbsp sugar-free chocolate syrup over the toasted marshmallows and serve immediately. Marshmallow rim softens against ambient humidity in ~5 minutes.","image":"https://thesplitplate.com/images/smores-iced-proffee/step-12-chocolate-drizzle-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"150 calories","proteinContent":"22g"},"keywords":"Morning coffee, Afternoon Powerup, Adult drink, High-protein, No cook, 5-minute build, S'mores flavor, Campfire cravings"}</script>
