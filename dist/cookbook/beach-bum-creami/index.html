    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Beach Bum Creami","description":"Blue protein Creami with graham cracker Respun through the pint, honey drizzle, and a Teddy Graham standing inside a peach ring like a beach bum on a float. ~340 cal / 42g protein whole pint.","image":"https://thesplitplate.com/images/beach-bum-creami/hero-finished-beach-bum-creami-polished.webp","totalTime":"PT1460M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"American","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","A few drops blue food coloring","1 graham cracker (~65 cal, roughly 1 full sheet Honey Maid or equivalent)","1 tsp honey (~30 cal)","1 peach gummy ring","1 Teddy Graham (the beach bum on the float)"],"recipeInstructions":[{"@type":"HowToStep","name":"Pour Milk","text":"Add 1 cup Fairlife 2% ultra-filtered milk to a Creami pint (or blending vessel).","image":"https://thesplitplate.com/images/beach-bum-creami/step-01-two-percent-milk.webp"},{"@type":"HowToStep","name":"Add Sweetener","text":"2 tbsp monk fruit / erythritol sweetener. Series-standard sweetener.","image":"https://thesplitplate.com/images/beach-bum-creami/step-02-monk-fruit.webp"},{"@type":"HowToStep","name":"Add Whey Isolate","text":"1 serving unflavored whey isolate. Aim for ~28g protein — brands vary, read the scoop.","image":"https://thesplitplate.com/images/beach-bum-creami/step-03-whey-isolate.webp"},{"@type":"HowToStep","name":"Add Guar Gum","text":"1/8 tsp guar gum, LEVEL measure. Heaped = gummy texture. The single measurement in the base you have to get right.","image":"https://thesplitplate.com/images/beach-bum-creami/step-04-guar-gum.webp"},{"@type":"HowToStep","name":"Add Salt","text":"1 pinch salt. Series-standard base ingredients now all in the vessel.","image":"https://thesplitplate.com/images/beach-bum-creami/step-05-salt.webp"},{"@type":"HowToStep","name":"Add Blue Food Color","text":"A few drops of blue food coloring, added BEFORE the blend so it distributes evenly through the base pre-freeze. Start with 3-4 drops — you can always add more, harder to walk back neon blue.","image":"https://thesplitplate.com/images/beach-bum-creami/step-06-blue-food-color-polished.webp"},{"@type":"HowToStep","name":"Blend Smooth","text":"Immersion blender until completely smooth and evenly blue. Zero lumps, zero visible whey, uniform color.","image":"https://thesplitplate.com/images/beach-bum-creami/step-07-blend-blue-base.webp"},{"@type":"HowToStep","text":"FREEZE (24 HR) + REST 5 MIN + FIRST SPIN: Freeze the pint upright and level for a full 24 hours. Rest at ROOM TEMPERATURE for 5 minutes — NO hot-water bath. Process on Regular Ice Cream, NOT Lite. The first spin may look powdery; that's expected because the Respin (with graham) finishes the texture.","image":"https://thesplitplate.com/images/beach-bum-creami/step-08-first-spin-result-polished.webp"},{"@type":"HowToStep","name":"Add Graham Cracker","text":"Break one full graham cracker sheet into small pieces over the first-spin pint. Poke pieces into the surface — Respin distributes them through the whole pint.","image":"https://thesplitplate.com/images/beach-bum-creami/step-09-add-graham-cracker.webp"},{"@type":"HowToStep","name":"Respin","text":"Run one Respin cycle. This is the technique differentiator vs W2F1 (Pineapple Whip had no mix-in). Respin distributes the graham crumb throughout the pint AND finishes the powdery texture from the first spin.","image":"https://thesplitplate.com/images/beach-bum-creami/step-10-respin-result-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop the finished pint into a bowl. Blue Creami with visible graham crumb pulled through.","image":"https://thesplitplate.com/images/beach-bum-creami/step-11-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Honey Drizzle","text":"Drizzle 1 tsp honey over the scoops. Threads through the blue and picks up the floral note that connects to the peach-gummy garnish.","image":"https://thesplitplate.com/images/beach-bum-creami/step-12-honey-drizzle-polished.webp"},{"@type":"HowToStep","name":"Peach Ring Float","text":"Place one peach gummy ring on top of the scoops. This is the inner-tube shape for the Teddy.","image":"https://thesplitplate.com/images/beach-bum-creami/step-13-peach-ring-float-polished.webp"},{"@type":"HowToStep","name":"Teddy Graham Garnish","text":"Stand one Teddy Graham upright inside the peach ring — beach bum on the float. Serve immediately, before the Teddy softens.","image":"https://thesplitplate.com/images/beach-bum-creami/step-14-teddy-graham-garnish.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"340 calories","proteinContent":"42g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Kid-fun garnish, Make-ahead"}</script>
