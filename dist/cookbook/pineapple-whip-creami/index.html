    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Pineapple Whip Creami","description":"Pineapple-fruit-cup + yellow-color stirred into the standard base BEFORE freezing (no machine mix-in), Regular Ice Cream cycle, graham crumble on top. ~340 cal / 42g protein whole pint vs the 760-cal Crumbl Pineapple Whip Cookie on the current Gawinder listing.","image":"https://thesplitplate.com/images/pineapple-whip-creami/hero-finished-pineapple-whip-creami-polished.webp","totalTime":"PT1453M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1 single-serve pineapple tidbits fruit cup in 100% juice (~60 cal)","A few drops yellow food coloring (optional, for visual cue)","40 cal graham crackers, crushed (roughly 1/2 sheet Honey Maid or equivalent)"],"recipeInstructions":[{"@type":"HowToStep","name":"Pour Milk","text":"Add 1 cup Fairlife 2% ultra-filtered milk to a Creami pint (or blending vessel).","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-01-two-percent-milk.webp"},{"@type":"HowToStep","name":"Add Sweetener","text":"2 tbsp monk fruit / erythritol sweetener. Same series-standard sweetener as the Week 1 flavors.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-02-monk-fruit.webp"},{"@type":"HowToStep","name":"Add Whey Isolate","text":"1 serving unflavored whey isolate. Aim for ~28g protein — brands vary, so read the scoop.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-03-whey-isolate.webp"},{"@type":"HowToStep","name":"Add Guar Gum","text":"1/8 tsp guar gum, LEVEL measure. Heaped = gummy texture. This is the single measurement in the base you actually have to get right.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-04-guar-gum.webp"},{"@type":"HowToStep","name":"Add Salt","text":"1 pinch salt. Blend the whole base — immersion blender until completely smooth. Zero lumps. Zero visible whey.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-05-salt.webp"},{"@type":"HowToStep","name":"Stir in Pineapple","text":"Add the entire single-serve pineapple tidbits fruit cup (juice + fruit). STIR IT IN — do NOT blend. Preserve the pineapple tidbits so they carry through the finished pint. This is the technique twist that makes this flavor.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-06-add-pineapple-polished.webp"},{"@type":"HowToStep","name":"Add Yellow Color","text":"A few drops of yellow food coloring. Optional but recommended — the visual cue is what makes the finished pint read as Pineapple Whip on first look. Stir to distribute.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-07-yellow-food-color-polished.webp"},{"@type":"HowToStep","name":"Gently Blend / Stir","text":"Stir the pineapple + color through the base until evenly distributed. Do not over-work — the goal is tidbits suspended in colored base, not a smooth pineapple puree.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-08-blend-pineapple-base.webp"},{"@type":"HowToStep","name":"Pint Ready to Freeze","text":"Pour into a Creami pint (if you didn't build in the pint already), staying below the max-fill line. Cap and set upright on a level freezer shelf.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-09-pineapple-base-ready-polished.webp"},{"@type":"HowToStep","text":"FREEZE (24 HR) + REST 5 MIN + PROCESS REGULAR ICE CREAM: Full 24 hours upright and level. Rest at ROOM TEMPERATURE for 5 minutes — NO hot-water bath. Process on Regular Ice Cream, NOT Lite. If the first spin comes out powdery, run ONE Respin. Otherwise scoop immediately.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-10-regular-ice-cream-result-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop the finished pint into a bowl. Pineapple tidbits should be visible pulled through the pale-yellow Creami.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-11-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Graham Finish","text":"Crush ~40 cal of graham crackers over the scoops (roughly 1/2 sheet). Serve immediately — graham softens fast on ice cream.","image":"https://thesplitplate.com/images/pineapple-whip-creami/step-12-graham-finish.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"340 calories","proteinContent":"42g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Pineapple, Make-ahead"}</script>
