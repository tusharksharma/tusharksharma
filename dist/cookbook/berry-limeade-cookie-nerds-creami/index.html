    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Berry Limeade Cookie ft. NERDS Gummy Clusters Creami","description":"Naturally purple mixed-berry + lime-Jell-O protein Creami pint, Rainbow NERDS Gummy Clusters Respin, and more candy on top. ~350 cal / 44g protein whole pint. No food coloring — color comes from the berries.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/hero-finished-berry-limeade-nerds-creami-polished.webp","totalTime":"PT1461M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"American","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1/2 cup frozen mixed berries (Good & Gather Mixed Berry Blend filmed — any unsweetened frozen mixed berries work)","1 tsp regular lime Jell-O powder (NOT sugar-free — the recipe leverages regular Jell-O gelatin behavior with the guar gum)","1/3 labeled serving Rainbow NERDS Gummy Clusters, chopped small","1/3 labeled serving Rainbow NERDS Gummy Clusters, chopped small (the second 1/3 for the topping)"],"recipeInstructions":[{"@type":"HowToStep","name":"Pour Milk","text":"Add 1 cup Fairlife 2% ultra-filtered milk to a blender."},{"@type":"HowToStep","name":"Add Sweetener","text":"2 tbsp monk fruit / erythritol sweetener."},{"@type":"HowToStep","name":"Add Whey Isolate","text":"1 serving unflavored whey isolate."},{"@type":"HowToStep","name":"Add Guar Gum","text":"1/8 tsp guar gum, LEVEL measure. Heaped = gummy."},{"@type":"HowToStep","name":"Add Salt","text":"1 pinch salt."},{"@type":"HowToStep","name":"Add Berries","text":"1/2 cup frozen mixed berries. Series-first — no prior CCC episode used whole frozen berries in the base. The purple color comes entirely from the berries; NO food coloring is used.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/context-frozen-mixed-berries-polished.webp"},{"@type":"HowToStep","name":"Add Lime Jell-o","text":"1 tsp REGULAR lime Jell-O powder (NOT sugar-free). Series-first — no prior CCC episode used gelatin dessert powder in the base. Regular Jell-O's gelatin behavior collaborates with the guar gum on texture; sub sugar-free and the texture math shifts.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/context-lime-jello.webp"},{"@type":"HowToStep","name":"Blend Smooth","text":"Blend until completely smooth and evenly purple. Zero visible berry chunks, uniform color from the berries."},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Transfer to a Creami pint. Freeze upright and level for a full 24 hours. Do not exceed the max-fill line."},{"@type":"HowToStep","name":"Rest 5 Min + First Spin","text":"Pull the pint from the freezer, rest at ROOM TEMPERATURE for 5 minutes — NO hot-water bath. Process on Regular Ice Cream, NOT Lite. The first spin may look grainy; expected because the Respin (with NERDS pieces) finishes the texture.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/step-regular-ice-cream-polished.webp"},{"@type":"HowToStep","name":"Chop Nerds","text":"Chop 2/3 labeled serving of Rainbow NERDS Gummy Clusters into small pieces — half becomes the Respin mix-in, half becomes the post-scoop topping. Series-first: this is the first CCC ep to use CANDY (not a protein brownie or bar) as the Respin mix-in.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/context-nerds-gummy-clusters.webp"},{"@type":"HowToStep","name":"Add Mix-in + Respin","text":"Poke 1/3 labeled serving of chopped NERDS (half of what you chopped) into the surface of the first-spin pint. Run one Respin cycle WITHOUT adding liquid. Respin distributes the candy pieces AND finishes the grainy texture from the first spin.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/step-add-nerds-mixin-polished.webp"},{"@type":"HowToStep","name":"Respin Result","text":"The finished Respin should show visible candy pieces distributed through the purple pint with a smooth, non-grainy Creami texture. If the texture still reads powdery, run a second Respin.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/step-respin-result-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop the finished pint into a bowl. Naturally purple Creami with visible candy pieces pulled through.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/step-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Nerds Topping + Serve","text":"Scatter the remaining 1/3 labeled serving of chopped NERDS over the top. Serve immediately — candy stays crunchy against the creamy Creami, and the Jell-O-set texture holds a scoop. Whole pint = 1 serving at ~350 cal / 44g protein.","image":"https://thesplitplate.com/images/berry-limeade-cookie-nerds-creami/final-nerds-topping-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"350 calories","proteinContent":"44g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Berry, Lime, NERDS-inspired, Make-ahead"}</script>
