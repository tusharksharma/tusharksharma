    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Cheesecake Fudgy Bars","description":"Inspired by Nora's fudgy bars, rebuilt Split Plate. 8 bars across 2 containers, 170 cal / 15g protein each, three cold layers.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/hero-layered-cheesecake-fudgy-bar-polished.webp","recipeYield":"8","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"American","recipeIngredient":["1 1/2 cups almond flour","1/2 cup black cocoa powder","1/2 cup sugar-free maple syrup","1/2 cup ultra-filtered whole milk (Fairlife)","1 tsp vanilla extract","150g 2% cottage cheese","150g nonfat Greek yogurt","112g Neufchâtel cheese (4 oz)","2 scoops (62g) vanilla whey-casein protein powder","3 tbsp (36g) allulose + monk-fruit sweetener","1/4 cup unsweetened cocoa powder","1/4 cup sugar-free maple syrup"],"recipeInstructions":[{"@type":"HowToStep","name":"Mix The Fudge Base","text":"Stir the almond flour, black cocoa, sugar-free maple syrup, Fairlife whole milk, and vanilla into a thick, fudgy dough. It should hold together like brownie batter that's been chilling — scoopable, not pourable.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/step-01-mix-chocolate-base-polished.webp"},{"@type":"HowToStep","name":"Press Into Two Containers + Freeze 1 hr","text":"Divide the base between two parchment-lined containers and press into even, firm bases (a flat-bottomed glass helps pack it down). Freeze 1 hour. Packing it firm here is what lets the bars cut clean later.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/step-02-press-base-polished.webp"},{"@type":"HowToStep","name":"Blend The Cheesecake Center — no Coffee","text":"Blend the cottage cheese ALONE first until completely silky (no surviving curds). Then add the Greek yogurt, Neufchâtel (in chunks), whey-casein, and allulose+monk. Blend thick and smooth. This is the protein-tiramisu cream with an extra ounce of cream cheese and zero coffee — it reads as pure cheesecake here.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/step-03-blend-cheesecake-center-polished.webp"},{"@type":"HowToStep","name":"Spread The Cream + Freeze 1 hr","text":"Divide the cheesecake cream over the two frozen bases and spread even. Freeze another 1 hour so the center firms up before the topping goes on — otherwise the warm topping melts a groove into it.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/step-04-spread-cheesecake-polished.webp"},{"@type":"HowToStep","name":"Mix The Fudgy Topping","text":"Stir the unsweetened cocoa and sugar-free maple syrup until glossy and smooth. Equal parts — it thickens into a spreadable fudge as you stir.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/step-05-mix-fudgy-topping-polished.webp"},{"@type":"HowToStep","name":"Spread The Topping","text":"Spread the fudgy topping over both set cheesecake layers in an even coat. Work quickly and gently so you don't drag the cream up into it.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/step-06-spread-fudgy-topping-polished.webp"},{"@type":"HowToStep","name":"Freeze 1 Final Hr, Cut + Serve Cold","text":"Freeze one last hour. Cut into 8 bars total across the two containers. Serve fridge-cold, NOT frozen solid — let them sit a few minutes out of the freezer so the cheesecake center goes creamy between the two fudgy layers.","image":"https://thesplitplate.com/images/high-protein-cheesecake-fudgy-bars/final-cheesecake-fudgy-bar-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"170 calories","proteinContent":"15g"},"keywords":"Make-ahead, Dessert, Meal-prep, High protein, Cutting-friendly"}</script>
