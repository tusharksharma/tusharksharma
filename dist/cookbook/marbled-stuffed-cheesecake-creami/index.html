    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Marbled Stuffed Cheesecake Creami","description":"Two-freeze marbled chocolate + vanilla protein Creami pint, stuffed with frozen cheesecake frosting + Lily's chips + Teddy Graham finish. 335 cal / 45g protein whole pint.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/hero-finished-marbled-stuffed-cheesecake-creami-polished.webp","totalTime":"PT2895M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"American","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1/2 tbsp black cocoa","15g Protein Cheesecake Frosting (~1/2 serving; freeze firm and chop — cross-recipe /cookbook/protein-cheesecake-frosting)","7g Lily's milk-chocolate-style baking chips","7g Teddy Grahams (crushed)"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Base","text":"Combine Fairlife 2% milk + monk fruit + whey isolate + guar gum + salt. Immersion blender until completely smooth. Zero lumps — Creami texture depends on this.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/step-01-blend-base-polished.webp"},{"@type":"HowToStep","name":"Split + Chocolate Half","text":"Divide the base evenly into two portions. Blend 1/2 tbsp black cocoa into ONE half. Keep the vanilla half in a covered container.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/step-02-add-black-cocoa-polished.webp"},{"@type":"HowToStep","name":"Freeze #1 (24 Hr)","text":"Pour the chocolate half into a level Creami pint. Freeze upright for 24 hours. Keep the reserved vanilla half covered + refrigerated during this window.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/step-02-add-black-cocoa-polished.webp"},{"@type":"HowToStep","name":"Freeze #2 (24 Hr)","text":"Pour the vanilla half OVER the fully-frozen chocolate layer. Freeze upright for another 24 hours. Two layers, two freezes — this is the marbling technique.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/step-03-add-vanilla-layer-polished.webp"},{"@type":"HowToStep","name":"Prep Frosting","text":"While the pint finishes freezing, freeze 15g [Protein Cheesecake Frosting](/cookbook/protein-cheesecake-frosting) until firm (~30 min in the freezer). Chop into small mix-in pieces.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/step-05-chop-cheesecake-frosting-polished.webp"},{"@type":"HowToStep","name":"Spin","text":"Briefly run warm water over the OUTSIDE of the frozen pint to release the layers. Process on Regular Ice Cream (NOT Lite). Use Respin if the first spin comes out powdery.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/step-04-frozen-marbled-layers-polished.webp"},{"@type":"HowToStep","name":"Mix-in","text":"Make a narrow center well in the spun ice cream. Drop in the chopped frozen frosting pieces + 7g Lily's chips. Run the Mix-In cycle.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/step-06-add-mix-ins-polished.webp"},{"@type":"HowToStep","name":"Finish + Serve","text":"Scoop into a bowl. Top with 7g crushed Teddy Grahams — added AFTER all machine cycles so they stay crisp. Eat immediately.","image":"https://thesplitplate.com/images/marbled-stuffed-cheesecake-creami/hero-finished-marbled-stuffed-cheesecake-creami-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"335 calories","proteinContent":"45g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Make-ahead"}</script>
