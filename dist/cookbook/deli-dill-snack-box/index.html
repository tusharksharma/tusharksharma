    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Deli Dill Snack Box","description":"Deli-plate energy at snack-box scale. 2.5 oz deli turkey + cubed Colby Jack + petite dill pickles + pretzel crisps. About 250 cal / 20g protein per box. Ep. 8 returns to shelf-stable proteins after Ep. 7's first-hot-protein Tropical Chicken. Make four at once for 2 kids × 2 days.","image":"https://thesplitplate.com/images/deli-dill-snack-box/hero-deli-dill-snack-box-polished.webp","totalTime":"PT10M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeIngredient":["2.5 oz deli turkey (or 3 oz for hungrier kids)","1 Colby Jack cheese stick, cubed","3-4 petite dill pickles","0.75 oz pretzel crisps","10 oz deli turkey (or 12 oz for the hungrier version)","4 Colby Jack cheese sticks","12-16 petite dill pickles","3 oz pretzel crisps"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"Set out four divided snack boxes (4-compartment Bento-style — same format as Snack Box Series Ep. 1-7). Deli turkey is shelf-stable pre-open; no cooking needed. Ep. 8 returns to shelf-stable proteins after Ep. 7's cooked-fajita-chicken exception.","image":"https://thesplitplate.com/images/deli-dill-snack-box/hero-deli-dill-snack-box-polished.webp"},{"@type":"HowToStep","name":"Turkey","text":"Divide 10 oz deli turkey into 4 boxes — 2.5 oz per box. Any oven-roasted deli turkey works (Hillshire Farm Premium Carved shown; brand-neutral by default). For hungrier kids or adult mini-meal, bump to 3 oz per box (12 oz total).","image":"https://thesplitplate.com/images/deli-dill-snack-box/step-01-divide-turkey-polished.webp"},{"@type":"HowToStep","name":"Colby Jack","text":"Cube one Colby Jack cheese stick per box and add to the second compartment. Cube size = 1/2-inch or smaller for young kids. Colby Jack is milder than sharp cheddar — kid-friendly by default. Uniform cube size = no compartment ends up with awkward pieces.","image":"https://thesplitplate.com/images/deli-dill-snack-box/step-02-add-colby-jack-polished.webp"},{"@type":"HowToStep","name":"Pickles","text":"Add 3-4 petite dill pickles per box to the third compartment (Mt. Olive Kosher Dill Petites shown). This is the flavor-identity moment — kids either love it or reject it, which is the caption's engagement hook. For under-4s, slice petites lengthwise to reduce choking risk; over 4s handle whole petites fine with supervision.","image":"https://thesplitplate.com/images/deli-dill-snack-box/step-03-add-pickles-polished.webp"},{"@type":"HowToStep","name":"Pretzels","text":"Add 0.75 oz pretzel crisps (Snack Factory Original shown) to the DRY compartment — critical to keep pretzels away from pickle moisture, else they soften in the sealed box within hours. Pretzel crisps are flat and thin so they hold better than round hard pretzels, but still separate compartments.","image":"https://thesplitplate.com/images/deli-dill-snack-box/step-04-add-pretzels-polished.webp"},{"@type":"HowToStep","name":"Lid + Chill","text":"Snap lids on and refrigerate immediately. Assembled boxes hold up to 3 days for the turkey + cheese (deli turkey has wider cold-chain tolerance than Ep. 7's cooked chicken). Pretzels stay crunchy for 2-3 days if separated from pickle moisture in the box. For lunchboxes, pack with an ice pack.","image":"https://thesplitplate.com/images/deli-dill-snack-box/final-stacked-snack-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"250 calories","proteinContent":"20g"},"keywords":"Post-lunch snack, After-school snack, Kids snack prep, Make once snack twice, Weekend snack, Higher protein, Batch (2 kids × 2 days)"}</script>
