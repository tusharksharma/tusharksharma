    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Strawberry Brownie Cheesecake Snack Box","description":"Dessert-inspired kid snack box: Oikos Triple Zero strawberry yogurt, Prime Bites red velvet protein brownie, Honey Maid graham crackers, fresh strawberries. ~230 cal / 19g protein per box.","image":"https://thesplitplate.com/images/strawberry-brownie-cheesecake-snack-box/hero-strawberry-brownie-cheesecake-snack-box-polished.webp","totalTime":"PT12M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeCuisine":"American","recipeIngredient":["2 single-serve containers Oikos Triple Zero Strawberry Greek yogurt — divided across 4 boxes; 1/2 container per box","2 Prime Bites Red Velvet Protein Brownies — 1/2 brownie per box (~10g protein per half)","4 Honey Maid honey graham cracker sheets — 1 sheet per box (~60 cal per sheet)","Fresh strawberries — hulled and cut to fill each box"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"Line up 4 divided snack boxes. Buluker pastel 4-compartment boxes shown — the same set featured on Favorites → Snack Box Essentials.","image":"https://thesplitplate.com/images/strawberry-brownie-cheesecake-snack-box/hero-strawberry-brownie-cheesecake-snack-box-polished.webp"},{"@type":"HowToStep","name":"Strawberry Yogurt","text":"Divide each Oikos Triple Zero container between 2 boxes — 1/2 container per box in one compartment. This is the creamy anchor + the fresh-strawberry dip.","image":"https://thesplitplate.com/images/strawberry-brownie-cheesecake-snack-box/step-01-portion-strawberry-yogurt-polished.webp"},{"@type":"HowToStep","name":"Fresh Strawberries","text":"Hull and cut fresh strawberries into kid-friendly bite pieces, then fill one compartment of each box. Strawberries + yogurt = the cheesecake half of the box.","image":"https://thesplitplate.com/images/strawberry-brownie-cheesecake-snack-box/step-02-add-strawberries-polished.webp"},{"@type":"HowToStep","name":"Honey Graham","text":"Place 1 Honey Maid honey graham cracker sheet in one compartment of each box. Break into smaller pieces for younger eaters if needed — the crackers stay crispest when packed WHOLE and broken at snack time.","image":"https://thesplitplate.com/images/strawberry-brownie-cheesecake-snack-box/step-03-add-graham-cracker-polished.webp"},{"@type":"HowToStep","name":"Red Velvet Brownie","text":"Cut each Prime Bites Red Velvet Protein Brownie in half and place one half in the remaining compartment of each box. The fudgy dessert element without a full dessert plate.","image":"https://thesplitplate.com/images/strawberry-brownie-cheesecake-snack-box/step-04-add-protein-brownie-polished.webp"},{"@type":"HowToStep","name":"Seal + Chill","text":"Snap lids on and refrigerate. Serve within 2 days. Transport with an ice pack for lunchbox use. Graham cracker softens in a closed box — pack a whole cracker and let the kid break it if you want crisper crunch.","image":"https://thesplitplate.com/images/strawberry-brownie-cheesecake-snack-box/final-four-strawberry-brownie-cheesecake-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"230 calories","proteinContent":"19g"},"keywords":"Kid snack, Snack box, After-school snack, Dessert-vibe snack, Batch snack prep, Higher-protein snack, No cook"}</script>
