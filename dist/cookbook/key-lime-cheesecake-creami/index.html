    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Key Lime Cheesecake Creami","description":"Green protein Creami with 2 tsp lime gelatin mix in the base, 15g frozen Protein Cheesecake Frosting Respun through the pint, crisp graham finish. ~350 cal / 42g protein whole pint. First cross-recipe Creami — chains to the existing Protein Cheesecake Frosting cookbook entry.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/hero-finished-key-lime-cheesecake-creami-polished.webp","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","2 level tsp regular lime gelatin dessert mix (~7-8g, ~30 cal — see substitutions for halal/pork-free notes)","5 drops green food coloring","15g frozen Protein Cheesecake Frosting, chopped small (~30 cal) — use the cookbook recipe","60 cal graham crackers, crushed (roughly 1 sheet Honey Maid or equivalent)"],"recipeInstructions":[{"@type":"HowToStep","name":"Pour Milk","text":"Add 1 cup Fairlife 2% ultra-filtered milk to a Creami pint (or blending vessel).","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-01-two-percent-milk.webp"},{"@type":"HowToStep","name":"Add Sweetener","text":"2 tbsp monk fruit / erythritol sweetener.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-02-monk-fruit.webp"},{"@type":"HowToStep","name":"Add Whey Isolate","text":"1 serving unflavored whey isolate.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-03-whey-isolate.webp"},{"@type":"HowToStep","name":"Add Guar Gum","text":"1/8 tsp guar gum, LEVEL measure. Heaped = gummy.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-04-guar-gum.webp"},{"@type":"HowToStep","name":"Add Salt","text":"1 pinch salt.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-05-salt.webp"},{"@type":"HowToStep","name":"Add Lime Gelatin Mix","text":"2 LEVEL teaspoons regular lime gelatin dessert mix (about 7-8g, ~30 cal). This is the flavor carrier — 2 level tsp is the right dose. More reads too tart; less doesn't land as Key Lime. Verify package for halal/pork-free suitability (gelatin source often unspecified — see substitutions).","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-06-lime-gelatin-mix.webp"},{"@type":"HowToStep","name":"Add Green Color","text":"5 drops green food coloring. Distributed pre-blend so the finished base is uniformly green.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-07-green-food-color.webp"},{"@type":"HowToStep","name":"Blend Smooth","text":"Immersion blender until completely smooth and evenly green. Zero lumps, zero visible whey, uniform color. The lime gelatin dissolves fully into the base at this stage.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-08-blend-key-lime-base-polished.webp"},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Transfer to a Creami pint if you didn't build in the pint. Freeze upright and level for a full 24 hours.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-09-frozen-key-lime-pint.webp"},{"@type":"HowToStep","name":"Rest 5 Min + First Spin","text":"Pull the pint from the freezer, rest at ROOM TEMPERATURE for 5 minutes — NO hot-water bath. Process on Regular Ice Cream, NOT Lite. The first spin may look powdery; expected because the Respin (with frozen frosting) finishes the texture.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-10-first-spin-result-polished.webp"},{"@type":"HowToStep","name":"Chop Frozen Frosting","text":"Take 15g of the pre-frozen Protein Cheesecake Frosting (from `/cookbook/protein-cheesecake-frosting`) and chop it into small pieces (~1/4 inch cubes). Pieces must be frozen solid or they'll blend into the base rather than holding as pockets.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-11-chop-frozen-frosting-polished.webp"},{"@type":"HowToStep","name":"Add Frozen Frosting","text":"Poke the frozen frosting pieces into the surface of the first-spin pint. Distributes better when pushed in rather than piled on top.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-12-add-frozen-frosting-polished.webp"},{"@type":"HowToStep","name":"Respin","text":"Run one Respin cycle. Respin serves double duty here: distributes the cheesecake pockets through the pint AND finishes the powdery texture from the first spin. Same technique family as W2F2 Beach Bum (which Respun a graham cracker) — different mix-in.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-13-respin-result-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop the finished pint into a bowl. Green Creami with visible cheesecake pockets pulled through.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-14-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Graham Finish","text":"Crush ~60 cal graham crackers (roughly 1 sheet Honey Maid or equivalent) over the scoops. Serve immediately — graham softens fast on ice cream.","image":"https://thesplitplate.com/images/key-lime-cheesecake-creami/step-15-graham-garnish.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"350 calories","proteinContent":"42g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Cheesecake, Key lime, Make-ahead"}</script>
