    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Vineyard Picnic Snack Box","description":"No-cook 4-box snack prep — grapes, sliced beef stick, cubed cheddar, and pistachios. About 280 cal / 19g protein per box. The kids help fill the compartments.","image":"https://thesplitplate.com/images/split-plate-vineyard-picnic-snack-box/hero-vineyard-picnic-snack-box-polished.webp","totalTime":"PT10M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeCuisine":"American","recipeIngredient":["1 small handful grapes (prepared in an age-appropriate shape)","1 beef stick, sliced into coins","1 cheddar cheese stick, cubed","0.5 label serving pistachios (~85 cal per box, developmentally appropriate ages only)","4 small handfuls grapes","4 beef sticks","4 cheddar cheese sticks","2 label servings pistachios total"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"Set out four divided snack boxes (4-compartment Bento-style — same format as Snack Box Series Ep. 1-5). Invite the kids to help with the age-appropriate parts of the assembly.","image":"https://thesplitplate.com/images/split-plate-vineyard-picnic-snack-box/step-01-kids-add-grapes-polished.webp"},{"@type":"HowToStep","name":"Grapes","text":"Divide 1 small handful of prepared grapes into one compartment of each box. FOR KIDS UNDER 4 — quarter lengthwise (see notes). Over 4 with confident chewing = whole grapes fine, supervise first few bites.","image":"https://thesplitplate.com/images/split-plate-vineyard-picnic-snack-box/step-02-add-grapes-polished.webp"},{"@type":"HowToStep","name":"Beef Stick","text":"Slice one beef stick per box into coins and divide into the next compartment. Coin slices > whole stick for kids (easier bites, less pressure to chew through a length).","image":"https://thesplitplate.com/images/split-plate-vineyard-picnic-snack-box/step-03-add-beef-stick-polished.webp"},{"@type":"HowToStep","name":"Cheddar","text":"Cube one cheddar cheese stick per box and add to the third compartment. Cube size = 1/2-inch or smaller for young kids. Creamy calcium + kid-familiar cheese flavor.","image":"https://thesplitplate.com/images/split-plate-vineyard-picnic-snack-box/step-04-add-cheddar-polished.webp"},{"@type":"HowToStep","name":"Pistachios","text":"Add 1/2 label serving pistachios to the final compartment. FOR KIDS UNDER 4 — omit whole nuts entirely; sub a soft alternative (soft berries, banana slices, apple slices). Over 4 with good chewing = shell-off pistachios only, and supervise first few bites.","image":"https://thesplitplate.com/images/split-plate-vineyard-picnic-snack-box/step-05-add-pistachios-polished.webp"},{"@type":"HowToStep","name":"Lid + Chill","text":"Snap lid on each box. Refrigerate immediately — beef stick + cheddar both need cold storage. For lunchboxes, pack with an ice pack. Add pistachios closer to serving if maximum crunch matters.","image":"https://thesplitplate.com/images/split-plate-vineyard-picnic-snack-box/final-stacked-snack-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"280 calories","proteinContent":"19g"},"keywords":"Post-lunch snack, After-school snack, Kids snack prep, Make once snack twice, Weekend snack, No cook, Batch (2 kids × 2 days)"}</script>
