    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cookies & Cream Cookie Creami","description":"Vanilla protein Creami base, 3 low-cal chocolate sandwich cookies mixed in after the first spin, 10g Oreo dust on top. 350 cal / 42g protein whole pint. Deliberately classic — the point is it tastes exactly like cookies-and-cream should.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/hero-finished-cookies-and-cream-cookie-creami-polished.webp","totalTime":"PT1461M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeCuisine":"American","recipeIngredient":["1 cup 2% ultra-filtered milk","2 tbsp monk fruit sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1 tsp vanilla extract","3 low-cal chocolate sandwich cookies (HighKey Original filmed, ~70 cal each)","10 g Oreo crumbs / dust"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Base","text":"Combine 2% ultra-filtered milk + monk fruit sweetener + whey isolate + guar gum + salt + 1 tsp vanilla extract. Immersion blender until completely smooth. Vanilla extract is the base's whole flavor carrier this week — no cocoa, no berries, no emulsions.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-add-vanilla-polished.webp"},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Pour into a Creami pint below the max-fill line. Freeze upright and level for a full 24 hours.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-level-frozen-base-polished.webp"},{"@type":"HowToStep","name":"Rest 5 Min + First Spin","text":"Pull the pint, rest at ROOM TEMPERATURE for 5 minutes — no hot-water bath. Process on Regular Ice Cream, NOT Lite. The first spin should read as smooth vanilla; if it looks grainy, the Respin (with cookies) finishes the texture.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-first-spin-texture-polished.webp"},{"@type":"HowToStep","name":"Portion 3 Cookies","text":"Set aside 3 low-cal chocolate sandwich cookies (HighKey Original filmed, ~70 cal each). Whole cookies — don't crush ahead. The Respin does the breaking.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-three-sandwich-cookies-polished.webp"},{"@type":"HowToStep","name":"Add 3 Cookies + No-liquid Respin","text":"Drop all 3 sandwich cookies onto the spun pint. Run Respin WITHOUT adding liquid. The Respin breaks the cookies into pieces AND distributes them through the pint. NO liquid before Respin — this is the whole reason the cookies stay as chunks rather than dissolving.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-add-cookie-mix-in-polished.webp"},{"@type":"HowToStep","name":"Respin Result","text":"The finished Respin should show visible cookie pieces distributed through the vanilla pint with a smooth, non-grainy Creami texture. If the texture still reads powdery, run one more Respin — still without adding liquid.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-post-respin-texture-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop the finished pint into a bowl. Vanilla Creami with visible sandwich-cookie chunks pulled through.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Oreo Dust + Serve","text":"Finish with 10 grams of Oreo crumbs / dust over the top. 10 g is the exact figure included in the 350-cal total — measure, don't eyeball. Serve immediately.","image":"https://thesplitplate.com/images/cookies-and-cream-cookie-creami/step-add-oreo-dust-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"350 calories","proteinContent":"42g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Cookies-and-cream, Vanilla, Make-ahead"}</script>
