    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Mediterranean Snack Box","description":"Mediterranean-inspired kid snack box — prosciutto, Babybel, Castelvetrano olives, and almond-flour crackers. 4 boxes at once for 2 kids across 2 days. About 270 cal / 16g protein per box.","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/hero-final-mediterranean-snack-box-polished.webp","totalTime":"PT5M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeCuisine":"Mediterranean","recipeIngredient":["2 oz Del Duca prosciutto (or any prosciutto with comparable macros)","1 Original Babybel cheese","1.5 label servings Castelvetrano olives (drained well)","0.5 label serving Simple Mills Fine Ground Sea Salt almond-flour crackers","8 oz prosciutto total","4 Original Babybel cheeses","6 label servings Castelvetrano olives","2 label servings Simple Mills almond-flour crackers"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"Set out four divided snack boxes (4-compartment Bento-style — same format as Snack Box Series Ep. 1-4).","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/hero-final-mediterranean-snack-box-polished.webp"},{"@type":"HowToStep","name":"Prosciutto","text":"Fold 2 oz prosciutto LOOSELY into one compartment of each box. Loose folds hold up better than tight rolls (less compression, more visual air).","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/step-01-add-prosciutto-polished.webp"},{"@type":"HowToStep","name":"Babybel","text":"Drop one wrapped Original Babybel into the cheese compartment of each box. Keep the wax on — kids open their own, and the wax-peel ritual is part of the appeal.","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/step-02-add-babybel-polished.webp"},{"@type":"HowToStep","name":"Olives","text":"Drain the Castelvetrano olives WELL (wet olives soak into other compartments). Divide 1.5 servings into the olive compartment of each box. FOR KIDS UNDER 4 — quarter lengthwise (see notes). Over 4 with good chewing = whole is fine but supervise.","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/step-03-add-olives-polished.webp"},{"@type":"HowToStep","name":"Crackers","text":"Add 0.5 serving Simple Mills almond-flour crackers to the DRY compartment of each box. Keep them dry — moisture from olives / prosciutto softens them.","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/step-04-add-crackers-polished.webp"},{"@type":"HowToStep","text":"KIDS HELP BUILD (optional but recommended): Let kids place the olives + crackers themselves. Turns exposure into low-pressure play. Doesn't guarantee they'll eat — just makes the food feel less unfamiliar.","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/step-05-kids-help-build-polished.webp"},{"@type":"HowToStep","name":"Lid + Chill","text":"Snap lid on each box. Refrigerate — prosciutto + cheese need it. For lunchboxes, pack with an ice pack. Serve chilled.","image":"https://thesplitplate.com/images/split-plate-mediterranean-snack-box/final-stacked-snack-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"270 calories","proteinContent":"16g"},"keywords":"Kid snack, After-school snack, Weekend snack, Meal prep, No cook, Batch (2 kids × 2 days)"}</script>
