    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Shirley Temple Cookie Creami","description":"Shirley-Temple-inspired protein Creami: base carries lime gelatin + vanilla + brown-butter emulsion pre-freeze, mix-in is HighKey vanilla wafers via Respin, finished with a restrained 1/3 oz regular grenadine drizzle + one maraschino cherry. 340 cal / 43g protein whole pint.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/hero-finished-shirley-temple-cookie-creami-polished.webp","totalTime":"PT1455M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1 tsp lime gelatin mix (Jell-O filmed)","1/2 tsp vanilla","1/4 tsp brown-butter emulsion","0.5 oz (14g) HighKey vanilla wafers (~60 cal)","1/3 oz regular grenadine syrup (light drizzle only)","1 maraschino cherry"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Base","text":"Combine Fairlife 2% milk + monk fruit + whey isolate + guar gum + salt + lime gelatin + vanilla + brown-butter emulsion. Immersion blender until completely smooth. Zero lumps.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/step-add-lime-gelatin.webp"},{"@type":"HowToStep","name":"Lime Gelatin Note","text":"1 tsp of Jell-O lime gelatin goes into the base pre-freeze. Used as a texture-only additive (echoing W2F3 Key Lime, but the lime here is a background note, not the flavor identity). Noticeably improved the finished texture — may be tested in the standard series base.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/context-vanilla.webp"},{"@type":"HowToStep","name":"Brown-butter + Vanilla","text":"1/4 tsp brown-butter emulsion + 1/2 tsp vanilla supply the buttery cookie note. Emulsion holds through freezing better than butter itself.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/context-brown-butter-emulsion.webp"},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Pour into a Creami pint below the max-fill line. Freeze upright and level for a full 24 hours.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/step-frozen-pint.webp"},{"@type":"HowToStep","name":"Rest + Spin","text":"Pull the pint, rest at ROOM TEMPERATURE for 5 minutes. Process on Regular Ice Cream. Powdery after the first spin is expected — the Respin fixes it.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/step-first-spin-result-polished.webp"},{"@type":"HowToStep","name":"Mix-in Wafers","text":"Make a narrow center well. Drop in 0.5 oz (14g) of HighKey vanilla wafers. Run RESPIN without adding liquid.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/step-add-vanilla-wafers-polished.webp"},{"@type":"HowToStep","name":"Scoop + Grenadine","text":"Scoop into a bowl. Drizzle 1/3 oz of regular grenadine LIGHTLY over the top — sugar-containing syrup, intentionally restrained, and never added to the frozen base.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/step-grenadine-drizzle-polished.webp"},{"@type":"HowToStep","name":"Top + Serve","text":"Finish with one maraschino cherry. Eat immediately — the wafer crunch is best in the first 2-3 minutes.","image":"https://thesplitplate.com/images/shirley-temple-cookie-creami/step-finish-with-cherry.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"340 calories","proteinContent":"43g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Make-ahead"}</script>
