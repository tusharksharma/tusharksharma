    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Tropical Chicken Snack Box","description":"The first hot-protein box in the series. Fully cooked fajita chicken + fresh mango + cubed Colby Jack + lightly salted cashews. About 250 cal / 21g protein per box. Make four at once for post-lunch or after-school hunger.","image":"https://thesplitplate.com/images/split-plate-tropical-chicken-snack-box/hero-tropical-chicken-snack-box-polished.webp","totalTime":"PT10M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeCuisine":"American","recipeIngredient":["2 oz fully cooked fajita chicken, chopped if needed","3/8 mango, peeled and cut age-appropriately","1 Colby Jack cheese stick, cubed","14g lightly salted cashews (~1/2 label serving, developmentally appropriate ages only)","8 oz fully cooked fajita chicken","1.5 ripe mangoes","4 Colby Jack cheese sticks","56g lightly salted cashews (~2 label servings)"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"Set out four divided snack boxes (4-compartment Bento-style — same format as Snack Box Series Ep. 1-6). Fully cooked chicken means no stovetop or oven; the physical chicken package is source of truth if reheating before packing.","image":"https://thesplitplate.com/images/split-plate-tropical-chicken-snack-box/hero-tropical-chicken-snack-box-polished.webp"},{"@type":"HowToStep","name":"Chicken","text":"Divide 2 oz fully cooked fajita chicken into one compartment of each box, chopped for the child's chewing ability. Any brand of fully-cooked seasoned chicken works (Soules Kitchen shown). If reheating, heat to 165°F and cool promptly before packing.","image":"https://thesplitplate.com/images/split-plate-tropical-chicken-snack-box/step-01-divide-chicken-polished.webp"},{"@type":"HowToStep","name":"Mango","text":"Peel and cut 1.5 mangoes total across the 4 boxes (3/8 mango each), age-appropriate pieces. The sweet-fresh anchor + the tropical hook. Any ripe mango variety (Ataulfo / Kent / Tommy Atkins) flexes.","image":"https://thesplitplate.com/images/split-plate-tropical-chicken-snack-box/step-02-add-mango-polished.webp"},{"@type":"HowToStep","name":"Colby Jack","text":"Cube one Colby Jack cheese stick per box and add to the third compartment. Cube size = 1/2-inch or smaller for young kids. Colby Jack is milder than sharp cheddar — kid-friendly by default.","image":"https://thesplitplate.com/images/split-plate-tropical-chicken-snack-box/step-03-add-colby-jack-polished.webp"},{"@type":"HowToStep","name":"Cashews","text":"Add 14g lightly salted cashews (~1/2 label serving) to the final compartment. FOR KIDS UNDER 4 — omit whole cashews entirely; sub a soft alternative (soft berries, banana slices, or diced apple). Over 4 with good chewing = whole cashews only if supervised. The filmed brand contains cashews + peanut oil and may contain peanuts and other tree nuts.","image":"https://thesplitplate.com/images/split-plate-tropical-chicken-snack-box/step-04-add-cashews-polished.webp"},{"@type":"HowToStep","name":"Lid + Chill","text":"Snap lids on and refrigerate immediately — cooked chicken + fresh mango + cheese all need cold storage. Assembled boxes best within 2 days. For lunchboxes, pack with an ice pack. Add cashews closer to serving if maximum crunch matters (they soften in a sealed compartment after 24 hr).","image":"https://thesplitplate.com/images/split-plate-tropical-chicken-snack-box/final-stacked-snack-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"250 calories","proteinContent":"21g"},"keywords":"Post-lunch snack, After-school snack, Kids snack prep, Make once snack twice, Weekend snack, Higher protein, Batch (2 kids × 2 days)"}</script>
