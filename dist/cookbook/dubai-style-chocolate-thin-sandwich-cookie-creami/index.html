    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Dubai-Style Chocolate Thin Sandwich Cookie Creami","description":"Chocolate-pistachio protein Creami pint finished with a POST-SCOOP toasted-kataifi-and-pistachio-cream crunch topping. ~360 cal / 43g protein whole pint vs 810 cal for the Crumbl Dubai-Style Chocolate Thin Sandwich Cookie on the current Crumbl Davie nutrition listing.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/hero-dubai-chocolate-creami-polished.webp","totalTime":"PT1466M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeIngredient":["1 cup Fairlife 2% ultra-filtered milk","2 tbsp monk fruit / erythritol sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1 tbsp Dutch-process cocoa powder","1/2 tsp pistachio emulsion (publish-corrected — see rules below)","10g dry kataifi pastry strands (Greek shredded phyllo)","1 tbsp pistachio cream"],"recipeInstructions":[{"@type":"HowToStep","name":"Pour Milk","text":"Add 1 cup Fairlife 2% ultra-filtered milk to a Creami pint (or blending vessel)."},{"@type":"HowToStep","name":"Add Sweetener","text":"2 tbsp monk fruit / erythritol sweetener."},{"@type":"HowToStep","name":"Add Whey Isolate","text":"1 serving unflavored whey isolate."},{"@type":"HowToStep","name":"Add Guar Gum","text":"1/8 tsp guar gum, LEVEL measure. Heaped = gummy."},{"@type":"HowToStep","name":"Add Salt","text":"1 pinch salt."},{"@type":"HowToStep","name":"Add Dutch Cocoa","text":"1 tbsp Dutch-process cocoa powder. Standard Dutch cocoa (not black cocoa — that's W3F1 Mallow's carrier). Dutch cocoa gives a milk-chocolate depth that plays well with the pistachio emulsion."},{"@type":"HowToStep","name":"Add Pistachio Emulsion","text":"1/2 tsp pistachio emulsion. PUBLISH-CORRECTED AMOUNT — the filmed batch used 1 tsp and read too strong (the pistachio drowned the chocolate). 1/2 tsp is the revised recommendation: readable chocolate base + subtle pistachio backbone that lets the kataifi topping carry the primary pistachio identity. Series-first: no prior CCC episode used a flavor emulsion in the base.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-01-blend-chocolate-pistachio-base-polished.webp"},{"@type":"HowToStep","name":"Blend Smooth","text":"Immersion blender until completely smooth. Base should be a uniform mauve-tinted chocolate brown (the pistachio emulsion + Dutch cocoa mix together — do not expect deep-dark chocolate here). Zero lumps, zero visible whey."},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Transfer to a Creami pint if you didn't build in the pint. Freeze upright and level for a full 24 hours. Do not exceed the max-fill line.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-02-frozen-chocolate-base.webp"},{"@type":"HowToStep","name":"Measure Kataifi","text":"10g dry kataifi pastry strands. Kataifi is shredded Greek phyllo pastry — sold refrigerated or frozen in Middle-Eastern / Greek grocery aisles as thin thread-like pastry strands. 10g is roughly a small handful; measure by weight since strand volume varies wildly.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-03-measure-kataifi.webp"},{"@type":"HowToStep","name":"Dry-toast Kataifi","text":"Add the 10g kataifi to an UNGREASED skillet over LOW heat. Stir frequently with a spatula until every strand is evenly golden and crisp. This takes 3-4 minutes. Low heat is critical — kataifi burns in under 30 seconds on medium. Series-first: no prior CCC episode used a toasted pastry crunch topping.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-04-dry-toast-kataifi-polished.webp"},{"@type":"HowToStep","name":"Coat With Pistachio Cream","text":"Turn heat off. Add 1 tbsp pistachio cream directly to the still-warm toasted kataifi in the skillet. Stir until every strand is coated in pistachio cream. Warm skillet + warm pistachio cream = even coat; the pistachio cream loosens against the toasted strands and coats them without clumping. Set the coated kataifi mixture aside — it will crisp back up as it cools slightly.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-05-mix-pistachio-kataifi-polished.webp"},{"@type":"HowToStep","name":"Rest 5 Min + First Spin","text":"Pull the frozen Creami pint from the freezer, rest at ROOM TEMPERATURE for 5 minutes — NO hot-water bath. Process on Regular Ice Cream, NOT Lite. The first spin may look grainy; expected because the no-liquid Respin finishes the texture.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-06-first-spin-result.webp"},{"@type":"HowToStep","name":"No-liquid Respin","text":"Run one Respin cycle with NO added liquid. No milk, no water — the base has enough moisture on its own. This is a texture-finish pass, not a mix-in incorporation pass (the topping stays out of the machine). Same cycle family as W1F1-W3F1, but this is the first ep where Respin is a texture-only pass (no mix-in going in).","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-07-no-liquid-respin-result-polished.webp"},{"@type":"HowToStep","name":"Scoop","text":"Scoop the finished pint into a bowl. Smooth chocolate-pistachio Creami with a mauve-brown tint. Ready for the topping.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-08-scoop-full-pint-polished.webp"},{"@type":"HowToStep","name":"Add Pistachio-kataifi Topping","text":"Pile ALL of the pistachio-cream-coated toasted kataifi over the scoops. The topping is a POST-SCOOP GARNISH — NOT a machine mix-in. Adding kataifi to the pint before Respin would (a) crush the crunch into paste and (b) turn the Creami gummy from the pistachio cream. Keeping it as a post-scoop finish preserves the shatter-crunch texture and the pistachio-cream coat identity. Serve immediately.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/step-09-add-pistachio-kataifi-polished.webp"},{"@type":"HowToStep","name":"Serve","text":"Deep chocolate-pistachio Creami finished with a generous crown of toasted-kataifi-and-pistachio-cream crunch. Eat within 2-3 minutes of topping — kataifi softens fast against the cold Creami surface if it sits.","image":"https://thesplitplate.com/images/dubai-style-chocolate-thin-sandwich-cookie-creami/final-dubai-chocolate-creami-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"360 calories","proteinContent":"43g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Chocolate, Pistachio, Dubai-inspired, Kataifi, Make-ahead"}</script>
