pness. Watch closely — low-carb bread browns fast at the edges.","image":"https://thesplitplate.com/images/toasted-roast-beef-cheese-sandwich/step-05-load-toast.webp"},{"@type":"HowToStep","name":"Build","text":"Transfer the hot roast beef and melted cheese onto one slice of toast in a single scoop with the parchment. Add yellow mustard to taste.","image":"https://thesplitplate.com/images/toasted-roast-beef-cheese-sandwich/step-06-add-mustard.webp"},{"@type":"HowToStep","name":"Finish","text":"Close the sandwich, slice on the diagonal, serve immediately. The bread stays crisp; the cheese stays molten.","image":"https://thesplitplate.com/images/toasted-roast-beef-cheese-sandwich/step-07-slice-sandwich.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"260 calories","proteinContent":"34g"},"keywords":"Quick lunch, High-protein lunch, Air-fryer meal, Hot sandwich, Powerup"}</script>
