    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Pita Hummus Snack Box","description":"Smoky chipotle chicken, Colby Jack, everything pita crackers, cucumber, and half a single-serve hummus cup on the side. ~300 cal / 18g protein per box. 4 boxes = 2 kids across 2 days.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/hero-pita-hummus-snack-box-polished.webp","totalTime":"PT12M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeCuisine":"Middle Eastern","recipeIngredient":["8 oz grilled chipotle seasoned chicken (fully cooked) — 2 oz per box","4 Colby Jack snack cheese pieces — 1 piece per box","4 labeled servings everything pita crackers — 1 serving per box","Cucumber, as needed — peel and cut age-appropriate to fill one compartment per box","2 single-serve classic hummus cups (2 oz each) — split each cup across 2 boxes; 1 oz hummus per box"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"Line up 4 divided snack boxes. Buluker pastel 4-compartment boxes shown — the same set featured on Favorites → Snack Box Essentials.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/hero-pita-hummus-snack-box-polished.webp"},{"@type":"HowToStep","name":"Chipotle Chicken","text":"Portion 2 oz of fully cooked chipotle chicken into each box. This is the protein anchor — Costco grilled chipotle chicken was filmed at 100 cal / 16g protein per 3 oz serving.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/step-01-add-chipotle-chicken-polished.webp"},{"@type":"HowToStep","name":"Colby Jack","text":"Place 1 wrapped Colby Jack snack cheese in one compartment of each box. Tillamook Colby Jack was filmed — mild flavor pairs with the smoky chicken.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/step-02-add-colby-jack-cheese-polished.webp"},{"@type":"HowToStep","name":"Everything Pita Crackers","text":"1 labeled serving in one compartment. Town House Pita Everything was filmed. Pack whole for maximum crunch and let the kid break at snack time.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/step-03-add-pita-crackers-polished.webp"},{"@type":"HowToStep","name":"Cucumber","text":"Peel if desired and cut into age-appropriate pieces. Fill the remaining compartment. Cucumber is the second-crunch tier and the freshener.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/step-04-add-cucumber-polished.webp"},{"@type":"HowToStep","name":"Hummus on The Side — 1 oz Per Box","text":"Split each 2-oz single-serve hummus cup between 2 boxes = 1 oz per box in a small leakproof side cup. 365 by Whole Foods Original Hummus 2 oz singles were filmed. THE FILMED SERVING SHOWS A FULL 2-OZ CUP PER BOX — that was too much. Half a cup is plenty and holds the ~300-cal / 18g-protein target.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/context-hummus-side-polished.webp"},{"@type":"HowToStep","name":"Seal + Chill","text":"Snap lids on and refrigerate. Serve within 2 days. Transport with an ice pack. Keep the hummus side cup sealed separately for leak-proof travel.","image":"https://thesplitplate.com/images/pita-hummus-snack-box/final-four-pita-hummus-snack-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"300 calories","proteinContent":"18g"},"keywords":"Kid snack, Snack box, After-school snack, Weekday lunch supplement, Batch snack prep, Higher-protein snack, No cook"}</script>
