    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Brown Sugar Cinnamon Cookie Creami","description":"Brown-sugar monk fruit + 1/4 tsp cinnamon in the base, 120 cal of a Legendary brown-sugar-cinnamon protein pastry split between mix-in and topping. 360 cal / 54g protein whole pint. Honest verdict: decent, but too cinnamon-heavy by the end for a non-cinnamon-guy.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/hero-finished-brown-sugar-cinnamon-cookie-creami-polished.webp","totalTime":"PT1461M","recipeYield":"1","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dessert","recipeIngredient":["1 cup 2% ultra-filtered milk","2 tbsp brown-sugar monk fruit sweetener","1 serving unflavored whey isolate (~28g protein — adjust by brand)","1/8 tsp guar gum (level measure)","1 pinch salt","1/4 tsp ground cinnamon (in the base — pre-freeze, not on top)","60 cal chopped brown-sugar-cinnamon protein pastry (Legendary filmed) — Respin mix-in","60 cal chopped brown-sugar-cinnamon protein pastry (Legendary filmed) — post-flattening topping"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend Base","text":"Combine 2% ultra-filtered milk + 2 tbsp brown-sugar monk fruit + 1 serving whey isolate + 1/8 tsp guar gum + pinch of salt + 1/4 tsp ground cinnamon. Immersion blender until completely smooth. Both flavor swaps (brown-sugar monk fruit AND cinnamon) go in pre-freeze so the base carries the pastry cue from bite one.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-add-brown-sugar-monk-fruit-polished.webp"},{"@type":"HowToStep","name":"Add Cinnamon in The Base","text":"1/4 tsp ground cinnamon into the blender jar. This is the recipe's cinnamon dose — nothing extra on top later.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-add-cinnamon-polished.webp"},{"@type":"HowToStep","name":"Pour + Freeze (24 Hr)","text":"Pour into a Creami pint below the max-fill line. Freeze upright and level for a full 24 hours.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-first-spin-texture-polished.webp"},{"@type":"HowToStep","name":"Rest 5 Min + First Spin","text":"Pull the pint, rest at ROOM TEMPERATURE for 5 minutes — no hot-water bath. Process on Regular Ice Cream, NOT Lite.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-first-spin-texture-polished.webp"},{"@type":"HowToStep","name":"Portion 120 Cal Pastry","text":"Measure 120 CALORIES WORTH of the Legendary brown-sugar-cinnamon protein pastry — this is the total allocation across BOTH the mix-in AND the topping. Not 120 cal in each. The creator-supplied 360-cal figure assumes the full pastry package label; measure by weight or by inspection to hit 120 cal.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-protein-pastry-package-polished.webp"},{"@type":"HowToStep","name":"Divide 50/50","text":"Chop the 120-cal portion and divide it evenly — 60 cal for the Respin mix-in, 60 cal for the post-flattening topping.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-divide-protein-pastry-polished.webp"},{"@type":"HowToStep","name":"Add Mix-in Half + No-liquid Respin","text":"Drop the first 60-cal half of chopped pastry onto the spun pint. Run Respin WITHOUT adding liquid. Pastry pockets stay distinct through the pint.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-add-pastry-mix-in-polished.webp"},{"@type":"HowToStep","name":"Respin Result","text":"The finished Respin should show visible pastry pockets distributed through the brown-sugar-cinnamon Creami with a smooth, non-grainy texture. If the texture still reads powdery, run another Respin — still without adding liquid.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-post-respin-texture-polished.webp"},{"@type":"HowToStep","name":"Scoop or Flatten Inside Pint","text":"Flatten the Creami inside its pint (the finishing shot uses in-pint plating). Alternatively, scoop into a serving bowl if serving family-style.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-scoop-creami-polished.webp"},{"@type":"HowToStep","name":"Add Topping Half + Serve","text":"Scatter the remaining 60-cal half of chopped pastry across the flattened surface. Serve immediately — the pastry crumb is best crunchy against the cold Creami.","image":"https://thesplitplate.com/images/brown-sugar-cinnamon-cookie-creami/step-add-pastry-topping-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"360 calories","proteinContent":"54g"},"keywords":"Dessert, High-protein dessert, Power-Ups, Ninja Creami, Crumbl-inspired, Whole-pint dessert, Brown-sugar, Cinnamon, Make-ahead"}</script>
