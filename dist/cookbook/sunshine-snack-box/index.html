    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Sunshine Snack Box","description":"A warm-color palette snack box named for the yolk-yellow / strawberry-red / cheese-cream / peanut-tan color story. Boiled egg + dried strawberries + light cheese wedge + salted peanuts. About 280 cal / 16g protein per box. Make four for 2 kids × 2 days.","image":"https://thesplitplate.com/images/sunshine-snack-box/hero-sunshine-snack-box-polished.webp","totalTime":"PT15M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Snack","recipeCuisine":"American","recipeIngredient":["1 large hard-boiled egg, peeled + sliced (halved or age-appropriate)","1 portion (~60 cal) dried strawberries","1 wrapped light cheese wedge (Laughing Cow-style)","0.75 oz salted peanuts (developmentally appropriate ages only)","4 large hard-boiled eggs, peeled","4 portions dried strawberries (~240 cal total)","4 wrapped light cheese wedges","3 oz salted peanuts"],"recipeInstructions":[{"@type":"HowToStep","name":"Set up","text":"Set out four divided snack boxes (4-compartment Bento-style — same format as Snack Box Series Ep. 1-8). Have peeled hard-boiled eggs ready (make ahead — 4 large eggs boiled, ice-bathed, peeled — 10 min active + 12 min cook / cool). Ep. 9 continues the shelf-stable-protein pattern from Ep. 8: cook once, chill, hold.","image":"https://thesplitplate.com/images/sunshine-snack-box/hero-sunshine-snack-box-polished.webp"},{"@type":"HowToStep","name":"Slice Eggs","text":"Slice each peeled hard-boiled egg in half (over-4s) or into age-appropriate small pieces (under-4s). Yolk-yellow is the warm-color anchor for the whole box; keep the yolk exposed on top for the visual identity. 4 eggs across 4 boxes = 1 egg per box.","image":"https://thesplitplate.com/images/sunshine-snack-box/step-01-slice-boiled-eggs-polished.webp"},{"@type":"HowToStep","name":"Add Eggs","text":"Place 1 sliced egg into the first compartment of each box, yolk-side up when possible for the sunshine identity moment. Boiled egg is the ~6g protein anchor per box.","image":"https://thesplitplate.com/images/sunshine-snack-box/step-02-add-boiled-eggs-polished.webp"},{"@type":"HowToStep","name":"Strawberries","text":"Add one 60-calorie portion of dried strawberries to the second compartment of each box. Dried strawberries are the sweet-hit + warm-red color anchor. Any brand of freeze-dried or dehydrated strawberries flexes — measure by label serving, not by handful, since portion size drives ~60 cal / portion.","image":"https://thesplitplate.com/images/sunshine-snack-box/step-03-add-dried-strawberries-polished.webp"},{"@type":"HowToStep","name":"Cheese Wedge","text":"Add 1 wrapped light cheese wedge to the third compartment of each box (Laughing Cow-style — creamy spreadable wedge, ~35-50 cal / 2-3g protein). Cheese-cream color completes the warm palette. Wrapped wedge stays clean in the box; kids can help unwrap at snack time.","image":"https://thesplitplate.com/images/sunshine-snack-box/step-04-add-cheese-wedges-polished.webp"},{"@type":"HowToStep","name":"Peanuts","text":"Weigh 0.75 oz salted peanuts into the final compartment of each box (about a small handful — measure by weight, not by feel). Peanut-tan color completes the sunshine palette + adds crunch, fat, and a bit more protein. FOR KIDS UNDER 4 — omit whole peanuts entirely; sub a soft alternative (soft berries, banana slices, or diced apple). Over 4 with good chewing = whole peanuts only if supervised.","image":"https://thesplitplate.com/images/sunshine-snack-box/step-05-add-salted-peanuts-polished.webp"},{"@type":"HowToStep","name":"Lid + Chill","text":"Snap lids on and refrigerate promptly. Serve within 2 days. Dried strawberries + peanuts may soften slightly in the sealed box's humidity — add peanuts closer to serving if maximum crunch matters (they hold OK for 2 days but the first-day crunch is best).","image":"https://thesplitplate.com/images/sunshine-snack-box/final-four-sunshine-snack-boxes-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"280 calories","proteinContent":"16g"},"keywords":"Post-lunch snack, After-school snack, Kids snack prep, Make once snack twice, Weekend snack, Warm-color meal prep, Batch (2 kids × 2 days)"}</script>
