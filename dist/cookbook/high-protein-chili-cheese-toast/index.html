    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Chili Cheese Toast","description":"8 open-faced toasts. 130 cal / 13g protein each. Blended cottage cheese + reduced-fat fiesta + chilies on keto buns.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/hero-finished-chili-cheese-toast-polished.webp","totalTime":"PT18M","recipeYield":"8","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Lunch","recipeCuisine":"American","recipeIngredient":["4 Oroweat Superior Keto Buns, split into 8 open-faced halves","1 Daisy Low Fat Cottage Cheese cup (5.3 oz / 150g, blended smooth)","1 bag (7 oz / 198g) Great Value Reduced Fat Fiesta Blend shredded cheese","2-4 Thai bird chilies (HOT) OR 1-2 jalapeños (medium heat — remove seeds for milder), finely chopped","Dan-O's Crunchy Seasoning, to taste","Parchment paper or cooking spray (for the baking sheet)"],"recipeInstructions":[{"@type":"HowToStep","name":"Oven","text":"375°F. Line a baking sheet with parchment paper (or hit it with cooking spray)."},{"@type":"HowToStep","name":"Blend Cottage Cheese","text":"Daisy Low Fat cup into a small food processor. Blend 30-45 sec until completely smooth — no curds visible. This is the move that makes the filling creamy not chunky.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-02-blend-cottage-cheese-polished.webp"},{"@type":"HowToStep","name":"Scoop to Bowl","text":"Transfer the blended cottage cheese to a mixing bowl. Should look like thick Greek yogurt at this point.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-03-scoop-base-to-bowl.webp"},{"@type":"HowToStep","name":"Add Cheese","text":"Full 7 oz bag of Great Value Reduced Fat Fiesta Blend shredded cheese into the bowl with the blended cottage cheese.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-04-add-reduced-fat-cheese.webp"},{"@type":"HowToStep","name":"Fold","text":"Mix the shredded cheese into the cottage-cheese base with a spatula until evenly distributed. Filling should look uniform — no dry shred patches, no cottage-cheese clumps.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-05-mix-cheese-base-polished.webp"},{"@type":"HowToStep","name":"Chop Chilies","text":"2-4 Thai bird chilies (hot version) OR 1-2 jalapeños with seeds removed (medium version) finely diced — pieces ~1/8-inch. Smaller dice = better distribution across all 8 toasts.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-06-chop-chilies.webp"},{"@type":"HowToStep","name":"Fold Chilies Into Filling","text":"Diced chilies into the cheese mixture. Fold gently to distribute. Don't overmix — visible chili specks throughout the filling is the goal.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-07-add-chilies-to-filling.webp"},{"@type":"HowToStep","name":"Split Buns","text":"4 Oroweat Superior Keto Buns split horizontally into 8 open-faced halves. Arrange cut-side up on the lined baking sheet, spaced so the edges don't touch.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-09-split-keto-buns.webp"},{"@type":"HowToStep","name":"Fill The Toasts","text":"Divide the filling evenly across all 8 halves. ~2 tbsp filling per toast. Spread to the edges so the cheese melts to the crust. Pile slightly mounded in the center.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-10-fill-toasts-polished.webp"},{"@type":"HowToStep","name":"Season The Tops","text":"Dan-O's Crunchy Seasoning over each toast. Don't be shy — it's the salt + texture finish. ~1/4 tsp per toast.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-11-season-loaded-toasts.webp"},{"@type":"HowToStep","name":"Bake","text":"375°F for ~9 min. Filling should be hot + visibly melted + slightly browned on top. Keto buns dry out fast past 10 min — set a timer.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-12-bake-at-375.webp"},{"@type":"HowToStep","name":"Rest + Serve","text":"Let toasts cool 1-2 min before eating (cheese filling is molten right out of the oven). Eat 2-3 immediately, reheat the rest later.","image":"https://thesplitplate.com/images/high-protein-chili-cheese-toast/step-12-finished-toasts-reveal-polished.webp"}],"nutrition":{"@type":"NutritionInformation","calories":"130 calories","proteinContent":"13g"},"keywords":"Powerup, Snack, Quick lunch, High protein, Keto-friendly, Adults"}</script>
