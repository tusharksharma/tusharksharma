    <noscript><h1>High-Protein Taco Bowls — The Split Plate</h1><p>500 cal / 67g protein / 17g fat / 7g net carbs per adult bowl, 4 servings from 1.25 lb of 93/7 lean ground beef (2 adults at 6 oz + 2 kids at 3 oz). Beef seasoned with Spiceology Taco Seasoning, browned, finished with 1/3 cup Kirkland Sipping Bone Broth to carry the seasoning back into the meat. Cheese split: Kraft Fat-Free Cheddar melted into adult portions (saves 65 cal + 9g fat per plate); Tillamook Medium Cheddar into kid portions. Adults plate: Quest Loaded Taco Chips base in a wide bowl, cheesy taco beef spooned over the chips, shredded iceberg + diced Roma tomatoes, Wholly Guacamole dollop. Kids plate: compartment tray — Simply Tostitos Organic Yellow Corn chips, beef compartment, Wholly mini compartment, lettuce/tomato in a small bowl. Adults eat bowl-style; kids assemble at the table.</p></noscript>
