    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Taco Bowls","description":"500 cal / 67g protein / 17g fat / 7g net carbs per adult bowl, 4 servings from 1.25 lb of 93/7 lean ground beef (2 adults at 6 oz + 2 kids at 3 oz). Beef seasoned with Spiceology Taco Seasoning, browned, finished with 1/3 cup Kirkland Sipping Bone Broth to carry the seasoning back into the meat. Cheese split: Kraft Fat-Free Cheddar melted into adult portions (saves 65 cal + 9g fat per plate); Tillamook Medium Cheddar into kid portions. Adults plate: Quest Loaded Taco Chips base in a wide bowl, cheesy taco beef spooned over the chips, shredded iceberg + diced Roma tomatoes, Wholly Guacamole dollop. Kids plate: compartment tray — Simply Tostitos Organic Yellow Corn chips, beef compartment, Wholly mini compartment, lettuce/tomato in a small bowl. Adults eat bowl-style; kids assemble at the table.","image":"https://thesplitplate.com/images/high-protein-taco-bowls/hero-split-plate-polished.webp","totalTime":"PT20M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"500 calories","proteinContent":"67g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["1.25 lb 93/7 lean ground beef","2 tbsp Spiceology Taco Seasoning Blend","Pinch kosher salt","1/3 cup Kirkland Organic Chicken Sipping Bone Broth [braise]","Cooking spray (Chosen Foods avocado oil)","2 bags Quest Loaded Taco Tortilla-Style Protein Chips (1.1 oz each) [adult]","2 oz Kraft Fat-Free Shredded Cheddar [adult]","Simply Tostitos Organic Yellow Corn Tortilla Chips (~2 oz total) [kid]","1 oz Tillamook Medium Cheddar shredded [kid]","1 head iceberg lettuce, shredded (~3 cups)","2 Roma tomatoes, diced","Pinch salt","4 Wholly Guacamole Classic Minis (1 per plate)"],"recipeInstructions":[{"@type":"HowToStep","name":"Mise en Place","text":"Spiceology Taco Seasoning out, 1.25 lb 93/7 beef in a stainless mixing bowl, Quest Loaded Taco chips bags out (2), Simply Tostitos for kids, Kraft fat-free cheddar + Tillamook Medium cheddar, 4 Wholly Guacamole minis, iceberg + Roma tomatoes, Kirkland Sipping Bone Broth pouch."},{"@type":"HowToStep","name":"Season Beef","text":"Beef into the bowl. Add 2 tbsp Spiceology Taco Seasoning + pinch of kosher salt. Mix until evenly distributed."},{"@type":"HowToStep","name":"Dice + Shred","text":"2 Roma tomatoes diced. 1 head iceberg shredded thin. Combine in a small bowl with a pinch of salt. Set aside."},{"@type":"HowToStep","name":"Brown Beef","text":"Stainless skillet over medium-high. Cooking spray. Seasoned beef in. Break up as it browns, 6-8 min until cooked through. No drain needed (93/7 is lean)."},{"@type":"HowToStep","name":"Bone Broth Braise","text":"Pour 1/3 cup Kirkland Sipping Bone Broth into the beef. Reduce 60 sec on medium-high. The broth carries the seasoning back into the meat."},{"@type":"HowToStep","name":"Cheese Split by Zone","text":"Push beef into two zones (~70% adult / ~30% kid). Adult zone: 2 oz Kraft Fat-Free Cheddar. Kid zone: 1 oz Tillamook Medium Cheddar. Cover 60 sec. Off heat."},{"@type":"HowToStep","name":"Adult Bowl","text":"Empty 1 bag Quest Loaded Taco chips into the bottom of a wide white bowl. Light crush. Spoon ~6 oz cheesy adult-zone beef over the chips."},{"@type":"HowToStep","name":"Top The Adult Bowl","text":"Shredded iceberg + diced Roma over the beef. Squeeze 1 Wholly Guacamole mini in the center. Optional: hot sauce on the side."},{"@type":"HowToStep","name":"Kid Tray","text":"Compartment tray. Big compartment: ~10-12 Simply Tostitos Organic chips. Small compartments: 3 oz kid-zone beef + 1 Wholly mini squeezed in. Side bowl: lettuce + Roma mix. Hand to kid + small spoon."},{"@type":"HowToStep","name":"Eat Immediately. Adults","text":"scoop through all layers with a spoon     <noscript><h1>High-Protein Taco Bowls — The Split Plate</h1><p>500 cal / 67g protein / 17g fat / 7g net carbs per adult bowl, 4 servings from 1.25 lb of 93/7 lean ground beef (2 adults at 6 oz + 2 kids at 3 oz). Beef seasoned with Spiceology Taco Seasoning, browned, finished with 1/3 cup Kirkland Sipping Bone Broth to carry the seasoning back into the meat. Cheese split: Kraft Fat-Free Cheddar melted into adult portions (saves 65 cal + 9g fat per plate); Tillamook Medium Cheddar into kid portions. Adults plate: Quest Loaded Taco Chips base in a wide bowl, cheesy taco beef spooned over the chips, shredded iceberg + diced Roma tomatoes, Wholly Guacamole dollop. Kids plate: compartment tray — Simply Tostitos Organic Yellow Corn chips, beef compartment, Wholly mini compartment, lettuce/tomato in a small bowl. Adults eat bowl-style; kids assemble at the table.</p></noscript>
