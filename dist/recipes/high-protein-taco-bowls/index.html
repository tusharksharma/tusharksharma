ed [kid]","1 head iceberg lettuce, shredded (~3 cups)","2 Roma tomatoes, diced","Pinch salt","4 Wholly Guacamole Classic Minis (1 per plate)"],"recipeInstructions":[{"@type":"HowToStep","name":"Mise en Place","text":"Spiceology Taco Seasoning out, 1.25 lb 93/7 beef in a stainless mixing bowl, Quest Loaded Taco chips bags out (2), Simply Tostitos for kids, Kraft fat-free cheddar + Tillamook Medium cheddar, 4 Wholly Guacamole minis, iceberg + Roma tomatoes, Kirkland Sipping Bone Broth pouch."},{"@type":"HowToStep","name":"Season Beef","text":"Beef into the bowl. Add 2 tbsp Spiceology Taco Seasoning + pinch of kosher salt. Mix until evenly distributed."},{"@type":"HowToStep","name":"Dice + Shred","text":"2 Roma tomatoes diced. 1 head iceberg shredded thin. Combine in a small bowl with a pinch of salt. Set aside."},{"@type":"HowToStep","name":"Brown Beef","text":"Stainless skillet over medium-high. Cooking spray. Seasoned beef in. Break up as it browns, 6-8 min until cooked through. No drain needed (93/7 is lean)."},{"@type":"HowToStep","name":"Bone Broth Braise","text":"Pour 1/3 cup Kirkland Sipping Bone Broth into the beef. Reduce 60 sec on medium-high. The broth carries the seasoning back into the meat."},{"@type":"HowToStep","name":"Cheese Split by Zone","text":"Push beef into two zones (~70% adult / ~30% kid). Adult zone: 2 oz Kraft Fat-Free Cheddar. Kid zone: 1 oz Tillamook Medium Cheddar. Cover 60 sec. Off heat."},{"@type":"HowToStep","name":"Adult Bowl","text":"Empty 1 bag Quest Loaded Taco chips into the bottom of a wide white bowl. Light crush. Spoon ~6 oz cheesy adult-zone beef over the chips."},{"@type":"HowToStep","name":"Top The Adult Bowl","text":"Shredded iceberg + diced Roma over the beef. Squeeze 1 Wholly Guacamole mini in the center. Optional: hot sauce on the side."},{"@type":"HowToStep","name":"Kid Tray","text":"Compartment tray. Big compartment: ~10-12 Simply Tostitos Organic chips. Small compartments: 3 oz kid-zone beef + 1 Wholly mini squeezed in     <noscript><h1>High-Protein Taco Bowls — The Split Plate</h1><p>Estimated 500 cal / 61g protein / 17g fat / 7g net carbs per adult bowl. 2 lb raw 93/7 beef = 6 adult-equivalent servings (creator uses 4 adult + 4 half-size kid portions across two family dinners). Beef seasoned with Dan-O's TAC-O + salt, browned, divided evenly among 6 meal-prep containers. Moisture hack: 1 tbsp Kirkland Sipping Bone Broth per container so the beef stays moist through reheating. Cheese split by container: 1 oz Kraft Fat-Free Cheddar per adult container; ~1.5 Velveeta slices per shared kid container (split between two kids). Cold produce prepped separately: chopped romaine hearts + halved yellow cherry tomatoes. Adults plate: Quest Loaded Taco chips base in a wide bowl, reheated cheesy beef over the chips, romaine + yellow tomatoes, 1/2 Wholly Guacamole mini, Siete Habanero Botana Sauce to taste. Kids plate: compartment tray with regular tortilla chips, kid beef + Velveeta, 1 full Wholly mini, deconstructed veg on the side.</p></noscript>
