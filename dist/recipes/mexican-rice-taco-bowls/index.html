    <noscript><h1>Mexican Rice Taco Bowls — The Split Plate</h1><p>Cook the rice in chicken bone broth, tomato sauce, avocado oil, Dan-O's SPG, and cumin, about 25 minutes. Brown the 93/7 beef with taco seasoning and salt. Cook the frozen fajita vegetables until soft. Divide the rice across 12 bowls — roughly 60% among six adult bowls, 40% among six kid bowls. Each adult bowl gets about 3/4 cup rice, 5 oz beef, vegetables, and 2 tbsp green sauce. The filmed kid bowl gets about 1/2 cup rice and 3 oz beef, vegetables optional. Refrigerate the extra dinners and reheat.</p></noscript>
