n ~50g (level 1/4 cup) warm filling into each shell, rim exposed. Bake 6-8 min to 165 F.","image":"https://thesplitplate.com/images/chicken-alfredo-crunch-nests/step-10-fill-potato-shells-polished.webp"},{"@type":"HowToStep","name":"Rest + Reveal","text":"Rest 4 min. Loosen with a silicone/wooden utensil. Add cooled lids only at the table.","image":"https://thesplitplate.com/images/chicken-alfredo-crunch-nests/step-11-add-crisp-lids-polished.webp"},{"@type":"HowToStep","name":"Plate The Adult","text":"2 nests + one-fourth of the broccoli. Finish broccoli with lemon.","image":"https://thesplitplate.com/images/chicken-alfredo-crunch-nests/hero-adult-plate-polished.webp"},{"@type":"HowToStep","name":"Add Lids Last","text":"Set cooled cheese lids on each nest at the table so they stay brittle.","image":"https://thesplitplate.com/images/chicken-alfredo-crunch-nests/step-11-add-crisp-lids-polished.webp"},{"@type":"HowToStep","name":"Kid Tray","text":"1 nest + broccoli in a separate compartment + small dish of Alfredo for dipping.","image":"https://thesplitplate.com/images/chicken-alfredo-crunch-nests/hero-kid-trays-with-dip-polished.webp"},{"@type":"HowToStep","name":"Alfredo Dip Optional","text":"Rao's Alfredo warmed slightly. Not included in adult macros.","image":"https://thesplitplate.com/images/chicken-alfredo-crunch-nests/split-kid-alfredo-dip-polished.webp"}],"keywords":"chicken, alfredo, hash-browns, muffin-pan, cottage-cheese-alfredo, family-dinner, split-plate, meal-prep, two-night-plan, viral-recipe-test"}</script>

    <noscript><h1>Chicken Alfredo Crunch Nests — The Split Plate</h1><p>Original recipe test — Episode 1 of Can I Make a Recipe Go Viral? Hash-brown cups pressed into a 12-cup muffin pan, roasted alongside a sheet of broccoli, filled with a thick cottage-cheese Alfredo folded through Costco chipotle chicken, and topped at the table with a cooled Parmesan-mozzarella lid that actually cracks. 12 nests = 2 dinners for 2 adults + 2 kids. Per nest: 130 cal / 12g protein. Adult plate (2 nests + lemon broccoli): ~340 cal / 28g protein estimated. Kid plate: the creator started each child with 1 nest based on appetite, plus broccoli and a small Alfredo dip.</p></noscript>
