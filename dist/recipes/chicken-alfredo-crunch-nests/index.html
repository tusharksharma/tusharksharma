    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken Alfredo Crunch Nests","description":"Original recipe test — Episode 1 of Can I Make a Recipe Go Viral? Hash-brown cups pressed into a 12-cup muffin pan, roasted alongside a sheet of broccoli, filled with a thick cottage-cheese Alfredo folded through Costco chipotle chicken, and topped at the table with a cooled Parmesan-mozzarella lid that actually cracks. 12 nests = 2 dinners for 2 adults + 2 kids. Per nest: 130 cal / 12g protein. Adult plate (2 nests + lemon broccoli): ~340 cal / 28g protein estimated. Kid plate: the creator started each child with 1 nest based on appetite, plus broccoli and a small Alfredo dip.","image":"https://thesplitplate.com/images/chicken-alfredo-crunch-nests/hero-crisp-nest-closeup-polished.webp","totalTime":"PT60M","recipeYield":"6 servings","nutrition":{"@type":"NutritionInformation","calories":"340 calories","proteinContent":"28g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["15 oz plain frozen shredded hash browns (thaw + squeeze very dry)","2 large egg whites","1/4 cup / 22g finely grated Parmesan","2 tsp cornstarch","2 tsp avocado oil + 1-2 tsp for brushing the pan","1/2 tsp garlic powder","1/2 tsp kosher salt","1/4 tsp black pepper","12 oz Costco chipotle chicken (cooked, finely chopped)","1 cup 2% cottage cheese","2 tbsp 2% ultra-filtered milk","1/4 cup / 22g finely grated Parmesan","1 tsp cornstarch","1/2 tsp garlic powder","1/4 tsp onion powder","1/2 tsp Italian seasoning","1/4 tsp kosher salt","1/8 tsp black pepper","1/3 cup finely grated Parmesan","1 1/2 oz shredded part-skim low-moisture mozzarella","20 oz broccoli florets","1 tbsp avocado or olive oil","1/2 tsp garlic powder","1/2 tsp kosher salt","1 wedge lemon (zest or juice)","Optional: black pepper, chile flakes, or 1 tbsp Parmesan","Prepared Alfredo sauce for dipping (creator used Rao's) — optional, not in adult macros"],"recipeInstructions":[{"@type":"HowToStep","name":"Heat + Prep The Pan","text":"Oven to 415 F with racks in the upper and lower thirds. Brush all 12 muffin cups with 1-2 tsp avocado oil. Do not use aerosol spray on ceramic cookware."},{"@type":"HowToStep","name":"Bake The Crisp Lids","text":"Line a sheet pan with parchment. Mix 1/3 cup Parm + 1 1/2 oz shredded mozz, divide into 12 loose 2 1/4-inch rounds. Bake 5-7 min until bubbling and deeply golden at the edges. Cool completely so the lids become brittle."},{"@type":"HowToStep","name":"Build The Shell Mix","text":"Squeeze fully thawed hash browns in a clean towel until very dry. Combine with egg whites, 1/4 cup Parm, 2 tsp cornstarch, 2 tsp oil, garlic powder, salt, and pepper."},{"@type":"HowToStep","name":"Press Shells","text":"About 35g per cup. Press thin across the bottom and up the shallow sides, leaving a visible rim."},{"@type":"HowToStep","name":"Roast Shells + Broccoli Together","text":"Toss 20 oz broccoli with oil, garlic, and salt on the sheet pan. Bake alongside the muffin pan. Rotate and swap racks at 12 min. Broccoli 18-22 min; shells 18-23 min. Pull shells when rims and bottom edges are deeply golden."},{"@type":"HowToStep","name":"Blend + Thicken The Alfredo","text":"Blend cottage cheese + milk + Parm + cornstarch + garlic powder + onion powder + Italian seasoning + salt + pepper until mostly smooth. Warm over medium-low, stirring, until steaming and thick. Fold in the finely chopped chipotle chicken. Do not boil."},{"@type":"HowToStep","name":"Fill + Finish","text":"Reduce oven to 390 F. Spoon ~50g (level 1/4 cup) warm filling into each shell, keeping the potato rim exposed. Bake 6-8 min until the center reaches 165 F."},{"@type":"HowToStep","name":"Rest + Reveal","text":"Rest in the pan for 4 min. Loosen and lift each nest with a silicone or wooden utensil. Add cooled cheese lids only at the table so they stay crisp. Finish adult broccoli with lemon and serve Alfredo dip on kid plates if desired."}],"keywords":"chicken, alfredo, hash-browns, muffin-pan, cottage-cheese-alfredo, family-dinner, split-plate, meal-prep, two-night-plan, viral-recipe-test"}</script>

    <noscript><h1>Chicken Alfredo Crunch Nests — The Split Plate</h1><p>Original recipe test — Episode 1 of Can I Make a Recipe Go Viral? Hash-brown cups pressed into a 12-cup muffin pan, roasted alongside a sheet of broccoli, filled with a thick cottage-cheese Alfredo folded through Costco chipotle chicken, and topped at the table with a cooled Parmesan-mozzarella lid that actually cracks. 12 nests = 2 dinners for 2 adults + 2 kids. Per nest: 130 cal / 12g protein. Adult plate (2 nests + lemon broccoli): ~340 cal / 28g protein estimated. Kid plate: the creator started each child with 1 nest based on appetite, plus broccoli and a small Alfredo dip.</p></noscript>
