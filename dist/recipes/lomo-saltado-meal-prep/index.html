    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Lomo Saltado Meal Prep","description":"Lean stir-fry beef seared hard in a wok with red onion and yellow tomato, tossed in a six-ingredient sauce (soy, fish, vinegar, Tari Amarillo, ginger-garlic paste, bone-broth stick pack), then finished with green onion and crisp air-fried fries folded in right before serving. Rice cooks in bone broth. Adult bowl gets extra Tari; the creator's kid plate uses the same base with an appetite-based beef portion and either no heat or a touch of toum.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/hero-adult-lomo-saltado-polished.webp","prepTime":"PT20M","cookTime":"PT25M","totalTime":"PT45M","recipeYield":"6","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Peruvian","recipeIngredient":["2 tbsp soy sauce","2 tbsp fish sauce","2 tbsp white-wine vinegar","2 tbsp Tari Amarillo hot-ish sauce","2 tbsp ginger-garlic paste","1 stick pack Bare Bones bone-broth powder (~15g)","2 lb lean stir-fry beef (trimmed further)","8 oz red onion, thickly sliced","8 oz tomatoes (creator: homegrown yellow)","1/2 bunch green onions, cut into 2-inch pieces","SPG to taste","Light avocado-oil spray","1 cup dry rice + 2 cups bone broth","16 oz frozen fries (8 oz per four-person dinner, air-fried fresh)","Full adult-equivalent portion of beef + sauce","Bone-broth rice","Fresh air-fried fries (mixed in or crisp on the side)","Extra Tari Amarillo drizzle to taste","Half an adult beef serving (appetite-based)","Same bone-broth rice; optional pat of butter","Same fresh air-fried fries","Optional toum for a no-heat garlic finish"],"recipeInstructions":[{"@type":"HowToStep","name":"Cook The Rice","text":"Combine 1 cup dry rice with 2 cups bone broth and cook using your normal pot method. Split across eight household portions.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/hero-adult-and-kid-plates-polished.webp"},{"@type":"HowToStep","name":"Whisk The Sauce","text":"Combine soy, fish, vinegar, Tari Amarillo, ginger-garlic paste, and the bone-broth stick pack until smooth. Set aside.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-04-sauce-hack-polished.webp"},{"@type":"HowToStep","name":"Trim + Season The Beef","text":"Trim visible fat, pat dry, season with SPG. Lightly spray a wok or large skillet with avocado oil.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-02-trim-beef-polished.webp"},{"@type":"HowToStep","name":"Hard-sear in Batches","text":"Wok blazing hot. Sear the beef in 2-3 batches so it browns instead of steaming; remove to a bowl.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-05-hard-sear-polished.webp"},{"@type":"HowToStep","name":"Cook The Veg","text":"Add onion and tomato to the same wok. Stir-fry until the onion softens slightly and the tomato still holds shape.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-06-onion-tomato-polished.webp"},{"@type":"HowToStep","name":"Return Beef + Sauce","text":"Add the beef back, pour in the sauce, and toss over high heat until glossy. Add green onion.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-07-return-beef-and-sauce-polished.webp"},{"@type":"HowToStep","name":"Air-fry Fries + Fold in","text":"Air-fry 8 oz frozen fries per four-person dinner. Fold into the wok immediately before serving.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-08-fold-in-fries-polished.webp"},{"@type":"HowToStep","name":"Plate The Adult Bowl","text":"Rice base, full adult-equivalent portion of the sauced beef, crisp fries either folded in or served on the side.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/hero-adult-lomo-saltado-polished.webp"},{"@type":"HowToStep","name":"Extra Tari","text":"Drizzle Tari Amarillo across the bowl to taste. This is the flavor everyone remembers.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-09-adult-tari-amarillo-polished.webp"},{"@type":"HowToStep","name":"Plate The Kid","text":"Rice base (optional pat of butter), half an adult beef serving, crisp fries. Skip the Tari drizzle.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/step-10-kid-plate-option-polished.webp"},{"@type":"HowToStep","name":"Optional Toum","text":"A small drizzle of toum for a garlicky no-heat finish if the child likes it."}],"keywords":"beef, lomo-saltado, peruvian, stir-fry, meal-prep, sauce-hack, family-dinner, split-plate, wok, batch-cook"}</script>

    <noscript><h1>Lomo Saltado Meal Prep — The Split Plate</h1><p>Lean stir-fry beef seared hard in a wok with red onion and yellow tomato, tossed in a six-ingredient sauce (soy, fish, vinegar, Tari Amarillo, ginger-garlic paste, bone-broth stick pack), then finished with green onion and crisp air-fried fries folded in right before serving. Rice cooks in bone broth. Adult bowl gets extra Tari; the creator's kid plate uses the same base with an appetite-based beef portion and either no heat or a touch of toum.</p></noscript>
