    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Lomo Saltado Meal Prep","description":"Lean stir-fry beef seared hard in a wok with red onion and yellow tomato, tossed in a six-ingredient sauce (soy, fish, vinegar, Tari Amarillo, ginger-garlic paste, bone-broth stick pack), then finished with green onion and crisp air-fried fries folded in right before serving. Rice cooks in bone broth. Adult bowl gets extra Tari; the creator's kid plate uses the same base with an appetite-based beef portion and either no heat or a touch of toum.","image":"https://thesplitplate.com/images/lomo-saltado-meal-prep/hero-adult-lomo-saltado-polished.webp","totalTime":"PT45M","recipeYield":"6 servings","nutrition":{"@type":"NutritionInformation","calories":"580 calories","proteinContent":"52g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["2 tbsp soy sauce","2 tbsp fish sauce","2 tbsp white-wine vinegar","2 tbsp Tari Amarillo hot-ish sauce","2 tbsp ginger-garlic paste","1 stick pack Bare Bones bone-broth powder (~15g)","2 lb lean stir-fry beef (trimmed further)","8 oz red onion, thickly sliced","8 oz tomatoes (creator: homegrown yellow)","1/2 bunch green onions, cut into 2-inch pieces","SPG to taste","Light avocado-oil spray for the wok","1 cup dry rice","2 cups bone broth","16 oz frozen fries (8 oz per four-person dinner, air-fried fresh)","Extra Tari Amarillo to taste","Optional pat of butter for the kid rice","Optional toum for a no-heat kid drizzle"],"recipeInstructions":[{"@type":"HowToStep","name":"Cook The Rice","text":"Combine 1 cup dry rice with 2 cups bone broth and cook using your normal pot method. Divide across eight household portions. Stir a small pat of butter into the kid rice if desired."},{"@type":"HowToStep","name":"Whisk The Sauce","text":"Combine soy, fish, vinegar, Tari Amarillo, ginger-garlic paste, and the bone-broth stick pack until smooth. Taste — it should read intense on its own; on the plate it lands."},{"@type":"HowToStep","name":"Trim + Season The Beef","text":"Trim visible fat from 2 lb lean stir-fry beef, pat dry, season with SPG. Lightly spray a wok or large skillet with avocado oil."},{"@type":"HowToStep","name":"Hard-sear in Batches","text":"Preheat the wok until smoking. Sear the beef in 2-3 batches so it browns rather than steams. Remove each batch to a bowl."},{"@type":"HowToStep","name":"Cook The Onion + Tomato","text":"In the same wok, add 8 oz sliced red onion and 8 oz tomato. Stir-fry until the onion softens slightly while the tomato still holds shape."},{"@type":"HowToStep","name":"Return Beef + Sauce","text":"Add the beef back with any resting juices. Pour in the sauce and toss over high heat until glossy. Add green onion pieces last."},{"@type":"HowToStep","name":"Air-fry Fries Fresh","text":"Air-fry 8 oz frozen fries per four-person dinner per package directions. Fold into the wok immediately before serving so they stay crisp."},{"@type":"HowToStep","name":"Plate + Split","text":"Adult bowls get a full adult-equivalent portion + extra Tari Amarillo. Creator's kids get half an adult beef serving based on appetite, same rice and fries, and toum or no extra sauce."}],"keywords":"beef, lomo-saltado, peruvian, stir-fry, meal-prep, sauce-hack, family-dinner, split-plate, wok, batch-cook"}</script>

    <noscript><h1>Lomo Saltado Meal Prep — The Split Plate</h1><p>Lean stir-fry beef seared hard in a wok with red onion and yellow tomato, tossed in a six-ingredient sauce (soy, fish, vinegar, Tari Amarillo, ginger-garlic paste, bone-broth stick pack), then finished with green onion and crisp air-fried fries folded in right before serving. Rice cooks in bone broth. Adult bowl gets extra Tari; the creator's kid plate uses the same base with an appetite-based beef portion and either no heat or a touch of toum.</p></noscript>
