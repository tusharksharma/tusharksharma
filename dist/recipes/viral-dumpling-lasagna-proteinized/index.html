    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Viral Dumpling Lasagna, Proteinized","description":"A leaner, higher-protein take on @april_eatz's viral dumpling lasagna (discovered via @smallersam). 51 wonton wrappers layered 15 / 9 / 12 / 15 with a 50/50 mix of 93/7 lean ground chicken and 95/5 lean ground pork, soy sauce, rice vinegar, umami seasoning, ginger-garlic paste, and scallions. Bake covered at 400 F for 30 min after pouring 1 cup chicken broth over the top. Rest 5-10 min, cut into 6 servings, drizzle soy and finish with scallions. Chili-garlic sauce ONLY on the adult section. Full serving = one-sixth of the pan at approximately 450 cal / 40g protein. Household batch: 2 adults + 2 kids for 2 dinners; kids get half servings adjusted for appetite in Tushar's build (kid macros intentionally not published). USDA storage: refrigerate leftovers within 2 hours; use within 4 days. Reheat covered with a splash of broth until center reads 165 F.","image":"https://thesplitplate.com/images/viral-dumpling-lasagna-proteinized/hero-split-adult-kid-plates-polished.webp","totalTime":"PT55M","recipeYield":"6 servings","nutrition":{"@type":"NutritionInformation","calories":"450 calories","proteinContent":"40g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["840 g frozen shredded hash browns (thawed completely and squeezed very dry)","240-300 g liquid egg whites (start at 240g; add 30g only if needed, max ~300g)","168 g / 6 oz reduced-fat shredded cheddar","3 tbsp cornstarch","SPG (salt, pepper, garlic) to taste — creator used Dan-O's SPG","Light avocado-oil spray for the iron","2 lb / 32 oz 93/7 lean ground beef","1/2 cup bone broth","SPG or preferred burger seasoning to taste","4 potato waffles","20 oz raw-equivalent seasoned beef (5 oz per adult serving)","6 slices Velveeta (1.5 per adult serving)","Tari hot sauce to taste","4 regular burger buns","2 potato waffles, cut in half (4 kid sides)","10 oz raw-equivalent seasoned beef (2.5 oz per kid serving; adjust to appetite)","3 slices Velveeta (3/4 per kid serving)","Ketchup to taste"],"recipeInstructions":[{"@type":"HowToStep","name":"Thaw + Squeeze The Potatoes","text":"Thaw 840g shredded hash browns completely. Wrap in a clean kitchen towel and squeeze firmly until no more water drips out. Crispness starts here."},{"@type":"HowToStep","name":"Build The Corrected Waffle Mix","text":"Combine the dry hash browns, 168g cheddar, 3 tbsp cornstarch, and SPG. Add 240g egg whites and mix. Squeeze a handful: if it holds together, stop. If it falls apart, add 30g more egg whites and retest. Do not exceed ~300g. The filmed batch used 414g and was too wet — do not repeat."},{"@type":"HowToStep","name":"Preheat + Load The Iron","text":"Fully preheat the waffle iron. Apply a light, even coat of avocado-oil spray. Divide the mixture into six equal portions."},{"@type":"HowToStep","name":"Cook Six Crisp Waffles","text":"Add one portion, close firmly, cook 6-8 min per waffle until deeply golden and easy to release. If the iron resists opening, give it another minute. Repeat."},{"@type":"HowToStep","name":"Brown The Beef","text":"Brown 2 lb 93/7 beef in a wide skillet, breaking it into small crumbles. Season with SPG. Add 1/2 cup bone broth; cook until the liquid has absorbed and the beef is moist but not wet."},{"@type":"HowToStep","name":"Portion 2","text":"1 ACROSS EIGHT CONTAINERS: Divide the cooked beef so every adult container gets twice the beef of a kid container. Creator's raw allocation: 5 oz per adult / 2.5 oz per kid. Adjust the kid to your own child's appetite."},{"@type":"HowToStep","name":"Top With Cold Cheese + Store","text":"1.5 slices Velveeta on each adult beef portion; 3/4 slice on each kid portion. Cheese stays cold in the container and melts when the beef reheats."},{"@type":"HowToStep","name":"Reheat + Finish","text":"Microwave the beef and cheese ~90 seconds until steaming. Re-crisp each waffle in the air fryer for 6-8 min. Serve adults on one full waffle with Tari. Creator's kids: normal bun + half a waffle + ketchup."}],"keywords":"chicken, pork, wonton, dumpling, lasagna, viral, proteinized, layered-bake, family-dinner, split-plate, one-pan"}</script>

    <noscript><h1>Viral Dumpling Lasagna, Proteinized — The Split Plate</h1><p>A leaner, higher-protein take on @april_eatz's viral dumpling lasagna (discovered via @smallersam). 51 wonton wrappers layered 15 / 9 / 12 / 15 with a 50/50 mix of 93/7 lean ground chicken and 95/5 lean ground pork, soy sauce, rice vinegar, umami seasoning, ginger-garlic paste, and scallions. Bake covered at 400 F for 30 min after pouring 1 cup chicken broth over the top. Rest 5-10 min, cut into 6 servings, drizzle soy and finish with scallions. Chili-garlic sauce ONLY on the adult section. Full serving = one-sixth of the pan at approximately 450 cal / 40g protein. Household batch: 2 adults + 2 kids for 2 dinners; kids get half servings adjusted for appetite in Tushar's build (kid macros intentionally not published). USDA storage: refrigerate leftovers within 2 hours; use within 4 days. Reheat covered with a splash of broth until center reads 165 F.</p></noscript>
