    <noscript><h1>Viral Dumpling Lasagna, Proteinized — The Split Plate</h1><p>A leaner, higher-protein take on @april_eatz's viral dumpling lasagna (discovered via @smallersam). 51 wonton wrappers layered 15 / 9 / 12 / 15 with a 50/50 mix of 93/7 lean ground chicken and 95/5 lean ground pork, soy sauce, rice vinegar, umami seasoning, ginger-garlic paste, and scallions. Bake covered at 400 F for 30 min after pouring 1 cup chicken broth over the top. Rest 5-10 min, cut into 6 servings, drizzle soy and finish with scallions. Chili-garlic sauce ONLY on the adult section. Full serving = one-sixth of the pan at approximately 450 cal / 40g protein. Household batch: 2 adults + 2 kids for 2 dinners; kids get half servings adjusted for appetite in Tushar's build (kid macros intentionally not published). USDA storage: refrigerate leftovers within 2 hours; use within 4 days. Reheat covered with a splash of broth until center reads 165 F.</p></noscript>
