    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Viral Proteinized Burger in a Bun","description":"Inspired by @bymesika's viral burger-stuffed-bun format. The adult version uses two fully cooked 4 oz 93/7 beef patties, a weighed 250-calorie portion of Pillsbury crescent dough, Velveeta shreds stirred with a spoon of protein queso, optional chilies, and balsamic onion. The kid version uses one fully cooked 3 oz 80/20 patty and 1.5 Velveeta cheese slices inside enough dough to enclose it. Seal and bake at 375°F for about 20 minutes, until the dough is cooked and the filling hot. Adult burger: about 700 calories and 62g protein before onions; with one serving of sweet-potato fries: about 820 calories and 63g protein before onions or ketchup. The kid dough amount was not weighed, so no kid macro figure is shown.","image":"https://thesplitplate.com/images/viral-proteinized-burger-in-a-bun/hero-adult-cut-polished.webp","totalTime":"PT45M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeIngredient":["Fully cooked ground-beef patties: four 4 oz raw-weight 93/7 patties for two adult burgers and two 3 oz raw-weight 80/20 patties for two kid burgers","Pillsbury Original Crescent Dough Sheet: two weighed 250-calorie portions for the adult burgers; enough to enclose two kid patties (kid dough not weighed)","1 yellow onion + 1 tsp avocado oil + 1 tsp balsamic vinegar + 1 tsp monk-fruit sweetener + salt, cooked down; add to taste","3 oz Velveeta Original Shreds (1.5 oz per adult burger)","2 tbsp homemade high-protein chipotle-style queso (1 tbsp per adult burger)","Chopped chilies, optional","Caramelized onion, to taste, optional","2 label servings (2.8 oz each) Jesse & Ben's Sweet Potato Tallow Fries, optional","Ketchup, optional (excluded from plate estimate)","3 Velveeta Original cheese slices for two kid burgers (1.5 slices each: 3/4 under and 3/4 above each patty)","Onion optional; Tushar's kids had none"],"recipeInstructions":[{"@type":"HowToStep","name":"Cook The Patties First","text":"Shape two 4 oz 93/7 adult patties and one 3 oz 80/20 kid patty per kid burger, using raw weights. Fully cook and verify ground-beef doneness with a food thermometer before wrapping."},{"@type":"HowToStep","name":"Cook The Optional Onion","text":"Soften one sliced yellow onion in 1 tsp avocado oil; add 1 tsp balsamic, 1 tsp monk-fruit sweetener and salt. Cook until browned. Use as much as you like; onion is outside the stated macros.","image":"https://thesplitplate.com/images/viral-proteinized-burger-in-a-bun/step-02-balsamic-onions-polished.webp"},{"@type":"HowToStep","name":"Preheat And Portion Dough","text":"Heat oven to 375°F. Weigh a 250-calorie portion of crescent dough for the adult burger and portion enough additional dough to enclose each kid patty. The kid portions were not weighed in the filmed cook.","image":"https://thesplitplate.com/images/viral-proteinized-burger-in-a-bun/step-05-kid-cheese-polished.webp"},{"@type":"HowToStep","name":"Build The Adult Burger","text":"Stir the 1.5 oz Velveeta shreds with 1 tbsp protein queso. Layer some cheese mixture, the two fully cooked patties, optional chilies and onion, and the remaining cheese mixture inside the weighed dough.","image":"https://thesplitplate.com/images/viral-proteinized-burger-in-a-bun/step-03-cheese-queso-polished.webp"},{"@type":"HowToStep","name":"Seal And Bake","text":"Close all dough seams. Bake at 375°F for about 20 minutes, until the dough is fully baked and the filling hot. If serving fries, spread one 2.8 oz serving on parchment and bake per its package while the bun bakes. Cut open and serve.","image":"https://thesplitplate.com/images/viral-proteinized-burger-in-a-bun/step-07-seal-polished.webp"},{"@type":"HowToStep","name":"Build The Kid Burger","text":"Lay 3/4 cheese slice on the kid dough, add one fully cooked 3 oz 80/20 patty, then top with the other 3/4 slice. Skip onion for Tushar's filmed version.","image":"https://thesplitplate.com/images/viral-proteinized-burger-in-a-bun/step-05-kid-cheese-polished.webp"},{"@type":"HowToStep","name":"Seal And Bake","text":"Enclose the kid filling completely and bake alongside the adult burger at 375°F for about 20 minutes, until the dough is fully baked and the filling hot. Portion by appetite.","image":"https://thesplitplate.com/images/viral-proteinized-burger-in-a-bun/step-09-family-tray-polished.webp"}],"keywords":"burger, beef, crescent-dough, high-protein, family-dinner, split-cook, viral"}</script>

    <noscript><h1>Viral Proteinized Burger in a Bun — The Split Plate</h1><p>Inspired by @bymesika's viral burger-stuffed-bun format. The adult version uses two fully cooked 4 oz 93/7 beef patties, a weighed 250-calorie portion of Pillsbury crescent dough, Velveeta shreds stirred with a spoon of protein queso, optional chilies, and balsamic onion. The kid version uses one fully cooked 3 oz 80/20 patty and 1.5 Velveeta cheese slices inside enough dough to enclose it. Seal and bake at 375°F for about 20 minutes, until the dough is cooked and the filling hot. Adult burger: about 700 calories and 62g protein before onions; with one serving of sweet-potato fries: about 820 calories and 63g protein before onions or ketchup. The kid dough amount was not weighed, so no kid macro figure is shown.</p></noscript>
