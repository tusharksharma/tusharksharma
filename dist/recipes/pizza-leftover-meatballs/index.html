    <noscript><h1>Pizza + Leftover Meatballs Dinner — The Split Plate</h1><p>The two-container weeknight assembly that turns pizza + leftover meatballs into a protein-dense family dinner. Bake pizza per its package, reheat leftover Lean Beef Meatballs covered in marinara, and portion by appetite. Adult plate: half a Yough! Mozzarella Cheese Pizza (330 cal / 20g protein per label) + 5 meatballs (285 cal / 34g protein) + 1/4 cup marinara (~50 cal / 1g protein) ≈ 665 cal / 55g protein estimated. Kid plate: Costco single-serve pizza + 2-3 leftover meatballs with marinara — the creator's tested build. This recipe only works if you already have the Lean Beef Meatballs (30-piece cookbook base) in the fridge or freezer.</p></noscript>
