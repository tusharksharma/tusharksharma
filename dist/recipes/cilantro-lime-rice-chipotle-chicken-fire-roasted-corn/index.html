    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cilantro-Lime Rice Bowls with Chipotle Chicken & Fire-Roasted Corn","description":"One shared cook, two family-friendly plates. Chargrilled chipotle-seasoned chicken reheats in the air fryer, fire-roasted corn boils in 5 min, and Bone Broth Rice is either freshly cooked or reheated from meal prep. Adults get their rice tossed with fresh cilantro + lime juice + salt and topped with 1 tbsp Tari Verde; kids get the same rice with butter and finished with 1/2 tbsp toum. Not two separate meals — one cook, two finishes. 472 cal / 43g protein per adult plate. Kid macros intentionally not published: Tushar served 1/2 rice serving + 3 oz chicken + 2 oz corn + 1/2 tbsp toum per tray, and appetite varies. USDA storage window: refrigerate leftovers within 2 hours; use within 3-4 days.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/hero-split-adult-kid-plates-polished.webp","prepTime":"PT10M","cookTime":"PT30M","totalTime":"PT40M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Mexican","recipeIngredient":["3 prepared servings Bone Broth Rice (from the 8-serving base recipe)","18 oz fully cooked chargrilled chipotle-seasoned chicken","8 oz frozen fire-roasted corn","1-2 limes (for the corn seasoning and the adult rice finish)","Salt, to taste","2 prepared servings Bone Broth Rice (from the shared cook)","1 generous handful fresh cilantro, chopped","Juice of 1 lime (to taste)","Salt, to taste","12 oz reheated chipotle chicken (6 oz per adult)","4 oz cooked fire-roasted corn (2 oz per adult)","2 tbsp Tari Verde (1 tbsp per adult, drizzled on top)","1 prepared serving Bone Broth Rice (split between two trays)","1 tbsp butter (divided across both rice portions)","6 oz reheated chipotle chicken (3 oz per tray)","4 oz cooked fire-roasted corn (2 oz per tray)","1 tbsp toum or preferred mayo-based sauce (1/2 tbsp per tray in Tushar's build)"],"recipeInstructions":[{"@type":"HowToStep","name":"Prepare The Bone Broth Rice","text":"Cook a fresh batch (2 cups rice + 4 cups bone broth, 18-20 min covered on low + 10 min rest) OR reheat 3 stored servings until steaming hot.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/step-01-bone-broth-rice.webp"},{"@type":"HowToStep","name":"Reheat The Chicken","text":"Air fryer 10 min at the package-recommended temperature. Confirm steaming hot throughout before serving.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/step-03-air-fryer-chicken.webp"},{"@type":"HowToStep","name":"Boil The Corn","text":"5 min in salted water. Drain, then season with fresh lime juice and salt to taste.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/step-04-fire-roasted-corn.webp"},{"@type":"HowToStep","name":"Toss Adult Rice","text":"Combine 2 rice servings with chopped cilantro, lime juice, and salt to taste. Toss while the rice is still warm — the aroma opens up faster.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/step-02-cilantro-lime-rice.webp"},{"@type":"HowToStep","name":"Plate Adult","text":"Divide the cilantro-lime rice across two plates. Add 6 oz chicken and 2 oz corn to each. Drizzle 1 tbsp Tari Verde over the top of each plate — do not mix in.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/step-06-adult-tari-verde-finish.webp"},{"@type":"HowToStep","name":"Split The Kid Rice","text":"Divide 1 rice serving across two trays. Add 1/2 tbsp butter per tray while the rice is warm; toss until melted.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/step-05-kid-toum-finish.webp"},{"@type":"HowToStep","name":"Plate The Kid Trays","text":"Add 3 oz chicken and 2 oz corn to each tray. Drizzle 1/2 tbsp toum over the chicken in each tray. ADJUST PORTIONS FOR YOUR OWN KIDS' APPETITES.","image":"https://thesplitplate.com/images/cilantro-lime-chipotle-chicken-rice/step-05-kid-toum-finish.webp"}],"keywords":"chicken, rice bowl, chipotle, cilantro-lime, tari-verde, toum, shortcut, assembly, weeknight, split-plate, family-dinner, kid-approved, bone-broth-rice"}</script>

    <noscript><h1>Cilantro-Lime Rice Bowls with Chipotle Chicken &amp; Fire-Roasted Corn — The Split Plate</h1><p>One shared cook, two family-friendly plates. Chargrilled chipotle-seasoned chicken reheats in the air fryer, fire-roasted corn boils in 5 min, and Bone Broth Rice is either freshly cooked or reheated from meal prep. Adults get their rice tossed with fresh cilantro + lime juice + salt and topped with 1 tbsp Tari Verde; kids get the same rice with butter and finished with 1/2 tbsp toum. Not two separate meals — one cook, two finishes. 472 cal / 43g protein per adult plate. Kid macros intentionally not published: Tushar served 1/2 rice serving + 3 oz chicken + 2 oz corn + 1/2 tbsp toum per tray, and appetite varies. USDA storage window: refrigerate leftovers within 2 hours; use within 3-4 days.</p></noscript>
