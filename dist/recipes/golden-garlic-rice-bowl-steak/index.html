he official page; verify the physical label)","(Kid macros not displayed — appetite + swap flexibility vary meaningfully per kid)"],"recipeInstructions":[{"@type":"HowToStep","name":"Pulse Aromatics","text":"Pulse ~30g frozen garlic cubes + ~60g frozen baby onions in a food processor 5-7 times until finely chopped but NOT pureed.","image":"https://thesplitplate.com/images/golden-garlic-rice-bowl-steak/step-01-pulse-frozen-aromatics.webp"},{"@type":"HowToStep","name":"Sauté in Ghee","text":"Melt 3 tbsp Kirkland ghee in a large pot over medium heat. Add the pulsed aromatics, cook until soft and fragrant (~2-3 min).","image":"https://thesplitplate.com/images/golden-garlic-rice-bowl-steak/step-02-cook-aromatics-in-ghee.webp"},{"@type":"HowToStep","name":"Add Broth","text":"Pour in 4 cups chicken bone broth.","image":"https://thesplitplate.com/images/golden-garlic-rice-bowl-steak/step-03-add-bone-broth.webp"},{"@type":"HowToStep","name":"Bloom Turmeric + Season","text":"Add 1.5 tsp turmeric + 1.5 tsp salt. Stir until evenly golden — this is the golden-rice color moment.","image":"https://thesplitplate.com/images/golden-garlic-rice-bowl-steak/step-04-season-golden-rice-polished.webp"},{"@type":"HowToStep","name":"Add Rinsed Rice","text":"Stir in 2 cups rinsed basmati and bring to a boil.","image":"https://thesplitplate.com/images/golden-garlic-rice-bowl-steak/step-05-add-rinsed-rice.webp"},{"@type":"HowToStep","name":"Cook Rice","text":"Reduce to low, cover, cook ~15 min (or per the rice package). Rest covered 5 min after cook, then fluff."},{"@type":"HowToStep","name":"Portion 8 Equal Rice Servings","text":"Divide the cooked rice evenly across 8 shallow containers — ~3/4 cup cooked rice per container. Same portion for adults + kids (the kid-request insight from the updated version).","image":"https://thesplitplate.com/images/golden-garlic-rice-bowl-steak/step-06-portion-eight-rice-servings-polished.webp"},{"@type":"HowToStep","name":"Sear Steak Pucks","text":"Heat an unc     <noscript><h1>Golden Garlic Rice Bowl with Steak — The Split Plate</h1><p>ONE cook, EIGHT bowls, TWO family dinners. Golden turmeric-garlic rice built on bone broth + 3 tbsp ghee + frozen garlic cubes + frozen baby onions (no-waste shortcut). Thin-sliced sirloin seared from frozen in a hot skillet, broken into ribbons, then portioned — 6 oz per adult bowl / 3 oz per kid bowl. Adults get 2 tsp Tari Aji Amarillo (aji amarillo heat, adult-only — the label carries egg / soy / mustard). Kids get 2 tsp toum (mild garlic sauce, Mezete Toum currently vegan + gluten-free per the official page — verify the physical label). Sauce ONLY on the dinner being eaten now; second dinner refrigerates sauce-free and reheats first. ~520 cal / 45g protein per adult bowl (creator-approved rounded estimate; recheck packaged-product labels for label-verified macros). Kid macros not displayed — appetite + swap flexibility vary per kid. No garnish in the updated version.</p></noscript>
