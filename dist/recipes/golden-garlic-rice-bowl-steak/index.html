    <noscript><h1>Golden Garlic Rice Bowl with Steak — The Split Plate</h1><p>ONE cook, EIGHT bowls, TWO family dinners. Golden turmeric-garlic rice built on bone broth + 3 tbsp ghee + frozen garlic cubes + frozen baby onions (no-waste shortcut). Thin-sliced sirloin seared from frozen in a hot skillet, broken into ribbons, then portioned — 6 oz per adult bowl / 3 oz per kid bowl. Adults get 2 tsp Tari Aji Amarillo (aji amarillo heat, adult-only — the label carries egg / soy / mustard). Kids get 2 tsp toum (mild garlic sauce, Mezete Toum currently vegan + gluten-free per the official page — verify the physical label). Sauce ONLY on the dinner being eaten now; second dinner refrigerates sauce-free and reheats first. ~520 cal / 45g protein per adult bowl (creator-approved rounded estimate; recheck packaged-product labels for label-verified macros). Kid macros not displayed — appetite + swap flexibility vary per kid. No garnish in the updated version.</p></noscript>
