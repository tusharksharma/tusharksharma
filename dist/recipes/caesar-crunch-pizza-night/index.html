    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Caesar Crunch Pizza Night","description":"20-min weeknight where everyone gets the pizza they want. Adult plate: 1/3 of a Bettergoods Italian Wood-Fired Margherita Pizza + a full Caesar Crunch Salad — chopped Sweet Gem lettuce + diced Soules Kitchen Fajita Chicken (6 oz) + Bolthouse Farms Creamy Caesar + crushed Quest Hot & Spicy chips + Dan-O's Jalapeño Cheesoning + optional Smoky Chipotle Crema drizzle. Kid plate: one personal Red Baron Deep Dish (Pepperoni or Four Cheese — kid picks) + small undressed salad portion. Salad is built once in a big bowl; pizzas bake simultaneously. Total active time under 10 min.","image":"https://thesplitplate.com/images/caesar-crunch-pizza/hero.webp","totalTime":"PT20M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeIngredient":["1 pack (8 oz) Tanimura & Antle Artisan Sweet Gem Lettuce, chopped","12 oz Soules Kitchen Fully Cooked Fajita Chicken, diced","1/2 bag Quest Hot & Spicy Tortilla Style Protein Chips, crushed coarse","2-3 tbsp Bolthouse Farms Creamy Caesar Parmigiano dressing","Generous sprinkle Dan-O's Jalapeño Cheesoning","OPTIONAL: 1-2 tsp Smoky Chipotle Crema drizzle (cookbook)","1/3 Bettergoods Italian Wood-Fired Margherita Pizza (2 of 6 slices)","1 tbsp Bolthouse Farms Creamy Caesar","(NO Dan-O's Jalapeño Cheesoning — visible flecks deter)","(NO Chipotle Crema)","1 personal Red Baron Deep Dish Pepperoni OR Four Cheese (whole, undivided)"],"recipeInstructions":[{"@type":"HowToStep","text":"PREHEAT OVEN to 400°F."},{"@type":"HowToStep","name":"Mise en Place","text":"Sweet Gem chopped into bite pieces, Soules chicken diced 1/2-inch cubes, Quest chips crushed coarse (zip-bag + rolling pin works).","image":"https://thesplitplate.com/images/caesar-crunch-pizza/step1-mise.webp"},{"@type":"HowToStep","name":"Start Red Barons","text":"2 personal Red Baron Deep Dish pizzas on a sheet pan. 18-min timer.","image":"https://thesplitplate.com/images/caesar-crunch-pizza/step3-pizza-options.webp"},{"@type":"HowToStep","name":"Build Salad in Big Bowl","text":"Lettuce + diced chicken in a large bowl. Toss gently. DO NOT dress yet. Keep chips aside.","image":"https://thesplitplate.com/images/caesar-crunch-pizza/step2-salad-mix.webp"},{"@type":"HowToStep","text":"ADD BETTERGOODS at the 6-8 min mark. Onto a separate sheet pan or pizza stone in the same oven. 14-16 min bake — should finish ~same time as the Red Barons."},{"@type":"HowToStep","name":"Pizzas Done","text":"Pull Bettergoods (golden, basil dark green not black) + Red Barons (cheese melted, crust deep brown). Let rest 2 min.","image":"https://thesplitplate.com/images/caesar-crunch-pizza/step4-pizza-baked.webp"},{"@type":"HowToStep","text":"SLICE BETTERGOODS into 6 wedges. Each adult gets 2 slices = 1/3 of the pie."},{"@type":"HowToStep","name":"Dress Adult Salad","text":"Half the undressed salad into an adult bowl. Drizzle 2-3 tbsp Bolthouse Caesar. Toss. Sprinkle Dan-O's Jalapeño Cheesoning generously. Top with crushed Quest chips (don't pre-toss). Optional: 1-2 tsp Smoky Chipotle Crema drizzle."},{"@type":"HowToStep","name":"Plate","text":"Wide bowl with the dressed Caesar Crunch + 2 slices Bettergoods.","image":"https://thesplitplate.com/images/caesar-crunch-pizza/hero.webp"},{"@type":"HowToStep","name":"Scoop Kid Salad","text":"Half-cup undressed salad into a small bowl. Toss with 1 tbsp Bolthouse Caesar. Optional: 1 tbsp crushed Quest chips on top."},{"@type":"HowToStep","name":"Plate Kid","text":"Personal Red Baron whole + small Caesar bowl/ramekin alongside. Pink Munchkin fork for the salad.","image":"https://thesplitplate.com/images/caesar-crunch-pizza/step6-kid-plates.webp"}],"keywords":"pizza, salad, split-pizza, freezer-to-plate, no-cook-protein, weeknight, kid-favorite, caesar"}</script>

    <noscript><h1>Caesar Crunch Pizza Night — The Split Plate</h1><p>20-min weeknight where everyone gets the pizza they want. Adult plate: 1/3 of a Bettergoods Italian Wood-Fired Margherita Pizza + a full Caesar Crunch Salad — chopped Sweet Gem lettuce + diced Soules Kitchen Fajita Chicken (6 oz) + Bolthouse Farms Creamy Caesar + crushed Quest Hot &amp; Spicy chips + Dan-O's Jalapeño Cheesoning + optional Smoky Chipotle Crema drizzle. Kid plate: one personal Red Baron Deep Dish (Pepperoni or Four Cheese — kid picks) + small undressed salad portion. Salad is built once in a big bowl; pizzas bake simultaneously. Total active time under 10 min.</p></noscript>
