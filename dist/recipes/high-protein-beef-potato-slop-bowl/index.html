    <noscript><h1>High-Protein Beef &amp; Potato Slop Bowl — The Split Plate</h1><p>A viral beef-and-potato bowl adapted for split-plate. Roast 24 oz diced Yukon Gold potatoes at 450°F for 40 min (toss halfway). Brown 24 oz 93/7 lean ground beef in a wide skillet with SPG in parallel. Split at plating: each adult bowl gets 8 oz raw-weight potatoes, 8 oz raw-weight beef, one serving of the linked High-Protein Chipotle Cheddar Sauce, and crunchy Mt. Olive jalapeños (~620 cal / 62g protein). The creator serves each young child half of the adult potato and beef portions, deconstructed, with a mild melted Velveeta drizzle and cucumber or carrot sticks — no jalapeños. Cook once; finish twice.</p></noscript>
