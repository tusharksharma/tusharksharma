    <noscript><h1>Ground Goat Keema Matar with Phulkas — The Split Plate</h1><p>Season lean ground goat with coriander, cumin, garam masala, Kashmiri chili and paprika. Soften onion in ghee, add ginger-garlic paste, then crumble and cook the goat. Simmer with tomato puree, chicken bone broth and peas. Set aside mild portions before adding Fresno chilies to the adult pan. Serve with store-bought phulkas and optional cucumber. One-eighth of the keema batch is estimated at about 290 calories and 38g protein, before phulkas; children's portions have no macro estimate.</p></noscript>
