    <noscript><h1>Peruvian-Style Chicken Thighs with Roasted Corn — The Split Plate</h1><p>Marinate boneless, skinless chicken thighs in the Golden Umami Stir-Fry Sauce, then grill with corn on the upper rack until the thighs reach 165°F and the corn is browned. Plate two thighs, an ear of corn, and 2 tbsp of the High-Protein Cilantro Jalapeno Ranch for each adult. For the kids, chop one thigh bite-size and serve with corn and a familiar mild sauce or Alfredo. Refrigerate the second dinner and reheat to 165°F.</p></noscript>
