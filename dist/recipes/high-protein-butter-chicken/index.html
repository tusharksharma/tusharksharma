icken bone broth until completely smooth — this is what replaces the cream."},{"@type":"HowToStep","name":"Build The Sauce","text":"Melt the ghee in a wide pan. Cook the ginger-garlic paste briefly, then stir in the marinara, garam masala, cumin, and paprika."},{"@type":"HowToStep","name":"Combine + Simmer","text":"Stir in the chopped chicken and the blended cottage-cheese mixture. Add the kasoori methi and simmer until cohesive and glossy."},{"@type":"HowToStep","name":"Split on Heat","text":"Plate the kids' portions of the same base first. Then stir Kashmiri chilli into the remaining sauce for the adults. Serve with phulkas or rice."}],"keywords":"butter-chicken, chicken-thighs, high-protein, cottage-cheese, air-fryer, family-dinner, indian, weeknight, kid-approved"}</script>

    <noscript><h1>High-Protein Weeknight Butter Chicken — The Split Plate</h1><p>Coat chicken thighs in tandoori masala and air-fry until 165°F, then chop. Blend cottage cheese with chicken bone broth until smooth. Bloom ginger-garlic paste in ghee, add marinara, garam masala, cumin, and paprika, then stir in the chicken and the blended cottage cheese. Finish with kasoori methi and simmer until cohesive. Plate the kids' portions first, then stir Kashmiri chilli into what's left for the adults. Serve with phulkas or rice.</p></noscript>
