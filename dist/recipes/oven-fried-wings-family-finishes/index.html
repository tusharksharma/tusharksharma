    <noscript><h1>Oven-Fried Wings with Family Sauce Finishes — The Split Plate</h1><p>Season chicken wing flats and drumettes with 1 tsp salt and 1/2 tbsp baking powder per pound, then bake on a wire rack at 450°F for 45 minutes per side. Ovens and wing sizes vary, so check browning and verify the thickest meat reaches 165°F without touching bone. Finish adult wings with Kinder's Buffalo and Melinda's Ghost Pepper; make the kids' portion with butter and bottled Parmesan Garlic sauce, to taste. Serve with carrots, celery and a high-protein blue-cheese dressing. The approximate 650-calorie / 55g protein figure is a conditional estimate for the pictured adult eight-wing plate only; the wings and sauce portions were not weighed.</p></noscript>
