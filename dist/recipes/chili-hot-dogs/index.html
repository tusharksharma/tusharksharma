    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Chili Hot Dogs","description":"510 cal / 58g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get 1.5 loaded chili dogs on Nature's Own keto buns with red onion, banana peppers, and 1/2 slice Velveeta per dog. Kids get 1 deconstructed chili dog on a Ball Park regular bun + 0.5 beef dog on the side + optional yellow mustard — plated on a divided tray so they can build their own. Reusable 12-serving Hot Dog Chili Base: 2 lb 93/7 grass-fed ground beef browned with Spiceology BBQ rub, Dijon, Worcestershire, tomato paste, and bone broth — reduced until thick enough to stay on a dog. This family dinner uses 6 servings; the other 6 anchor a later chili mac / baked potato / fries night.","image":"https://thesplitplate.com/images/chili-hot-dogs/hero-split-adult-kid-plates-polished.webp","totalTime":"PT45M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeIngredient":["6 beef hot dogs (Nathan's / Ball Park Angus / Kirkland uncured — pick one)","1 batch Hot Dog Chili Base (2 lb 93/7 ground beef + Spiceology BBQ rub or alternative seasoning + Dijon + Worcestershire + tomato paste + bone broth)","3 slices Velveeta Original (1/2 slice per dog)","3 Nature's Own Keto Hot Dog Buns (1.5 per adult plate)","Finely chopped red onion, to taste","Sliced banana peppers, to taste","2 Ball Park regular hot dog buns (1 per kid)","Yellow mustard, to taste (optional — only if they ask)"],"recipeInstructions":[{"@type":"HowToStep","name":"Chili Base","text":"Make the Hot Dog Chili Base (or reheat 6 stored servings). Brown 2 lb 93/7 ground beef, season with 3 tbsp Spiceology BBQ rub (or the alternative blend), stir in Dijon + Worcestershire, add tomato paste + bone broth, reduce uncovered until the visible liquid is gone. Divide into 12 servings; use 6 tonight.","image":"https://thes     <noscript><h1>Split Plate Chili Hot Dogs — The Split Plate</h1><p>510 cal / 58g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get 1.5 loaded chili dogs on Nature's Own keto buns with red onion, banana peppers, and 1/2 slice Velveeta per dog. Kids get 1 deconstructed chili dog on a Ball Park regular bun + 0.5 beef dog on the side + optional yellow mustard — plated on a divided tray so they can build their own. Reusable 12-serving Hot Dog Chili Base: 2 lb 93/7 grass-fed ground beef browned with Spiceology BBQ rub, Dijon, Worcestershire, tomato paste, and bone broth — reduced until thick enough to stay on a dog. This family dinner uses 6 servings; the other 6 anchor a later chili mac / baked potato / fries night.</p></noscript>
