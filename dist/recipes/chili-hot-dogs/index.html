    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Chili Hot Dogs","description":"510 cal / 58g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get 1.5 loaded chili dogs on Nature's Own keto buns with red onion, banana peppers, and 1/2 slice Velveeta per dog. Kids get 1 deconstructed chili dog on a Ball Park regular bun + 0.5 beef dog on the side + optional yellow mustard — plated on a divided tray so they can build their own. Reusable 12-serving Hot Dog Chili Base: 2 lb 93/7 grass-fed ground beef browned with Spiceology BBQ rub, Dijon, Worcestershire, tomato paste, and bone broth — reduced until thick enough to stay on a dog. This family dinner uses 6 servings; the other 6 anchor a later chili mac / baked potato / fries night.","image":"https://thesplitplate.com/images/chili-hot-dogs/hero-split-adult-kid-plates-polished.webp","totalTime":"PT45M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"510 calories","proteinContent":"58g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["6 beef hot dogs (Nathan's / Ball Park Angus / Kirkland uncured)","6 servings Hot Dog Chili Base (1 batch makes 12; reserve 6 for chili mac / baked potatoes / fries later)","3 slices Velveeta Original (1/2 slice per dog)","3 Nature's Own Keto Hot Dog Buns [adult]","2 Ball Park regular hot dog buns [kid]","Red onion, finely chopped, to taste [adult]","Sliced banana peppers, to taste [adult]","Yellow mustard, to taste, optional [kid]"],"recipeInstructions":[{"@type":"HowToStep","name":"Make or Reheat Chili Base","text":"Full recipe on the Hot Dog Chili Base cookbook page. Brown 2 lb 93/7 beef, season, add Dijon + Worcestershire + tomato paste + bone broth, reduce until the visible liquid is gone. Divide into 12 servings; use 6 tonight. (If reheating pre-made, just warm 6 servings in a covered saucepan.)"},{"@type":"HowToStep","name":"Score Dogs","text":"Shallow diagonal cuts on 6 beef dogs — 3-4 marks per dog, no more than 1/4 through."},{"@type":"HowToStep","name":"Air Fry","text":"400°F for ~7 min. Air fryers vary — check early. Pull when scores open and edges are lightly charred."},{"@type":"HowToStep","name":"Adult Toppings Prep","text":"Finely chop red onion. Slice banana peppers."},{"@type":"HowToStep","name":"Buns + Velveeta","text":"Warm 3 Nature's Own keto (adult) + 2 Ball Park regular (kid) buns. Fold 1/2 Velveeta slice into each bun."},{"@type":"HowToStep","name":"Place Dogs + Spoon Chili","text":"Dog into the bun; 1 chili serving over each dog. Adult buns get chili on the dog. Kid bun stays deconstructed — dog on the plate, chili in a separate well."},{"@type":"HowToStep","name":"Adult Finish","text":"Scatter red onion + banana peppers on the adult chili dogs. Plate 1.5 dogs per adult."},{"@type":"HowToStep","name":"Kid Plate","text":"Divided tray. 1 Ball Park bun (with Velveeta) + 1 whole dog for building + 0.5 dog sliced into rounds on the side + 1 serving chili in a well. Optional yellow mustard if they ask."}],"keywords":"hot-dogs, chili, beef, comfort, split-cook, batch-cook, family-dinner, keto-bun-adult, air-fryer, weeknight"}</script>

    <noscript><h1>Split Plate Chili Hot Dogs — The Split Plate</h1><p>510 cal / 58g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get 1.5 loaded chili dogs on Nature's Own keto buns with red onion, banana peppers, and 1/2 slice Velveeta per dog. Kids get 1 deconstructed chili dog on a Ball Park regular bun + 0.5 beef dog on the side + optional yellow mustard — plated on a divided tray so they can build their own. Reusable 12-serving Hot Dog Chili Base: 2 lb 93/7 grass-fed ground beef browned with Spiceology BBQ rub, Dijon, Worcestershire, tomato paste, and bone broth — reduced until thick enough to stay on a dog. This family dinner uses 6 servings; the other 6 anchor a later chili mac / baked potato / fries night.</p></noscript>
