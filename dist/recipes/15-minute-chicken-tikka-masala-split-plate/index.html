th feta blocks among the tomatoes; drizzle the remaining oil over the feta. Bake 45 min."},{"@type":"HowToStep","name":"Air-fry Chicken","text":"20 min. Verify safe internal temperature before pulling. Rest briefly, chop into bite-size pieces."},{"@type":"HowToStep","name":"Cook Pastas Separately","text":"12 oz low-carb penne + 9 oz regular penne in two salted-water pots per each package. Drain, keep separate."},{"@type":"HowToStep","name":"Mash The Sauce","text":"Stir baked feta + tomatoes until creamy with visible tomato pieces. Do not blend smooth."},{"@type":"HowToStep","name":"Split 2","text":"1: Move ~1/3 of the sauce and ~1/3 of the chicken to a second mixing bowl. Leave 2/3 in the casserole."},{"@type":"HowToStep","name":"Fold Regular Penne","text":"Into the smaller-portion bowl. Coat evenly."},{"@type":"HowToStep","name":"Fold Low-carb Penne","text":"Into the main casserole. Coat evenly."},{"@type":"HowToStep","name":"Pack 6 + 6","text":"Six adult containers (2 oz dry low-carb penne equivalent) + six smaller containers (1.5 oz dry regular penne equivalent). Cool 20-30 min uncovered before sealing."}],"keywords":"chicken, tikka masala, indian, north-indian, weeknight, split-plate, stovetop, fridge-shortcut, freezer-shortcut, family-dinner, kid-approved, assembly, 15-min, emergency-dinner"}</script>

    <noscript><h1>15-Minute Chicken Tikka Masala Split Plate — The Split Plate</h1><p>540 cal / 50g protein per adult plate, 405 cal / 38g protein per kid plate. Serves 2 adults + 2 kids from one 36 oz twin-pack. Warm the sealed Sukhi's Costco tikka masala pouches in hot water 5-7 min while the rumali rotis thaw. Empty into a saucepan, cover, heat 5 min stirring once until steaming. REMOVE 3 SERVINGS (1.5 per kid) BEFORE adding chili — this is the split point. Stir 1 tsp Kashmiri chili into the remaining 4 adult servings and heat briefly to bloom. Adults get 2 servings + 2 rotis plated together. Kids get 1.5 servings + 1.5 rotis, chicken/gravy/rotis in separate compartments for self-dipping. Same tikka, same rotis, split at the pot — this is not scratch-made curry; it's a realistic busy-parent dinner strategy. HALAL claim requires verifying the specific Sukhi's package before publishing — ships pork-free only by default.</p></noscript>
