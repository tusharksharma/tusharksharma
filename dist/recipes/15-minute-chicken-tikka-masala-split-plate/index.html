en-tikka-masala-split-plate/step-01-warm-sealed-pouches.webp"},{"@type":"HowToStep","name":"Empty Into a Saucepan","text":"Discard the warming water. Cut open the pouches and empty the tikka masala into a saucepan.","image":"https://thesplitplate.com/images/15-minute-chicken-tikka-masala-split-plate/step-02-empty-pouches.webp"},{"@type":"HowToStep","name":"Pan-heat Covered","text":"Cover the saucepan and heat on medium-low for about 5 min, stirring once, until the chicken and sauce are steaming hot throughout."},{"@type":"HowToStep","name":"Warm The Rotis","text":"While the tikka heats, warm the frozen rotis one at a time in a dry pan 10-15 sec per side (or per the package). Stack under a clean towel to hold soft."},{"@type":"HowToStep","name":"Split Point — Remove Kid Portions","text":"Before adding any Kashmiri chili, spoon out 3 total tikka masala servings for the kids' plates (1.5 servings per kid). This is the non-negotiable step — spice doesn't come back out once it's in.","image":"https://thesplitplate.com/images/15-minute-chicken-tikka-masala-split-plate/step-03-portion-kids.webp"},{"@type":"HowToStep","name":"Stir in Kashmiri Chili","text":"With the 4 adult servings still in the pan, sprinkle 1 tsp Kashmiri chili powder over the surface and stir to distribute. Heat 30-60 sec covered to bloom the spice.","image":"https://thesplitplate.com/images/15-minute-chicken-tikka-masala-split-plate/step-05-kashmiri-chili-adult-upgrade.webp"},{"@type":"HowToStep","name":"Plate The Adult","text":"Spoon 2 tikka masala servings onto or next to 2 warmed rumali rotis. Serve immediately. 540 cal / 50g protein.","image":"https://thesplitplate.com/images/15-minute-chicken-tikka-masala-split-plate/step-06-plate-adult-tikka.webp"},{"@type":"HowToStep","name":"Plate The Kid","text":"Portion 1.5 tikka masala servings into a compartment tray — chicken pieces in one section, extra gravy in a separate ramekin or well, 1.5 warmed rotis torn or halved on the side. Kid controls dipping,     <noscript><h1>15-Minute Chicken Tikka Masala Split Plate — The Split Plate</h1><p>540 cal / 50g protein per adult plate, 405 cal / 38g protein per kid plate. Serves 2 adults + 2 kids from one 36 oz twin-pack. Warm the sealed Sukhi's Costco tikka masala pouches in hot water 5-7 min while the rumali rotis thaw. Empty into a saucepan, cover, heat 5 min stirring once until steaming. REMOVE 3 SERVINGS (1.5 per kid) BEFORE adding chili — this is the split point. Stir 1 tsp Kashmiri chili into the remaining 4 adult servings and heat briefly to bloom. Adults get 2 servings + 2 rotis plated together. Kids get 1.5 servings + 1.5 rotis, chicken/gravy/rotis in separate compartments for self-dipping. Same tikka, same rotis, split at the pot — this is not scratch-made curry; it's a realistic busy-parent dinner strategy. HALAL claim requires verifying the specific Sukhi's package before publishing — ships pork-free only by default.</p></noscript>
