    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Smash Burgers + Fries","description":"490 cal / 51g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get a Bettergoods Keto bun with 2 x 3 oz 93/7 smashed patties, 2 Velveeta slices, an In-N-Out-style spread (mustard + mayo + ketchup + pickle juice + harissa + chopped pickles), and 1 full serving Rally's Famous Fries with extra sauce for dipping. Kids get a Marketside Brioche Slider Roll with 1 x 3 oz 80/20 smashed patty, 1 Velveeta slice, a bottled secret sauce, and a 1/2 serving of Rally's fries with ketchup. Same griddle timing, same salt-before-smash technique — the split is at the plate, not at the cook.","image":"https://thesplitplate.com/images/smash-burger-split-plate/hero-split-adult-kid-plates-polished.webp","totalTime":"PT30M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"490 calories","proteinContent":"51g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["12 oz 93/7 ground beef (4 x 3 oz patties)","6 oz 80/20 ground beef (2 x 3 oz patties)","6 Velveeta Original slices (4 adult + 2 kid)","2 Bettergoods Keto Friendly Hamburger Buns (adult)","2 Marketside Brioche Slider Rolls (kid)","3 servings Rally's Famous Fries (2 adult + 1 split across 2 kids)","1 tbsp yellow mustard","1 tbsp light mayo","1 tbsp ketchup","1 tbsp pickle juice","1 tsp harissa (Shuug or any)","Chopped dill pickles to taste","Bottled secret/special sauce (Heinz Special Sauce or similar)","Ketchup (for fries)","Kosher salt","Cooking spray or beef tallow (bun toast)"],"recipeInstructions":[{"@type":"HowToStep","name":"Sauce First","text":"Mix 1 tbsp mustard + 1 tbsp light mayo + 1 tbsp ketchup + 1 tbsp pickle juice + 1 tsp harissa + chopped pickles in a small bowl. Set aside."},{"@type":"HowToStep","name":"Portion","text":"93/7 beef into 4 x 3 oz balls (adults). 80/20 beef into 2 x 3 oz balls (kids). Loose — don't compress."},{"@type":"HowToStep","name":"Fries","text":"Rally's Famous Fries into the air fryer at 400°F for 15 min. Start BEFORE the griddle."},{"@type":"HowToStep","name":"Griddle Hot","text":"Cast iron or flat-top on medium-high 4-5 min. Water droplet skitters + evaporates in 2 sec."},{"@type":"HowToStep","name":"Patties on","text":"Beef balls onto the hot griddle — adult side + kid side. Pinch of kosher salt on each within 5 seconds."},{"@type":"HowToStep","name":"Smash","text":"Flat spatula + parchment paper. Smash each ball to ~1/4-inch. Lacy edges = the goal. 30-45 sec between griddle-hit and smash."},{"@type":"HowToStep","name":"Mustard Flip","text":"2-3 min undisturbed for crust. Blob of mustard on the raw top, then flip. 90 sec on side two."},{"@type":"HowToStep","name":"Cheese","text":"Velveeta slice on each patty immediately after the flip. Cover with metal bowl / pan lid 30 sec to melt."},{"@type":"HowToStep","name":"Toast Buns","text":"Keto buns + brioche sliders cut-side down in the beef fat, 30-45 sec."},{"@type":"HowToStep","name":"Adult Build","text":"Toasted keto bun bottom → 1 tbsp spread → 2 stacked patties with cheese → pickle chips → toasted keto bun top. Plate with fries + 1 tbsp extra spread for dipping."},{"@type":"HowToStep","name":"Kid Build","text":"Toasted brioche slider bottom → squeeze bottled sauce → 1 patty with cheese → toasted brioche top. Plate with 1/2 serving fries + ketchup puddle."},{"@type":"HowToStep","name":"Eat Immediately","text":"Smash burgers lose their crust fast. Serve straight off the griddle."}],"keywords":"beef, smash-burger, burger-night, split-cook, weeknight, high-protein, griddle, in-n-out-style, kid-approved, medium-carb"}</script>

    <noscript><h1>High-Protein Smash Burgers + Fries — The Split Plate</h1><p>490 cal / 51g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get a Bettergoods Keto bun with 2 x 3 oz 93/7 smashed patties, 2 Velveeta slices, an In-N-Out-style spread (mustard + mayo + ketchup + pickle juice + harissa + chopped pickles), and 1 full serving Rally's Famous Fries with extra sauce for dipping. Kids get a Marketside Brioche Slider Roll with 1 x 3 oz 80/20 smashed patty, 1 Velveeta slice, a bottled secret sauce, and a 1/2 serving of Rally's fries with ketchup. Same griddle timing, same salt-before-smash technique — the split is at the plate, not at the cook.</p></noscript>
