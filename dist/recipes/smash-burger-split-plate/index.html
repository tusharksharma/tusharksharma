    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Smash Burgers + Fries","description":"490 cal / 51g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get a Bettergoods Keto bun with 2 x 3 oz 93/7 smashed patties, 2 Velveeta slices, an In-N-Out-style spread (mustard + mayo + ketchup + pickle juice + harissa + chopped pickles), and 1 full serving Rally's Famous Fries with extra sauce for dipping. Kids get a Marketside Brioche Slider Roll with 1 x 3 oz 80/20 smashed patty, 1 Velveeta slice, a bottled secret sauce, and a 1/2 serving of Rally's fries with ketchup. Same griddle timing, same salt-before-smash technique — the split is at the plate, not at the cook.","image":"https://thesplitplate.com/images/smash-burger-split-plate/hero-split-adult-kid-plates-polished.webp","totalTime":"PT30M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeIngredient":["6 Velveeta Original slices (4 for adult doubles, 2 for kid singles)","3 servings Rally's Famous Fries (2 for adults, 1 split across 2 kids)","Kosher salt (for the patties)","Cooking spray or beef tallow for bun toast","12 oz 93/7 ground beef (4 x 3 oz patties, 2 patties per adult plate)","2 Bettergoods Keto Friendly Hamburger Buns","In-N-Out-style spread (~4 tbsp total, 2 tbsp per adult plate)","  · 1 tbsp yellow mustard","  · 1 tbsp light mayo (Chosen Foods or Kraft Light)","  · 1 tbsp ketchup","  · 1 tbsp pickle juice","  · 1 tsp harissa (Shuug, NY Shuk, or any) — the twist","  · Chopped dill pickles to taste","6 oz 80/20 ground beef (2 x 3 oz patties, 1 patty per kid plate)","2 Marketside Brioche Slider Rolls","Bottled secret/special sauce (Heinz, TJ's, or similar) — for the burger","Ketchup — for the fries"],"recipeInstructions":[{"@type":"HowToStep","name":"Sauce First","text":"In a small bowl mix 1 tbsp mustard + 1 tbsp light mayo + 1 tbsp ketchup + 1 tbsp pickle juice + 1 tsp harissa + chopped pickles to taste. Set aside. Makes ~4 tbsp = 2 tbsp per adult plate (1 tbsp on burger, 1 tbsp for fry dip).","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-01-burger-sauce-base.webp"},{"@type":"HowToStep","name":"Fries","text":"Rally's Famous Fries into the air fryer at 400°F for 15 min. Start these BEFORE the burgers — they finish within 2 min of the burgers.","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-04-air-fryer-fries-polished.webp"},{"@type":"HowToStep","name":"Portion","text":"12 oz 93/7 beef into 4 x 3 oz balls for adults. 6 oz 80/20 beef into 2 x 3 oz balls for kids. Loose balls — don't compress.","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-03-portion-patties.webp"},{"@type":"HowToStep","name":"Griddle Hot","text":"Cast iron or flat-top on medium-high 4-5 min. Test: water droplet skitters + evaporates in 2 sec."},{"@type":"HowToStep","name":"Salt + Smash","text":"Beef balls onto the hot griddle — adult 93/7 on one side, kid 80/20 on the other. Pinch of salt on each within 5 seconds. Smash flat with a spatula + parchment to ~1/4-inch thick. Lacy edges = flavor.","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-05-patties-on-griddle.webp"},{"@type":"HowToStep","name":"Mustard Flip","text":"2-3 min undisturbed for the crust. Small blob of mustard on the raw top of each patty. Flip. 90 sec on the second side.","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-07-mustard-flip.webp"},{"@type":"HowToStep","name":"Cheese","text":"Velveeta slice on each patty immediately after the flip. Cover with a metal bowl or the pan lid for 30 sec to trap steam + melt fast.","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-08-cheese-melt-polished.webp"},{"@type":"HowToStep","name":"Toast Buns","text":"Keto buns + brioche sliders cut-side down on the griddle in the beef fat, 30-45 sec until golden.","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-09-toast-buns.webp"},{"@type":"HowToStep","name":"Adult Build","text":"Toasted keto bun bottom + 1 tbsp spread + 2 stacked 93/7 patties (each with Velveeta) + optional pickle chips + toasted keto bun top. Plate with 1 serving Rally's fries + 1 tbsp extra spread on the side for fry dipping.","image":"https://thesplitplate.com/images/smash-burger-split-plate/step-10-assemble-burger-polished.webp"},{"@type":"HowToStep","name":"Eat Immediately","text":"Smash burgers lose their crust fast when they sit. Bite through the sauce → cheese → double patty → keto bun in one motion."},{"@type":"HowToStep","name":"Kid Build","text":"Toasted brioche slider bottom + squeeze of bottled sauce + 1 x 3 oz 80/20 patty with Velveeta + toasted brioche top. Plate with 1/2 serving Rally's fries + a small puddle of ketchup for dipping."},{"@type":"HowToStep","name":"Serve","text":"Kids often eat the burger first + graze the fries. Bottled sauce is the 'safe' option — if kid asks about the adult spread, offer the bottled one as an alternative."}],"keywords":"beef, smash-burger, burger-night, split-cook, weeknight, high-protein, griddle, in-n-out-style, kid-approved, medium-carb"}</script>

    <noscript><h1>High-Protein Smash Burgers + Fries — The Split Plate</h1><p>490 cal / 51g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get a Bettergoods Keto bun with 2 x 3 oz 93/7 smashed patties, 2 Velveeta slices, an In-N-Out-style spread (mustard + mayo + ketchup + pickle juice + harissa + chopped pickles), and 1 full serving Rally's Famous Fries with extra sauce for dipping. Kids get a Marketside Brioche Slider Roll with 1 x 3 oz 80/20 smashed patty, 1 Velveeta slice, a bottled secret sauce, and a 1/2 serving of Rally's fries with ketchup. Same griddle timing, same salt-before-smash technique — the split is at the plate, not at the cook.</p></noscript>
