    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken Pot Pie","description":"520 cal / 30g protein per adult serving. 6 servings of filling (feeds 2 adults full + 2 kids half + leaves 2 servings reserved for next meal prep). Built around Kirkland chipotle-seasoned cooked chicken (18 oz) so the recipe is mostly vegetables + sauce + puff pastry — no raw-chicken prep. Mushrooms + carrots sweated in avocado-oil spray, flour roux cooked 1 min, vermouth deglaze, 3 cups Kirkland bone broth boiled to thicken, chicken + asparagus folded in. 4 oven-safe bowls filled, puff pastry top + egg wash, 425°F × 20 min until golden. Save the remaining filling + a second sheet of puff pastry for the next batch (meal-prep economy). Adult: 1 full bowl. Kid: 1/2 serving — rest first so the filling cools enough.","image":"https://thesplitplate.com/images/chicken-pot-pie/hero-family-pot-pie-batch-polished.webp","totalTime":"PT50M","recipeYield":"6 servings","nutrition":{"@type":"NutritionInformation","calories":"520 calories","proteinContent":"30g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["18 oz Kirkland chipotle-seasoned cooked chicken, chopped","4 oz mushrooms, sliced","4 oz carrots, chopped small","4 oz asparagus, cut into 1-inch pieces","1 oz (~2 tbsp) all-purpose flour","1/4 cup Martini & Rossi Extra Dry Vermouth","3 cups Kirkland Organic Chicken Bone Broth","4-5 pinches kosher salt","1 sheet Pepperidge Farm puff pastry (~250g)","1/2 beaten egg (for wash)","~1 tbsp Chosen Foods avocado oil spray"],"recipeInstructions":[{"@type":"HowToStep","name":"Preheat","text":"Oven to 425°F."},{"@type":"HowToStep","name":"Prep","text":"Chop the chipotle chicken into 1/2-inch pieces. Chop carrots, mushrooms, and asparagus small."},{"@type":"HowToStep","name":"Mushrooms","text":"Spray a large skillet with avocado oil. Add mushrooms. Cook ~3 min, stirring."},{"@type":"HowToStep","name":"Carrots","text":"Add carrots + 2 pinches kosher salt. Cook ~3 min."},{"@type":"HowToStep","name":"Flour","text":"Sprinkle 1 oz flour over the veg. Stir 1 minute."},{"@type":"HowToStep","name":"Vermouth","text":"Off heat, pour 1/4 cup vermouth, stir to slurry the roux. Back on heat."},{"@type":"HowToStep","name":"Broth","text":"Add 3 cups bone broth. Boil ~2 min, stirring, until thickened."},{"@type":"HowToStep","name":"Chicken + Asparagus","text":"Fold in 18 oz chopped chicken + 4 oz asparagus. Simmer 3 min."},{"@type":"HowToStep","name":"Oil Bowls","text":"Spray oven-safe bowl interiors + RIMS with avocado oil."},{"@type":"HowToStep","name":"Fill","text":"Scoop filling into 4 bowls. Reserve remaining filling + 1 puff pastry sheet for next meal prep."},{"@type":"HowToStep","name":"Puff Pastry","text":"Roll the sheet lightly. Cut 4 tops. Drape over each bowl, press around the rim."},{"@type":"HowToStep","name":"Vent + Wash","text":"Cut a 1-inch slit in the center of each top. Brush with beaten egg."},{"@type":"HowToStep","name":"Bake","text":"425°F × 20 min until deep golden + puffed."},{"@type":"HowToStep","name":"Rest + Serve","text":"Adults get a full bowl. For kids, crack the pastry open, let steam off 5 min, scoop half the filling + half the pastry into a smaller bowl."}],"keywords":"chicken, pot-pie, casserole, family-batch, meal-prep, weeknight, high-protein, costco-shortcut, puff-pastry, kid-friendly"}</script>

    <noscript><h1>Chicken Pot Pie — The Split Plate</h1><p>520 cal / 30g protein per adult serving. 6 servings of filling (feeds 2 adults full + 2 kids half + leaves 2 servings reserved for next meal prep). Built around Kirkland chipotle-seasoned cooked chicken (18 oz) so the recipe is mostly vegetables + sauce + puff pastry — no raw-chicken prep. Mushrooms + carrots sweated in avocado-oil spray, flour roux cooked 1 min, vermouth deglaze, 3 cups Kirkland bone broth boiled to thicken, chicken + asparagus folded in. 4 oven-safe bowls filled, puff pastry top + egg wash, 425°F × 20 min until golden. Save the remaining filling + a second sheet of puff pastry for the next batch (meal-prep economy). Adult: 1 full bowl. Kid: 1/2 serving — rest first so the filling cools enough.</p></noscript>
