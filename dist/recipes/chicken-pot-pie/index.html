    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken Pot Pie","description":"520 cal / 30g protein per adult serving. 6 servings of filling (feeds 2 adults full + 2 kids half + leaves 2 servings reserved for next meal prep). Built around Kirkland chipotle-seasoned cooked chicken (18 oz) so the recipe is mostly vegetables + sauce + puff pastry — no raw-chicken prep. Mushrooms + carrots sweated in avocado-oil spray, flour roux cooked 1 min, vermouth deglaze, 3 cups Kirkland bone broth boiled to thicken, chicken + asparagus folded in. 4 oven-safe bowls filled, puff pastry top + egg wash, 425°F × 20 min until golden. Save the remaining filling + a second sheet of puff pastry for the next batch (meal-prep economy). Adult: 1 full bowl. Kid: 1/2 serving — rest first so the filling cools enough.","image":"https://thesplitplate.com/images/chicken-pot-pie/hero-family-pot-pie-batch-polished.webp","totalTime":"PT50M","recipeYield":"6","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["18 oz Kirkland chipotle-seasoned cooked chicken, chopped into 1/2-inch pieces","4 oz mushrooms, sliced or chopped","4 oz carrots, chopped small","4 oz asparagus, cut into 1-inch pieces","1 oz (~2 tbsp) all-purpose flour","1/4 cup Martini & Rossi Extra Dry Vermouth","3 cups Kirkland Organic Chicken Bone Broth","4-5 pinches kosher salt (chicken is already seasoned)","1 sheet Pepperidge Farm puff pastry (~250g, makes 4 tops)","1/2 beaten egg (for wash)","~1 tbsp Chosen Foods avocado oil spray","1 full pot pie bowl (~12 oz filling + 1 puff pastry top)","1/2 pot pie bowl (~6 oz filling + 1/2 puff pastry top)"],"recipeInstructions":[{"@type":"HowToStep","name":"Preheat","text":"Oven to 425°F. Spray a large skillet with avocado oil."},{"@type":"HowToStep","name":"Mushrooms","text":"Add mushrooms to the skillet. Cook ~3 min, stirring, until they release water and shrink.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-01-mushrooms-polished.webp"},{"@type":"HowToStep","name":"Carrots","text":"Add chopped carrots + 2 pinches kosher salt. Cook ~3 min more, stirring.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-02-carrots-polished.webp"},{"@type":"HowToStep","name":"Flour Roux","text":"Sprinkle 1 oz flour over the veg. Stir 1 minute (count to 60) to cook off the raw-flour taste.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-03-flour-polished.webp"},{"@type":"HowToStep","name":"Vermouth Deglaze","text":"Pull the pan off the heat. Pour 1/4 cup vermouth, stir to slurry the roux. Back on heat.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-04-vermouth-polished.webp"},{"@type":"HowToStep","name":"Broth","text":"Add 3 cups Kirkland bone broth. Bring to a boil, stirring, until the sauce thickens (~2 min).","image":"https://thesplitplate.com/images/chicken-pot-pie/step-05-bone-broth-polished.webp"},{"@type":"HowToStep","name":"Chicken + Asparagus","text":"Fold in 18 oz chopped chipotle chicken + 4 oz asparagus. Simmer 3 min — asparagus turns bright green, chicken heats through.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-06-chicken-asparagus-polished.webp"},{"@type":"HowToStep","name":"Oil The Bowl Rims","text":"Spray or brush 4 oven-safe bowl interiors AND rims with avocado oil so the pastry releases."},{"@type":"HowToStep","name":"Fill Bowls","text":"Scoop filling into 4 bowls (~12 oz each). Reserve remaining filling for next meal prep.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-07-fill-bowls-polished.webp"},{"@type":"HowToStep","name":"Puff Pastry","text":"Roll the sheet lightly. Cut 4 tops sized for your bowls. Drape each over a bowl; press gently around the rim.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-08-puff-pastry-polished.webp"},{"@type":"HowToStep","name":"Vent + Egg Wash","text":"Cut a 1-inch slit in the center of each top FIRST. Brush egg wash over the entire surface.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-09-egg-wash-polished.webp"},{"@type":"HowToStep","name":"Bake 425°f · 20 Min","text":"Until the pastry is deep golden + puffed. Tops crack slightly as they rise.","image":"https://thesplitplate.com/images/chicken-pot-pie/step-10-oven-425-polished.webp"},{"@type":"HowToStep","name":"Adult Portion","text":"1 full bowl. Pastry top intact. Crack with a spoon at the table — the spoon-through-the-crust moment is the viral payoff.","image":"https://thesplitplate.com/images/chicken-pot-pie/payoff-spoon-crack-polished.webp"},{"@type":"HowToStep","name":"Eat While Hot","text":"520 cal / 30g protein. The filling is rich; the pastry adds texture contrast. Adult plate is generous — pair with a side salad if you want vegetables on the side."},{"@type":"HowToStep","name":"Kid Portion","text":"Crack one full bowl's pastry top with a spoon. Let the steam off 5 min — filling holds 200°F+ longer than you expect. Scoop ~6 oz filling + half the pastry into a smaller kid bowl."},{"@type":"HowToStep","name":"Serve Warm","text":"260 cal / 15g protein. The pastry pieces are the kid hook — most kids eat the pastry first, then mine the filling."}],"keywords":"chicken, pot-pie, casserole, family-batch, meal-prep, weeknight, high-protein, costco-shortcut, puff-pastry, kid-friendly"}</script>

    <noscript><h1>Chicken Pot Pie — The Split Plate</h1><p>520 cal / 30g protein per adult serving. 6 servings of filling (feeds 2 adults full + 2 kids half + leaves 2 servings reserved for next meal prep). Built around Kirkland chipotle-seasoned cooked chicken (18 oz) so the recipe is mostly vegetables + sauce + puff pastry — no raw-chicken prep. Mushrooms + carrots sweated in avocado-oil spray, flour roux cooked 1 min, vermouth deglaze, 3 cups Kirkland bone broth boiled to thicken, chicken + asparagus folded in. 4 oven-safe bowls filled, puff pastry top + egg wash, 425°F × 20 min until golden. Save the remaining filling + a second sheet of puff pastry for the next batch (meal-prep economy). Adult: 1 full bowl. Kid: 1/2 serving — rest first so the filling cools enough.</p></noscript>
