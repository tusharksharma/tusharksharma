    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Outlaw BBQ Grilled Thighs + Smashed Potatoes","description":"~47g protein for ~540 calories. Boneless skinless thighs marinated in Dan-O's Outlaw Sweet & Tangy + chili crisp + light oil, grilled over medium-high until the edges char (not burn), then sliced for adults and diced for kids. Smashed potatoes from a Little Potato Co. tray — microwave 5 min, smash with jagged edges (NOT puréed), bake until deeply browned. Chili crisp sour cream sauce on the side for adults; plain Daisy Light for kids. Outdoor grill is ideal; cast iron grill pan or oven broiler with grill marks works.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/hero.webp","totalTime":"PT30M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["8 boneless skinless chicken thighs (~2 lbs / 32 oz)","2-3 tbsp Dan-O's Outlaw Sweet & Tangy BBQ seasoning","2 tbsp Lee Kum Kee Chiu Chow Style Chili Crisp Oil","1 tbsp light oil (avocado or vegetable)","1 tray (1 lb) Little Potato Co. A Little Savory Herb (with seasoning packet)","Oil spray","1/2 cup Daisy Light Sour Cream","2-3 tbsp Lee Kum Kee Chiu Chow Style Chili Crisp Oil","(Full Chili Crisp Sour Cream recipe →","2 tbsp plain Daisy Light Sour Cream (no chili crisp)"],"recipeInstructions":[{"@type":"HowToStep","name":"Marinate The Thighs","text":"Combine Dan-O's Outlaw + Lee Kum Kee Chili Crisp + light oil in a large bowl. Add chicken, toss to coat thoroughly. The color should be deeply orange-red. Refrigerate 30 min minimum, overnight ideal.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/step1-marinade.webp"},{"@type":"HowToStep","name":"Microwave The Potatoes","text":"Pierce the tray's vent (it's pre-vented). Microwave on high 5 min. The tray steams them through — no boiling required."},{"@type":"HowToStep","name":"Smash + Season","text":"Transfer potatoes to a parchment-lined sheet pan. Press each one ONCE with the base of a glass — leave jagged edges, do NOT purée. Spray with oil, sprinkle the seasoning packet (start with half, add more after baking if needed). Set aside."},{"@type":"HowToStep","name":"Preheat","text":"Grill to medium-high (~450°F). Oven to 425°F."},{"@type":"HowToStep","name":"Grill The Chicken","text":"Lay thighs out on the grates with space between. Close lid. 4-5 min per side, flip ONCE, char marks should be clear and dark. Internal temp 165°F when done.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/step2-grill.webp"},{"@type":"HowToStep","name":"Bake The Potatoes","text":"Pop the sheet pan in at 425°F for 20-25 min, until deeply browned and crispy at the edges. The fluffy interior + crispy exterior contrast is the goal.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/step4-potatoes.webp"},{"@type":"HowToStep","name":"Rest The Chicken","text":"Off the grill onto a cutting board. Rest 3-5 min so the juices redistribute. Slicing immediately = pale interior with juices on the board, not in the meat.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/step3-rested.webp"},{"@type":"HowToStep","name":"Build The Sauce","text":"Spoon Daisy Light Sour Cream into a small bowl. Add 2-3 tbsp Lee Kum Kee Chiu Chow Chili Crisp on top. Fold gently 3-4 times — STOP when you can still see orange streaks. Don't homogenize.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/step5-sauce.webp"},{"@type":"HowToStep","name":"Slice The Thighs","text":"2 thighs per adult, cut across the grain into 1/2-inch slices. Lay over the smashed potatoes in a wide bowl. The grill marks should be visible."},{"@type":"HowToStep","name":"Plate","text":"Wide bowl. Sliced thigh + crispy smashed potatoes. Chili crisp sour cream on the side OR drizzled with the orange streaks visible. DON'T dump and mix.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/hero.webp"},{"@type":"HowToStep","name":"Dice 1.5 Thighs","text":"Trim off the heaviest char (kids reject visible burn). Cut into 1/2-inch cubes. Pieces should look like chicken-nugget-adjacent, not adult dinner."},{"@type":"HowToStep","name":"Plate Into 3-compartment Tray","text":"Diced chicken in the largest compartment, smashed potatoes in the second, plain Daisy Light sour cream in the third (for dipping)."}],"keywords":"grill, outdoor, chicken, potatoes, tamarind, chili crisp, sauce-anchored, split-cook, weeknight"}</script>

    <noscript><h1>Outlaw BBQ Grilled Thighs + Smashed Potatoes — The Split Plate</h1><p>~47g protein for ~540 calories. Boneless skinless thighs marinated in Dan-O's Outlaw Sweet &amp; Tangy + chili crisp + light oil, grilled over medium-high until the edges char (not burn), then sliced for adults and diced for kids. Smashed potatoes from a Little Potato Co. tray — microwave 5 min, smash with jagged edges (NOT puréed), bake until deeply browned. Chili crisp sour cream sauce on the side for adults; plain Daisy Light for kids. Outdoor grill is ideal; cast iron grill pan or oven broiler with grill marks works.</p></noscript>
