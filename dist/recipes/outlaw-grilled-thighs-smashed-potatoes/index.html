    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Outlaw BBQ Grilled Thighs + Smashed Potatoes","description":"~47g protein for ~540 calories. Boneless skinless thighs marinated in Dan-O's Outlaw Sweet & Tangy + chili crisp + light oil, grilled over medium-high until the edges char (not burn), then sliced for adults and diced for kids. Smashed potatoes from a Little Potato Co. tray — microwave 5 min, smash with jagged edges (NOT puréed), bake until deeply browned. Chili crisp sour cream sauce on the side for adults; plain Daisy Light for kids. Outdoor grill is ideal; cast iron grill pan or oven broiler with grill marks works.","image":"https://thesplitplate.com/images/outlaw-grilled-thighs/hero.webp","totalTime":"PT30M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"540 calories","proteinContent":"47g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["8 boneless skinless chicken thighs (~2 lbs / 32 oz)","Dan-O's Outlaw Sweet & Tangy BBQ seasoning (2-3 tbsp)","Lee Kum Kee Chiu Chow Style Chili Crisp Oil (2 tbsp in marinade)","Light oil (1 tbsp, avocado or vegetable)","1 tray (1 lb) Little Potato Co. A Little Savory Herb (with seasoning packet)","Oil spray","Chili Crisp Sour Cream (1/2 cup Daisy Light + 2-3 tbsp chili crisp)","2 tbsp plain Daisy Light Sour Cream"],"recipeInstructions":[{"@type":"HowToStep","name":"Marinate","text":"Toss thighs with Dan-O's Outlaw + Lee Kum Kee Chili Crisp + light oil. Cover and refrigerate 30 min minimum, overnight ideal."},{"@type":"HowToStep","name":"Potatoes — Microwave + Smash","text":"Microwave Little Potato Co. tray 5 min. Smash on parchment-lined sheet pan with the base of a glass — leave jagged edges (NOT puréed). Oil spray + half the seasoning packet."},{"@type":"HowToStep","name":"Preheat Both","text":"Grill medium-high (~450°F). Oven 425°F."},{"@type":"HowToStep","name":"Grill","text":"Thighs on the grates, 4-5 min per side, flip ONCE. Internal 165°F. Strong char marks both sides."},{"@type":"HowToStep","name":"Bake Potatoes","text":"425°F for 20-25 min. Deeply browned + crispy edges + fluffy interior."},{"@type":"HowToStep","name":"Rest Chicken","text":"3-5 min on the cutting board. Don't slice too early."},{"@type":"HowToStep","name":"Build Sauce","text":"Daisy Light + Lee Kum Kee Chili Crisp, fold 3-4 times. Leave orange streaks visible."},{"@type":"HowToStep","name":"Split The Plate","text":"Adult bowl — 2 sliced thighs over smashed potatoes + chili crisp sour cream on side. Kid 3-compartment tray — 1.5 thighs diced (no char), potatoes, plain sour cream."}],"keywords":"grill, outdoor, chicken, potatoes, tamarind, chili crisp, sauce-anchored, split-cook, weeknight"}</script>

    <noscript><h1>Outlaw BBQ Grilled Thighs + Smashed Potatoes — The Split Plate</h1><p>~47g protein for ~540 calories. Boneless skinless thighs marinated in Dan-O's Outlaw Sweet &amp; Tangy + chili crisp + light oil, grilled over medium-high until the edges char (not burn), then sliced for adults and diced for kids. Smashed potatoes from a Little Potato Co. tray — microwave 5 min, smash with jagged edges (NOT puréed), bake until deeply browned. Chili crisp sour cream sauce on the side for adults; plain Daisy Light for kids. Outdoor grill is ideal; cast iron grill pan or oven broiler with grill marks works.</p></noscript>
