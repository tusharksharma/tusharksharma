    <noscript><h1>Fire-Grilled Chicken Thighs + Frozen Veggies — The Split Plate</h1><p>460 cal / 45g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get 2 grilled boneless skinless chicken thighs coated in a paprika + cumin + brown sugar + cayenne rub, plus 1 serving of skillet-crisped frozen vegetables (potato + green bean blend). Kids get 1 chopped thigh, 1/2 serving veggies, a piece of bread, and a dip they like (garlic mayo / Alfredo / secret sauce). Split at the plate — same rub, same grill, forks on portion + carb + sauce. Keep frozen veggies in your freezer at all times: no chopping, no waste, real weeknight leverage.</p></noscript>
