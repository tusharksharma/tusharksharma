    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Air Fryer Chicken Thighs + Cheesy Broccoli","description":"Boneless chicken thighs seasoned two ways (Blackened Bloody Mary for adults, Original for kids) and cooked alongside frozen cheesy broccoli — all in the air fryer. Adult plate ~380 cal / 42g protein. Kid plate: chopped mild thigh + broccoli + a small roll.","image":"https://thesplitplate.com/images/air-fryer-chicken-thighs-cheesy-broccoli/hero-split-adult-kid-plates-polished.webp","totalTime":"PT25M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["6 chicken thighs (boneless, skinless — 4 adult, 2 kid)","Avocado oil spray","12 oz frozen broccoli florets (do not thaw)","Avocado oil spray","Salt","Dan-O's Cheesoning (for finishing)","Dan-O's Outlaw Blackened Bloody Mary","Extra Cheesoning","Dan-O's Original + salt (mild)","1 small dinner roll OR preferred bread per kid"],"recipeInstructions":[{"@type":"HowToStep","name":"Divide + Dry","text":"Pat all 6 thighs completely dry. Divide 4 thighs into the adult bowl and 2 into the kid bowl.","image":"https://thesplitplate.com/images/air-fryer-chicken-thighs-cheesy-broccoli/step-01-divide-dry-thighs.webp"},{"@type":"HowToStep","name":"Season Split","text":"Season the 2 kid thighs with Dan-O's Original (mild). Season the 4 adult thighs with Outlaw Blackened Bloody Mary (bold). Light avocado oil spray on both portions, toss.","image":"https://thesplitplate.com/images/air-fryer-chicken-thighs-cheesy-broccoli/step-02-season-two-ways-polished.webp"},{"@type":"HowToStep","name":"Rest","text":"Cover both bowls and refrigerate a couple of hours so the seasoning grabs.","image":"https://thesplitplate.com/images/air-fryer-chicken-thighs-cheesy-broccoli/step-03-rest-chicken.webp"},{"@type":"HowToStep","name":"Prep Broccoli","text":"Toss 12 oz frozen b
