    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Philly Cheesesteak Sliders","description":"470 cal / 40g protein per adult plate (3 Sola sliders), 4 servings (2 adults + 2 kids). Adults get Sola rolls (60 cal / high fiber) + smoky chipotle crema + Sargento thin provolone + fat-free mozzarella + Tari hot sauce. Kids get regular slider rolls + regular mayo + provolone + Primal Kitchen secret sauce. The filling is shared: 24 oz Gary's QuickSteak beef with the included Creole seasoning + 12 oz peppers/onions with taco seasoning + 1/3 cup bone broth to bring it together. Split at bread + cheese + sauce — same tray, two bakes.","image":"https://thesplitplate.com/images/high-protein-philly-cheesesteak-sliders/final-plated-sliders-polished.webp","totalTime":"PT40M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"470 calories","proteinContent":"40g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["6 pucks / 24 oz Gary's QuickSteak beef (with included Creole seasoning)","12 oz peppers + onions (fresh or frozen)","Taco seasoning, to taste (~1 tsp)","1/3 cup bone broth","6 Sola rolls (~60 cal / high fiber)","6 regular slider rolls","1/2 serving per adult Smoky Chipotle Crema (cross-recipe /cookbook/smoky-chipotle-crema)","1/2 serving per kid regular mayo","18 slices Sargento thin provolone (6 adult bottom / 6 kid bottom / 6 kid top)","3 oz fat-free mozzarella (adult top)","1/2 serving per adult Tari hot sauce (or any creamy hot sauce)","1/2 serving per kid Primal Kitchen secret sauce","Avocado oil spray (roll tops)"],"recipeInstructions":[{"@type":"HowToStep","name":"Brown Beef","text":"HOT pan on medium-high. 6 Gary's QuickSteak pucks from frozen. 3-4 min per side + Creole seasoning as they soften."},{"@type":"HowToStep","name":"Chop + Set Aside","text":"Break pucks into thin cheesesteak strips with the spatula. Set aside once fully browned."},{"@type":"HowToStep","name":"Peppers + Onions","text":"Same pan. 12 oz peppers/onions + taco seasoning. 5-6 min softened + browning."},{"@type":"HowToStep","name":"Bone Broth Deglaze","text":"1/3 cup bone broth. Reduce ~2 min to a light sauce."},{"@type":"HowToStep","name":"Combine Filling","text":"Return beef to the pan. Stir shared filling together."},{"@type":"HowToStep","name":"Build Tray","text":"Sola rolls on adult side, regular slider rolls on kid side, bottoms down."},{"@type":"HowToStep","name":"Bottom Sauces","text":"Chipotle crema on adult side, regular mayo on kid side."},{"@type":"HowToStep","name":"Provolone","text":"6 slices thin provolone across each side (adult + kid)."},{"@type":"HowToStep","name":"Filling Layer","text":"Pile beef/pepper/onion filling across both sides of the tray."},{"@type":"HowToStep","name":"Adult Top Cheese","text":"3 oz fat-free mozzarella across the adult side only."},{"@type":"HowToStep","name":"Kid Top Cheese","text":"Another 6 slices thin provolone across the kid side (double-cheese sandwich)."},{"@type":"HowToStep","name":"Top Sauces","text":"Tari hot sauce on adult side. Primal Kitchen secret sauce on kid side."},{"@type":"HowToStep","name":"Cap + Spray + Cover","text":"Roll tops on. Light avocado oil spray. Foil the tray tight."},{"@type":"HowToStep","name":"Bake","text":"350°F × 20 min covered. Pull foil for the last 2 min if you want a light top-brown."},{"@type":"HowToStep","name":"Cut + Plate","text":"Cut into sliders. Adult plate = 3 Sola sliders. Kid plate = 3 regular sliders."}],"keywords":"beef, sliders, cheesesteak, split-cook, weeknight, high-protein, kid-approved, one-pan, sheet-pan, medium-carb"}</script>

    <noscript><h1>High-Protein Philly Cheesesteak Sliders — The Split Plate</h1><p>470 cal / 40g protein per adult plate (3 Sola sliders), 4 servings (2 adults + 2 kids). Adults get Sola rolls (60 cal / high fiber) + smoky chipotle crema + Sargento thin provolone + fat-free mozzarella + Tari hot sauce. Kids get regular slider rolls + regular mayo + provolone + Primal Kitchen secret sauce. The filling is shared: 24 oz Gary's QuickSteak beef with the included Creole seasoning + 12 oz peppers/onions with taco seasoning + 1/3 cup bone broth to bring it together. Split at bread + cheese + sauce — same tray, two bakes.</p></noscript>
