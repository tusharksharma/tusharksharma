ult Filling + Mozz","text":"Pile the beef/pepper/onion filling on the adult side. Top with 3 oz fat-free mozzarella.","image":"https://thesplitplate.com/images/high-protein-philly-cheesesteak-sliders/step-09-fat-free-mozz-adult.webp"},{"@type":"HowToStep","name":"Adult Top Sauce","text":"Drizzle Tari hot sauce (or extra chipotle crema) across the adult filling. Cap with the Sola roll tops.","image":"https://thesplitplate.com/images/high-protein-philly-cheesesteak-sliders/step-10-top-sauces.webp"},{"@type":"HowToStep","name":"Kid Bottom","text":"Spread regular mayo across the 6 slider roll bottoms.","image":"https://thesplitplate.com/images/high-protein-philly-cheesesteak-sliders/step-06-bottom-sauces-polished.webp"},{"@type":"HowToStep","name":"Kid Provolone Bottom","text":"Layer 6 slices thin provolone across the kid roll bottoms.","image":"https://thesplitplate.com/images/high-protein-philly-cheesesteak-sliders/step-07-provolone-layer.webp"},{"@type":"HowToStep","name":"Kid Filling + Top Provolone","text":"Pile the beef/pepper/onion filling on the kid side. Top with another 6 slices thin provolone (double-cheese sandwich).","image":"https://thesplitplate.com/images/high-protein-philly-cheesesteak-sliders/step-08-beef-filling-layer-polished.webp"},{"@type":"HowToStep","name":"Kid Top Sauce","text":"Drizzle Primal Kitchen secret sauce across the kid filling. Cap with the regular roll tops.","image":"https://thesplitplate.com/images/high-protein-philly-cheesesteak-sliders/step-10-top-sauces.webp"}],"keywords":"beef, sliders, cheesesteak, split-cook, weeknight, high-protein, kid-approved, one-pan, sheet-pan, medium-carb"}</script>

    <noscript><h1>High-Protein Philly Cheesesteak Sliders — The Split Plate</h1><p>470 cal / 40g protein per adult plate (3 Sola sliders), 4 servings (2 adults + 2 kids). Adults get Sola rolls (60 cal / high fiber) + smoky chipotle crema + Sargento thin provolone + fat-free mozzarella + Tari hot sauce. Kids get regular slider rolls + regular mayo + provolone + Primal Kitchen secret sauce. The filling is shared: 24 oz Gary's QuickSteak beef with the included Creole seasoning + 12 oz peppers/onions with taco seasoning + 1/3 cup bone broth to bring it together. Split at bread + cheese + sauce — same tray, two bakes.</p></noscript>
