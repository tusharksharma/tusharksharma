    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Emergency Kebab Night","description":"Three frozen products + one fresh element. Air fryer the kebabs for char (5 min finish AFTER the heat-through step), microwave the rumali roti, slice the red onion + cucumber, splash green chutney. Adult plate: chicken kebab wrapped in rumali + onion-chutney salad. Kid divided tray: beef kebab + plain rumali + cucumber sticks. This is the formula — Tier 2 protein + Tier 3 carb + Tier 4 freshness — applied in 20 minutes.","image":"https://thesplitplate.com/images/emergency-kebab-night/hero.webp","totalTime":"PT20M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"460 calories","proteinContent":"32g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["1 box Colonel Kababz Chicken Seekh Kabab (11 oz) [adult]","1 box Colonel Kababz Beef Seekh Kabab (11 oz) [kid]","1 pack Vadilal Rumali Roti (6 pieces) — or Haldiram's Phulka Roti","1 medium red onion, sliced paper-thin [adult]","1 medium cucumber","2-3 tbsp store-bought green chutney [adult]","Salt","Lime wedge (optional, adult)"],"recipeInstructions":[{"@type":"HowToStep","name":"Air Fry Kebabs","text":"Both boxes together, 400°F, 12 min. Shake at 6 min. The last 5 min gets the char — don't pull early. Char is non-negotiable."},{"@type":"HowToStep","name":"Slice + Salt The Onion","text":"Paper-thin red onion. Salt it. 5 min rest while kebabs cook — kills the harsh raw bite."},{"@type":"HowToStep","name":"Cucumber","text":"Sticks for kids, thin slices for the adult salad."},{"@type":"HowToStep","name":"Adult Salad","text":"Combine onion + cucumber slices + 1 tbsp green chutney + pinch of salt. Toss."},{"@type":"HowToStep","name":"Warm Rumali","text":"30 sec in microwave, wrapped in damp paper towel. Don't dry out."},{"@type":"HowToStep","name":"Wrap One Adult Kebab in Rumali","text":"This is the plate-interaction move. Don't skip."},{"@type":"HowToStep","name":"Plate","text":"Adult — wrapped chicken seekh + 1-2 more unwrapped + onion-chutney salad ramekin + optional lime. Kid — bento tray with beef seekh + plain folded rumali + cucumber sticks."}],"keywords":"kebab, seekh, indian, frozen, emergency-dinner, 20-min, air-fryer, no-cook, split-cook, rumali, halal"}</script>

    <noscript><h1>Split Plate Emergency Kebab Night — The Split Plate</h1><p>Three frozen products + one fresh element. Air fryer the kebabs for char (5 min finish AFTER the heat-through step), microwave the rumali roti, slice the red onion + cucumber, splash green chutney. Adult plate: chicken kebab wrapped in rumali + onion-chutney salad. Kid divided tray: beef kebab + plain rumali + cucumber sticks. This is the formula — Tier 2 protein + Tier 3 carb + Tier 4 freshness — applied in 20 minutes.</p></noscript>
