    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split Plate Emergency Kebab Night","description":"Three frozen products + one fresh element. Air fryer the kebabs for char (5 min finish AFTER the heat-through step), microwave the rumali roti, slice the red onion + cucumber, splash green chutney. Adult plate: chicken kebab wrapped in rumali + onion-chutney salad. Kid divided tray: beef kebab + plain rumali + cucumber sticks. This is the formula — Tier 2 protein + Tier 3 carb + Tier 4 freshness — applied in 20 minutes.","image":"https://thesplitplate.com/images/emergency-kebab-night/split-plate-cover-polished.webp","totalTime":"PT20M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Middle Eastern","recipeIngredient":["1 box Colonel Kababz Chicken Seekh Kabab (8 large, 11 oz frozen) [adult]","1 box Colonel Kababz Beef Seekh Kabab (8 large, 11 oz frozen) [kid]","1 pack Vadilal Quick Treat Rumali Roti (6 pieces, 240g frozen) — OR substitute Haldiram's Minute Khana Phulka Roti","1 medium red onion, sliced paper-thin","1 medium cucumber","Store-bought green chutney (cilantro-mint based) — any brand","Pinch of salt","2-3 tbsp green chutney (drizzle on salad + dip)","Cucumber slices (thin half-moons)","Fresh lime wedge (optional)","Cucumber sticks (4-5 per kid)","(Optional) tiny ramekin of green chutney as a dip if they ask"],"recipeInstructions":[{"@type":"HowToStep","name":"Air Fry Kebabs","text":"Both boxes (chicken + beef) into the air fryer together, 400°F for 12 min total. Shake basket at 6 min. THE LAST 5 MIN gets you the char that matters — don't pull early.","image":"https://thesplitplate.com/images/emergency-kebab-night/mise-en-place.webp"},{"@type":"HowToStep","name":"Slice Onion + Salt","text":"Paper-thin half-moons of red onion. Sprinkle a pinch of salt. Let sit 5 min — salt mellows the raw bite. (This is the Tier 4 move that punches above its weight.)"},{"@type":"HowToStep","text":"CUCUMBER STICKS (kid) + CUCUMBER SLICES (adult): Slice cucumber into sticks for the kid tray. Thin half-moons for the adult salad."},{"@type":"HowToStep","name":"Warm Rumali","text":"Wrap in damp paper towel. Microwave 30 sec total. Don't over-warm or it dries out."},{"@type":"HowToStep","name":"Adult Salad","text":"Combine salted red onion + cucumber slices + 1 tbsp green chutney + tiny pinch more salt. Toss. This is the freshness anchor — without it, the plate is one-dimensional."},{"@type":"HowToStep","name":"Wrap One Kebab","text":"Take one chicken seekh, place it on a warm rumali, fold the rumali around it. THIS is the plate-interaction move that elevates the visual."},{"@type":"HowToStep","name":"Plate","text":"Wrapped kebab + 1-2 unwrapped chicken seekh on the side + folded rumali underneath + small ramekin of onion-cucumber-chutney salad. Optional: lime wedge.","image":"https://thesplitplate.com/images/emergency-kebab-night/adult-plate.webp"},{"@type":"HowToStep","name":"Plate","text":"Bento tray. 1 beef seekh + 1 folded rumali (or one rolled around a half-kebab if they like burritos) + 4-5 cucumber sticks in another compartment. Done.","image":"https://thesplitplate.com/images/emergency-kebab-night/kid-tray.webp"}],"keywords":"kebab, seekh, indian, frozen, emergency-dinner, 20-min, air-fryer, no-cook, split-cook, rumali, halal"}</script>

    <noscript><h1>Split Plate Emergency Kebab Night — The Split Plate</h1><p>Three frozen products + one fresh element. Air fryer the kebabs for char (5 min finish AFTER the heat-through step), microwave the rumali roti, slice the red onion + cucumber, splash green chutney. Adult plate: chicken kebab wrapped in rumali + onion-chutney salad. Kid divided tray: beef kebab + plain rumali + cucumber sticks. This is the formula — Tier 2 protein + Tier 3 carb + Tier 4 freshness — applied in 20 minutes.</p></noscript>
