    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Creamy Beef Bacon Pasta","description":"Crispy beef bacon shared between two pasta pots. Adult Carbe Diem penne gets a cottage-cheese Alfredo blend and parsley; kid regular penne gets plain Alfredo. Follow the original six-portion batch below. Nutrition is under review pending package labels and measured adult/kid allocations.","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/split-plate-side-by-side-polished.webp","totalTime":"PT30M","recipeYield":"6","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Italian","recipeIngredient":["2 packs Godshall's Beef Bacon (20 slices total, 10 oz × 2)","1 container (16 oz) Daisy Low-Fat Cottage Cheese","4 wedges Laughing Cow Light Spreadable Cheese","3 servings (~3/4 cup) Rao's Homemade Alfredo (for the blend)","1/2 cup Kirkland Organic Chicken Sipping Bone Broth (half a portion)","4 servings dry Carbe Diem Penne (~8 oz dry — adult pot)","~70% of the rendered bacon crumble (kid pot gets the other ~30%)","1-2 tbsp chopped fresh parsley","Cracked black pepper","2 servings dry regular wheat penne (Barilla classic or any familiar penne, ~4 oz dry — kid pot)","~3/4 cup Rao's Homemade Alfredo (straight from the jar — NOT the blended sauce)","~30% of the rendered bacon crumble (the rest is for adults)","(NO blended sauce, NO parsley)"],"recipeInstructions":[{"@type":"HowToStep","name":"Prep","text":"Dice 20 slices Godshall's Beef Bacon (stack + cross-cut into 1/2-inch pieces). Set two pots of salted water to boil. Chop a small handful of parsley for the adult plate.","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/mise-pasta-bacon-brands.webp"},{"@type":"HowToStep","name":"Render Bacon","text":"Diced bacon into a wide skillet over medium-high heat. 6-8 min until crisp. Pour into a strainer set over a bowl. Discard most of the rendered fat (reserve 1 tbsp in the pan if you want).","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/step-07-beef-bacon-crumble.webp"},{"@type":"HowToStep","text":"BLEND THE ADULT SAUCE (cold/warm, NOT hot): Food processor — full tub Daisy cottage cheese + 4 Laughing Cow Light wedges + 3 servings (~3/4 cup) Rao's Alfredo + 1/2 cup Kirkland bone broth. Blend 60 sec until completely smooth.","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/mise-sauce-brands.webp"},{"@type":"HowToStep","name":"Cook Two Pastas Simultaneously","text":"Pot 1: 4 servings dry Carbe Diem Penne (adult, ~8 oz dry). Pot 2: 2 servings dry regular wheat penne (kid, ~4 oz dry). Both 9-10 min al dente.","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/two-pans-cooking.webp"},{"@type":"HowToStep","name":"Adult Build","text":"Drained Carbe Diem back into its pot OFF heat. Pour in the blended sauce. Return to LOW heat. Stir 60 sec — should coat the back of a spoon, not slide off. Fold in ~70% of the crispy bacon (save ~30% for the kid pot).","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/step-08-sauce-the-pasta.webp"},{"@type":"HowToStep","name":"Plate Adult","text":"Wide bowl. Generous scoop. Sprinkle chopped parsley + cracked black pepper.","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/split-plate-side-by-side.webp"},{"@type":"HowToStep","name":"Kid Pot","text":"Drained regular penne back into its pot OFF heat. Stir in ~3/4 cup Rao's Alfredo straight from the jar. Fold in the kid's share of the bacon (~30% of the rendered crumble — leave the pieces a touch larger if the kid prefers visible bacon)."},{"@type":"HowToStep","name":"Plate Kid","text":"Smaller bowl or plate. Penne + Alfredo + visible bacon chunks. No parsley, no blended sauce."}],"keywords":"pasta, beef-bacon, alfredo, split-cook, protein-pasta, meal-prep, weeknight, comfort, pork-free"}</script>
