    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Creamy Beef Bacon Pasta","description":"350 cal / 27.8g protein / 14.9g fat / 42.7g carbs per adult serving, 6 servings batch. 20 slices Godshall's Beef Bacon diced and rendered crispy, fat drained — bacon goes into BOTH plates (kids love bacon; the split-cook lever is the sauce, not the protein). Adult sauce blends 1 tub Daisy cottage cheese + 4 Laughing Cow Light wedges + 3 servings Rao's Alfredo + 1/2 portion Kirkland chicken bone broth into a creamy base; adults eat it over Carbe Diem Penne with bacon folded in and fresh parsley on top. Kids eat regular wheat penne tossed with plain Rao's Alfredo straight from the jar + a share of the bacon — no blended sauce, no parsley. Two pots cook simultaneously. Reheats clean for 3-4 days with a splash of bone broth.","image":"https://thesplitplate.com/images/creamy-beef-bacon-pasta/split-plate-side-by-side-polished.webp","totalTime":"PT30M","recipeYield":"6 servings","nutrition":{"@type":"NutritionInformation","calories":"350 calories","proteinContent":"28g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["2 packs Godshall's Beef Bacon (10 oz × 2 = 20 slices)","4 servings dry Carbe Diem Penne (~8 oz) [adult]","1 container (16 oz) Daisy Low-Fat Cottage Cheese [adult sauce]","4 wedges Laughing Cow Light Spreadable Cheese [adult sauce]","3 servings Rao's Homemade Alfredo (~3/4 cup) [adult sauce blend]","1/2 cup Kirkland Organic Chicken Sipping Bone Broth [adult sauce loosener]","Fresh parsley (small handful) [adult finish]","Cracked black pepper [adult finish]","2 servings dry regular wheat penne (Barilla classic or any familiar penne) [kid]","~3/4 cup Rao's Homemade Alfredo (straight from the jar, not the blend) [kid sauce]","(Bacon: ~30% of the cooked Godshall's crumble — folded into the kid pot from the shared bacon cook) [kid]"],"recipeInstructions":[{"@type":"HowToStep","name":"Mise en Place","text":"2 packs Godshall's Beef Bacon out, Carbe Diem Penne measured (4 servings), regular wheat penne measured (2 servings), Daisy + Laughing Cow + Rao's + bone broth ready, parsley chopped. Two pasta pots filled and salted."},{"@type":"HowToStep","name":"Dice Bacon","text":"Stack 20 slices + cross-cut into 1/2-inch pieces. Goes faster than slicing one at a time."},{"@type":"HowToStep","name":"Render Bacon Crispy","text":"Diced bacon into a wide skillet, medium-high. 6-8 min until crisp. Pour into a strainer over a bowl. Discard the bulk of the fat (reserve 1 tbsp if you want a flavor lift)."},{"@type":"HowToStep","text":"BLEND THE ADULT SAUCE (cold/warm, NOT hot): Food processor — full tub Daisy cottage cheese + 4 Laughing Cow Light wedges + 3 servings Rao's Alfredo + 1/2 cup Kirkland bone broth. Blend 60 sec until completely smooth."},{"@type":"HowToStep","name":"Cook Both Pastas","text":"Carbe Diem in pot 1 (adult), regular wheat penne in pot 2 (kid). Both 9-10 min al dente. Drain both."},{"@type":"HowToStep","name":"Adult Build","text":"Drained Carbe Diem back into its pot OFF heat. Pour in the blended sauce. LOW heat 60 sec. Fold in ~70% of the crispy bacon (save the rest for the kid pot)."},{"@type":"HowToStep","name":"Kid Build","text":"Drained regular penne into its pot OFF heat. Stir in ~3/4 cup Rao's Alfredo straight from the jar. Fold in the remaining ~30% of the bacon. No blend, no parsley."},{"@type":"HowToStep","name":"Plate","text":"Adult — wide bowl, generous scoop, chopped parsley + cracked pepper. Kid — smaller bowl, just penne + Alfredo, nothing visible-different."}],"keywords":"pasta, beef-bacon, alfredo, split-cook, protein-pasta, meal-prep, weeknight, comfort, pork-free"}</script>

    <noscript><h1>Creamy Beef Bacon Pasta — The Split Plate</h1><p>350 cal / 27.8g protein / 14.9g fat / 42.7g carbs per adult serving, 6 servings batch. 20 slices Godshall's Beef Bacon diced and rendered crispy, fat drained — bacon goes into BOTH plates (kids love bacon; the split-cook lever is the sauce, not the protein). Adult sauce blends 1 tub Daisy cottage cheese + 4 Laughing Cow Light wedges + 3 servings Rao's Alfredo + 1/2 portion Kirkland chicken bone broth into a creamy base; adults eat it over Carbe Diem Penne with bacon folded in and fresh parsley on top. Kids eat regular wheat penne tossed with plain Rao's Alfredo straight from the jar + a share of the bacon — no blended sauce, no parsley. Two pots cook simultaneously. Reheats clean for 3-4 days with a splash of bone broth.</p></noscript>
