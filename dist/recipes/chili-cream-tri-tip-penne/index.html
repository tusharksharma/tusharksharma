pinach to ice water to stop the cooking. Drain thoroughly and squeeze out excess water — residual water thins the sauce.","image":"https://thesplitplate.com/images/split-protein-creamy-spinach-pasta/step-02-ice-bath-spinach.webp"},{"@type":"HowToStep","name":"Add to Blender","text":"Add three low-fat cottage-cheese cups, 1/2 cup ultra-filtered milk, and 1/2 cup bone broth to a blender. Add the cooled, well-drained spinach.","image":"https://thesplitplate.com/images/split-protein-creamy-spinach-pasta/step-03-add-cottage-cheese.webp"},{"@type":"HowToStep","name":"Blend Smooth","text":"Blend until completely smooth and pale green.","image":"https://thesplitplate.com/images/split-protein-creamy-spinach-pasta/step-05-blend-green-sauce-polished.webp"},{"@type":"HowToStep","name":"Portion Bulk Sauce","text":"Set aside enough sauce to lightly coat four pasta servings. Portion the remainder into family-dinner containers — creator reports the batch covers ~6 family dinners in total.","image":"https://thesplitplate.com/images/split-protein-creamy-spinach-pasta/step-06-portion-bulk-sauce-polished.webp"},{"@type":"HowToStep","name":"Cook + Toss Pasta","text":"Cook four package servings of regular pasta per the package. Drain, return to the pot, and toss with only enough green sauce to coat the pasta.","image":"https://thesplitplate.com/images/split-protein-creamy-spinach-pasta/step-07-toss-pasta.webp"},{"@type":"HowToStep","name":"Season","text":"Season tri-tip on all sides with preferred steak seasoning."},{"@type":"HowToStep","name":"Sear","text":"Heat a large skillet with a small amount of ghee, then sear the tri-tip until deeply browned on all sides."},{"@type":"HowToStep","name":"Rest","text":"Cook to preferred doneness (creator: medium-rare, ~130°F for meal-prep reheat headroom — see USDA guidance in executionRules for whole-cut minimum). Transfer to a board and rest at least 5 minutes."},{"@type":"HowToStep","name":"Slice + Cube","text":"Slice thin against the grain, then     <noscript><h1>Split-Protein Creamy Spinach Pasta — The Split Plate</h1><p>One-cook, two-protein dinner for two adults and two kids. Everyone gets regular pasta coated in a batch-prepped spinach + cottage-cheese green sauce. Adults get seared tri-tip; kids get bite-sized beef meatballs with a little Alfredo. The green sauce batch is portioned for six future family dinners, and 1 lb of tri-tip creates four adult portions (two now, two for the next adult meal). Adult plate is a rounded creator estimate at ~460 cal / 38g protein; kid macros are intentionally hidden until each current pasta / meatball / Alfredo / cottage-cheese / milk / broth label is checked.</p></noscript>
