    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Split-Protein Creamy Spinach Pasta","description":"One-cook, two-protein dinner for two adults and two kids. Everyone gets regular pasta coated in a batch-prepped spinach + cottage-cheese green sauce. Adults get seared tri-tip; kids get bite-sized beef meatballs with a little Alfredo. The green sauce batch is portioned for six future family dinners, and 1 lb of tri-tip creates four adult portions (two now, two for the next adult meal). Adult plate is a rounded creator estimate at ~460 cal / 38g protein; kid macros are intentionally hidden until each current pasta / meatball / Alfredo / cottage-cheese / milk / broth label is checked.","image":"https://thesplitplate.com/images/split-protein-creamy-spinach-pasta/hero-split-adult-kid-plates-polished.webp","totalTime":"PT40M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"460 calories","proteinContent":"38g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["1 bag (9 oz) fresh spinach","3 individual cups (5.3 oz each) low-fat cottage cheese","1/2 cup fat-free ultra-filtered milk","1/2 cup bone broth","water + ice (for blanching)","4 package servings regular pasta","enough green sauce to lightly coat 4 pasta servings","1 lb tri-tip (divides into 4 portions)","preferred steak seasoning, to taste","ghee or another high-heat cooking fat, as needed","4 oz fully cooked bite-sized beef meatballs (2 oz per kid)","prepared Alfredo sauce, enough to lightly coat"],"recipeInstructions":[{"@type":"HowToStep","name":"Blanch Spinach","text":"Bring a pot of water to a boil. Add the 9 oz bag of spinach and blanch briefly, just until fully wilted."},{"@type":"HowToStep","name":"Ice Bath + Squeeze","text":"Immediately transfer to ice water. Drain thoroughly and squeeze out excess water \\u2014 residual water thins the sauce."},{"@type":"HowToStep","name":"Blend Sauce","text":"Add cottage cheese, ultra-filtered milk, bone broth, and cooled spinach to a blender. Blend until completely smooth and pale green."},{"@type":"HowToStep","name":"Portion Bulk Sauce","text":"Reserve enough to lightly coat 4 pasta servings for the current dinner. Portion the remainder into family-dinner containers for ~6 future dinners (creator-reported yield)."},{"@type":"HowToStep","name":"Cook + Toss Pasta","text":"Cook 4 package servings of regular pasta per package. Drain and toss with only enough green sauce to coat \\u2014 not to drown."},{"@type":"HowToStep","name":"Kid Protein (parallel)","text":"Heat 4 oz bite-sized beef meatballs per package. Coat lightly with Alfredo (do NOT pool). Divide into two 2 oz kid portions."},{"@type":"HowToStep","name":"Adult Protein \\u2014 Season + Sear","text":"Season tri-tip on all sides. Heat a large skillet with a small amount of ghee, then sear the tri-tip until deeply browned."},{"@type":"HowToStep","name":"Rest + Slice","text":"Cook to preferred doneness (creator: medium-rare). Rest at least 5 minutes, then slice thin against the grain and cube. USDA FSIS: whole beef cuts should reach 145\\u00b0F with a 3-minute rest \\u2014 see executionRules."},{"@type":"HowToStep","name":"Plate Two Ways","text":"Adult plates get green pasta + one tri-tip portion each. Kid plates get the same green pasta + 2 oz Alfredo-coated meatballs each. One cook, two proteins."}],"keywords":"steak, meatballs, pasta, creamy, spinach, cottage-cheese, split-cook, batch-prep, meal-prep, hidden-vegetable"}</script>

    <noscript><h1>Split-Protein Creamy Spinach Pasta — The Split Plate</h1><p>One-cook, two-protein dinner for two adults and two kids. Everyone gets regular pasta coated in a batch-prepped spinach + cottage-cheese green sauce. Adults get seared tri-tip; kids get bite-sized beef meatballs with a little Alfredo. The green sauce batch is portioned for six future family dinners, and 1 lb of tri-tip creates four adult portions (two now, two for the next adult meal). Adult plate is a rounded creator estimate at ~460 cal / 38g protein; kid macros are intentionally hidden until each current pasta / meatball / Alfredo / cottage-cheese / milk / broth label is checked.</p></noscript>
