    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cheesy Spinach & Chicken Orzo","description":"Caramelize onion in butter, cook regular orzo in chicken bone broth, then stir in spinach and cooked smoked pulled chicken. Off heat, fold in completely smooth blended cottage cheese and lite mozzarella. Portion into eight full-size servings and top with cheddar; heat an individual portion before eating. One-eighth of the untopped batch is approximately 514 calories and 53g protein. A full portion with 1 tsp chili crunch is approximately 550 calories and 53g protein. Smaller kid portions do not use those adult estimates.","image":"https://thesplitplate.com/images/cheesy-spinach-chicken-orzo/hero-polished.webp","recipeYield":"8","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Italian","recipeIngredient":["464g dry regular orzo (eight logged servings; check your package serving weight)","300g onion, chopped","1 tbsp (14g) butter","4 cups Kirkland chicken bone broth","340g frozen chopped spinach","840g cooked smoked pulled chicken","339g cottage cheese, blended completely smooth","168g lite low-moisture mozzarella, shredded","84g Unexpected Cheddar, shredded","Optional: 1 tsp chili crunch per adult portion, added after serving","Seasonings to taste (exact amount not recorded)"],"recipeInstructions":[{"@type":"HowToStep","name":"Caramelize The Onion","text":"Cook the 300g chopped onion in 1 tbsp butter, stirring as needed until caramelized. Season to taste; an exact seasoning amount was not recorded.","image":"https://thesplitplate.com/images/cheesy-spinach-chicken-orzo/caramelize-onion-polished.webp"},{"@type":"HowToStep","name":"Cook The Orzo","text":"Add 464g dry regular orzo and 4 cups chicken bone broth. Simmer, stirring, until the pasta is cooked. No pasta water was added to the filmed batch; the time depends on the pasta and pan.","image":"https://thesplitplate.com/images/cheesy-spinach-chicken-orzo/broth-orzo-polished.webp"},{"@type":"HowToStep","name":"Add Spinach And Chicken","text":"Stir in 340g chopped spinach, then 840g cooked smoked pulled chicken. Heat through.","image":"https://thesplitplate.com/images/cheesy-spinach-chicken-orzo/spinach-chicken-polished.webp"},{"@type":"HowToStep","name":"Blend The Cheese Base","text":"Blend 339g cottage cheese completely smooth. Take the orzo pan off the heat, then fold through the cottage cheese and 168g shredded lite mozzarella until creamy.","image":"https://thesplitplate.com/images/cheesy-spinach-chicken-orzo/blend-cottage-polished.webp"},{"@type":"HowToStep","name":"Portion And Top","text":"Divide the shared mild pot into eight full-size portions and top with 84g shredded cheddar across the batch. The kids had smaller portions from this same pot; do not count eight adult portions plus extra kid portions.","image":"https://thesplitplate.com/images/cheesy-spinach-chicken-orzo/portion-cheddar-polished.webp"},{"@type":"HowToStep","name":"Heat And Finish","text":"The creator microwaved an individual portion for about two minutes immediately before eating. Adjust for the microwave and portion, stir, and heat refrigerated leftovers thoroughly. Add 1 tsp chili crunch to a full adult portion if desired; leave kid portions mild.","image":"https://thesplitplate.com/images/cheesy-spinach-chicken-orzo/adult-kid-finish-polished.webp"}],"keywords":"chicken, orzo, spinach, cottage-cheese, one-pot, high-protein, family-dinner, meal-prep"}</script>

    <noscript><h1>Cheesy Spinach &amp; Chicken Orzo — The Split Plate</h1><p>Caramelize onion in butter, cook regular orzo in chicken bone broth, then stir in spinach and cooked smoked pulled chicken. Off heat, fold in completely smooth blended cottage cheese and lite mozzarella. Portion into eight full-size servings and top with cheddar; heat an individual portion before eating. One-eighth of the untopped batch is approximately 514 calories and 53g protein. A full portion with 1 tsp chili crunch is approximately 550 calories and 53g protein. Smaller kid portions do not use those adult estimates.</p></noscript>
