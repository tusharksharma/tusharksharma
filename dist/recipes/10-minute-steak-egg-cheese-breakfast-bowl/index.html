    <noscript><h1>10-Minute Steak, Egg &amp; Cheese Breakfast Bowl — The Split Plate</h1><p>Chop the steak and chile and warm them in a lightly sprayed skillet. Rinse and drain the fat-free shredded cheddar, then add it with the eggs and a few pinches of seasoning salt. Stir until the eggs are just set and divide evenly between two bowls. Rinsing the cheese first helped this batch melt better for me. It's a high-protein breakfast, but with seasoned steak, cheese, and seasoning salt it isn't a low-sodium one.</p></noscript>
