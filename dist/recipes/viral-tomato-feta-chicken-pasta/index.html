n a large casserole dish. Add 4 tbsp olive oil + Mediterranean seasoning + salt (light — feta will add more). Toss. Nestle both feta blocks among the tomatoes; drizzle the remaining oil over the feta and finish with a bit more seasoning if needed. Bake 45 min until the tomatoes have burst and the feta is soft and lightly browned.","image":"https://thesplitplate.com/images/viral-tomato-feta-chicken-pasta/step-01-add-feta.webp"},{"@type":"HowToStep","name":"Air-fry Chicken","text":"While the casserole bakes, air-fry the chicken thighs for ~20 min. Air-fryer performance varies — verify a safe internal temperature on the thickest pieces before pulling. Rest briefly, then chop into bite-size pieces.","image":"https://thesplitplate.com/images/viral-tomato-feta-chicken-pasta/step-03-air-fried-chicken.webp"},{"@type":"HowToStep","name":"Cook Pastas Separately","text":"12 oz low-carb penne and 9 oz regular penne in two separate salted-water pots per each package's directions. Drain both, keep separate."},{"@type":"HowToStep","name":"Mash The Sauce","text":"Stir the baked feta and tomatoes right in the casserole until creamy with visible tomato pieces. Do not blend smooth — the texture is the point.","image":"https://thesplitplate.com/images/viral-tomato-feta-chicken-pasta/step-05-mash-tomato-feta-sauce.webp"},{"@type":"HowToStep","name":"Split 2","text":"1: Move ~1/3 of the mashed sauce and ~1/3 of the chopped chicken into a separate mixing bowl. Leave ~2/3 in the casserole dish.","image":"https://thesplitplate.com/images/viral-tomato-feta-chicken-pasta/step-06-divide-sauce.webp"},{"@type":"HowToStep","name":"Fold","text":"The low-carb penne into the main casserole with the remaining 2/3 sauce and 2/3 chopped chicken. Fold until evenly coated. Portion into 6 adult containers, 2 oz dry pasta equivalent per container.","image":"https://thesplitplate.com/images/viral-tomato-feta-chicken-pasta/step-08-mix-low-carb-pasta.webp"},{"@type":"HowToStep","name":"Fold","text":"Regular penne into the mixing bowl with the 1/3 sauce and 1/3 chicken. Fold until evenly coated.","image":"https://thesplitplate.com/images/viral-tomato-feta-chicken-pasta/step-07-mix-regular-pasta.webp"},{"@type":"HowToStep","name":"Portion 6 Smaller Containers","text":"Divide across six airtight containers, ~1.5 oz dry pasta equivalent per container. Cool 20-30 min uncovered before sealing.","image":"https://thesplitplate.com/images/viral-tomato-feta-chicken-pasta/step-09-pack-family-dinners.webp"}],"keywords":"chicken, pasta, feta, tomato, viral, meal-prep, split-plate, family-dinner, mediterranean, kid-approved, weeknight, batch-cook"}</script>

    <noscript><h1>Viral Tomato Feta Chicken Pasta, Split Plate Style — The Split Plate</h1><p>The lockdown-era viral tomato-feta pasta adapted into a split-plate meal prep. One casserole roasts 600 g cherry and pear tomatoes with two 8 oz blocks of feta and Mediterranean seasoning at 400°F for 45 min. Air-fry 2 lb chicken thighs in parallel for 20 min. Mash the baked feta and tomatoes into a creamy sauce with visible tomato pieces, chop the chicken, and split 2:1 — ~2/3 of the sauce and chicken to a low-carb penne pot for the adults (2 oz dry per adult container), ~1/3 to a regular penne pot for the smaller portions (1.5 oz dry per container). Pack 6 adult containers plus 6 smaller containers = 3 family dinners for 2 adults + 2 kids. Adult macro headline is ~450 cal / 37g protein; smaller-portion macros intentionally not published — the creator serves 1/2 unit per kid and adjusts to appetite. Refrigerate up to 5 days.</p></noscript>
