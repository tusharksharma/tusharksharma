    <noscript><h1>Dan-O's Bone-In Chicken Thighs — The Split Plate</h1><p>Bone-in skin-on chicken thighs. Pat dry hard, season aggressively, bake uncovered at 425°F for 35-40 minutes. Adults get Dan-O's Spicy + charred asparagus drizzled with Umami Lemon Heat Sauce. Kids get Dan-O's Original + plain asparagus + a small tortilla wrap on the side. The recipe is on the back of the bottle. The system is what makes it repeatable.</p></noscript>
