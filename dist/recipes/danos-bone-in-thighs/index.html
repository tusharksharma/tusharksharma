    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Dan-O's Bone-In Chicken Thighs","description":"Bone-in skin-on chicken thighs. Pat dry hard, season aggressively, bake uncovered at 425°F for about 35-40 minutes, and verify 165°F in the thickest thigh. Adults get Dan-O's Spicy + charred asparagus drizzled with Umami Lemon Heat Sauce. Kids get Dan-O's Original + plain asparagus + a small tortilla wrap on the side. The recipe is on the back of the bottle. The system is what makes it repeatable.","image":"https://thesplitplate.com/images/danos-thighs-2026/split-plate-cover-polished.webp","totalTime":"PT45M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["8 bone-in skin-on chicken thighs (~4-5 oz each)","1-2 tbsp avocado or olive oil (just enough to coat)","Pinch of salt (Dan-O's is salted, but a small assist helps)","1 large bunch asparagus (1-1.5 lbs), trimmed","Olive oil + salt + pepper","Dan-O's Spicy Seasoning (heavy coat — both sides)","1-2 tbsp Umami Lemon Heat Sauce (drizzle over asparagus)","Cracked black pepper","Dan-O's Original Seasoning (heavy coat — both sides)","1 small flour tortilla per kid (cut in half), warmed"],"recipeInstructions":[{"@type":"HowToStep","name":"Preheat","text":"Oven to 425°F. Convection if you have it."},{"@type":"HowToStep","name":"Pat Dry","text":"Paper towels, every thigh, both sides. Press hard. This is the most important step.","image":"https://thesplitplate.com/images/danos-thighs/step1-pat-dry.webp"},{"@type":"HowToStep","name":"Oil","text":"Drizzle oil, rub it in. Tiny pinch of salt on each thigh."},{"@type":"HowToStep","name":"Asparagus Prep","text":"Snap off woody ends. Toss with olive oil, salt, pepper. Single layer on a sheet pan."},{"@type":"HowToStep","name":"Season","text":"Coat both sides of the adult thighs HEAVY with Dan-O's Spicy. You should barely see the chicken.","image":"https://thesplitplate.com/images/danos-thighs/step2-season.webp"},{"@type":"HowToStep","name":"Bake","text":"Skin-side up on the adult tray. 425°F, 35-40 min. Don't flip, don't open the oven before 30.","image":"https://thesplitplate.com/images/danos-thighs/step3-cooked.webp"},{"@type":"HowToStep","name":"Asparagus","text":"Roast the same time, same oven. 12-15 min until tender + slightly charred. Pull when thighs are at 30 min mark."},{"@type":"HowToStep","name":"Make The Sauce","text":"3 minutes — mayo + lemon + soy + Dijon + chili oil. Whisk smooth, rest 5 min. (See Umami Lemon Heat Sauce in Cookbook.)"},{"@type":"HowToStep","name":"Plate","text":"2 thighs over charred asparagus, drizzle Umami Lemon Heat over the asparagus. Crack of pepper. Done.","image":"https://thesplitplate.com/images/danos-thighs/plated-split.webp"},{"@type":"HowToStep","name":"Season","text":"Coat both sides of kid thighs with Dan-O's Original. Same heavy hand — Original isn't spicy, just savory."},{"@type":"HowToStep","name":"Bake","text":"Same rack as adult tray, 425°F, 35-40 min."},{"@type":"HowToStep","name":"Wrap","text":"Warm tortilla in microwave 15 sec or on a dry pan. Cut in half, fold."},{"@type":"HowToStep","name":"Plate","text":"1 thigh + plain asparagus (no tapenade) + folded wrap. Mild, familiar, no resistance."}],"keywords":"chicken, thighs, bone-in, oven-baked, split-cook, low-effort, weeknight, no-marinade, worth-every-penny"}</script>
