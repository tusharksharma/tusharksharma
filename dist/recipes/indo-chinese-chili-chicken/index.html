","text":"Wok on high, light avocado spray. Cook peppers + onions 3-5 min until charred but still crisp.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/step-02-char-vegetables-polished.webp"},{"@type":"HowToStep","name":"Season Veg","text":"Add 1/2 tbsp Umami Punch to the charred veg. Toss briefly.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/step-03-season-vegetables.webp"},{"@type":"HowToStep","name":"Add Adult Chicken","text":"Add the remaining 14 oz air-fried chicken to the wok. Sprinkle with the remaining 1/2 tbsp Umami Punch.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/step-04-add-adult-chicken.webp"},{"@type":"HowToStep","name":"Pour Sauce","text":"Pour the prepared six-ingredient sauce over the chicken + veg. No slurry.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/step-05-pour-sauce-polished.webp"},{"@type":"HowToStep","name":"Toss Until Glossy","text":"Aggressive toss for 45-75 sec, just until everything is coated and shiny. Kill the heat the second it clings — do NOT simmer.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/step-06-toss-until-glossy-polished.webp"},{"@type":"HowToStep","name":"Plate Adults","text":"7 oz glossy chili chicken with veg per adult. Serve immediately.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/step-08-build-adult-plates-polished.webp"},{"@type":"HowToStep","name":"Plate Kids","text":"Reserved plain chicken, cucumber slices, warm garlic bread, and a puddle of yellow mustard for dipping. Adjust portions to appetite.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/step-07-build-kid-plates-polished.webp"}],"keywords":"chicken, indo-chinese, chili, wok, air-fryer, split-cook, glossy"}</script>

    <noscript><h1>Indo-Chinese Chili Chicken — The Split Plate</h1><p>400 cal / 35g protein per adult plate. Lightly breaded chicken chunks air-fried until crisp, then split: kid portions get cucumber, garlic bread, and yellow mustard on the side; adult portions hit a hot wok with peppers, onions, Jet Tila's Umami Punch, and a six-ingredient Indo-Chinese chili sauce. Tossed 45–75 seconds until glossy, then heat off.</p></noscript>
