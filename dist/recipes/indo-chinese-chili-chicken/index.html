    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Indo-Chinese Chili Chicken","description":"400 cal / 35g protein per adult plate. Lightly breaded chicken chunks air-fried until crisp, then split: kid portions get cucumber, garlic bread, and yellow mustard on the side; adult portions hit a hot wok with peppers, onions, Jet Tila's Umami Punch, and a six-ingredient Indo-Chinese chili sauce. Tossed 45–75 seconds until glossy, then heat off.","image":"https://thesplitplate.com/images/indo-chinese-chili-chicken/hero-split-adult-kid-plates-polished.webp","totalTime":"PT25M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"400 calories","proteinContent":"35g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["21 oz Kirkland Lightly Breaded Chicken Breast Chunks (14 oz adult + 7 oz kid)","Avocado oil spray (as needed)","8 oz bell peppers + red onion (large pieces)","1 tbsp Spiceology Jet Tila's Umami Punch (split half-and-half between veg and adult chicken)","1/2 tbsp Kikkoman Thai-Style Chili Sauce · 1 tbsp Ching's Red Chili Sauce · 1 tbsp Nakano Rice Vinegar · 1 tbsp Kikkoman Soy Sauce · 1/2 tbsp Sesame Chili Oil · 1/2 tbsp Lao Gan Ma Fried Chili in Oil","Cucumber (sliced)","2 portions garlic bread","Yellow mustard for dipping"],"recipeInstructions":[{"@type":"HowToStep","name":"Air Fry","text":"All 21 oz chicken at 400°F, 10-12 min. Shake halfway."},{"@type":"HowToStep","name":"Reserve Kids","text":"Set aside 7 oz plain chunks before seasoning or sauce."},{"@type":"HowToStep","name":"Mix Sauce","text":"Combine the six adult sauce ingredients in a glass. No slurry."},{"@type":"HowToStep","name":"Char Veg","text":"High-heat wok, peppers + onions 3-5 min until charred. Add 1/2 tbsp Umami Punch."},{"@type":"HowToStep","name"     <noscript><h1>Indo-Chinese Chili Chicken — The Split Plate</h1><p>400 cal / 35g protein per adult plate. Lightly breaded chicken chunks air-fried until crisp, then split: kid portions get cucumber, garlic bread, and yellow mustard on the side; adult portions hit a hot wok with peppers, onions, Jet Tila's Umami Punch, and a six-ingredient Indo-Chinese chili sauce. Tossed 45–75 seconds until glossy, then heat off.</p></noscript>
