    <noscript><h1>French Dip Polenta Dunkers — The Split Plate</h1><p>Episode 3 of Can I Make a Recipe Go Viral? — Tushar's original French dip, rebuilt on crisp polenta instead of bread. Slice a chilled tube of prepared polenta into 12 rounds, oil and pepper them, and oven-crisp at 475°F. Warm a package of pre-cooked au jus beef, save the juices, and build a dipping jus with an au jus packet and a bone-broth packet. Cap six crisp rounds with provolone and beef, bake to melt, then top with the remaining rounds. Serve two dunkers, 2/3 cup citrus-seasoned green beans, and a ramekin of jus per plate. Keep the jus on the side so the polenta stays crisp. About 450 cal / 40g protein per plate — a sodium-forward build from the packaged beef, packets, cheese, and seasoning, so taste before adding any salt.</p></noscript>
