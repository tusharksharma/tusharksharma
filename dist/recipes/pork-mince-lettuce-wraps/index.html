    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Pork Mince Lettuce Wraps","description":"32 oz of 95% lean ground pork browned with ginger garlic paste + green onion, then split: adult side gets fresh red chilies + fish sauce + lemon + sesame chili oil; kid side stays mild and gets a creamy sauce (olive oil + Herdez Avocado Cilantro + bone broth) stirred directly into the mince. Adults wrap in Tanimura & Antle Sweet Gem lettuce with Lift Drizzle on the side. Kids spoon into lettuce OR onto a slider roll — kid-format choice protects against the lettuce-rejection day.","image":"https://thesplitplate.com/images/pork-lettuce-wraps/hero.webp","totalTime":"PT25M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"491 calories","proteinContent":"53g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["32 oz NY Style Sausage Co. 95% Lean Ground Pork (2 packs × 16 oz)","Chosen Foods Avocado Oil Spray (4 sec)","2 tbsp Verka Organic Ginger Garlic Paste","1 cup chopped green onion (~1 bunch)","2 tbsp Red Boat Fish Sauce 40°N","2 tsp Dynasty Sesame Chili Oil (Goma Rayu)","3 tbsp ReaLemon lemon juice","4 pinches Dan-O's SPG Tri-O","2 fresh red Thai chilies, chopped [adult, into pork]","Lift Drizzle — adult sauce (recipe →)","1 tbsp olive oil [kid]","1 tbsp Herdez Taqueria Avocado Cilantro Sauce [kid]","1 tbsp chicken bone broth [kid]","1 pack Tanimura & Antle Artisan Sweet Gem Lettuce (for adult wraps + kid lettuce option)","Dinner slider rolls (kid backup if lettuce gets rejected)"],"recipeInstructions":[{"@type":"HowToStep","name":"Mise en Place","text":"Everything out — pork packs, Verka paste, green onions chopped, Red Boat, Dynasty, ReaLemon, Dan-O's SPG, Chosen spray, fresh chilies, Sweet Gem lettuce washed, kid sauce ingredients ready."},{"@type":"HowToStep","name":"Heat Pan + Aromatics","text":"Stainless steel pan, medium-high. Spray avocado oil 4 sec. Add Verka paste + green onion. Sauté 60-90 sec until fragrant."},{"@type":"HowToStep","name":"Brown Pork","text":"32 oz pork into the pan. Spread single layer. Don't stir 90 sec — let crust form. Then break with spatula, brown the rest. 6-8 min total."},{"@type":"HowToStep","name":"Shared Season","text":"Fish sauce + sesame chili oil + lemon + 4 pinches SPG. Stir to coat. Cook 60 sec."},{"@type":"HowToStep","name":"Pull Kid Portion","text":"~1/4 of pan into deli container. SPLIT MOMENT."},{"@type":"HowToStep","name":"Adult","text":"Add 2 chopped chilies to remaining pork. Stir 30 sec."},{"@type":"HowToStep","name":"Lift Drizzle","text":"Whisk olive oil + soy + fish sauce + lemon + coriander + 2 chopped chilies in small bowl."},{"@type":"HowToStep","name":"Kid Sauce Into Mince","text":"1 tbsp olive oil + 1 tbsp Herdez Avocado Cilantro + 1 tbsp bone broth stirred into kid's deli container. Should coat, not pool."},{"@type":"HowToStep","name":"Serve","text":"Adult bowl of mince + Lift Drizzle ramekin + Sweet Gem leaves on platter. Kid bowl of pre-sauced mince + lettuce leaves OR slider rolls. Build at the table."}],"keywords":"lettuce-wraps, pork, se-asian, fish-sauce, low-carb, split-cook, weeknight, one-pan"}</script>

    <noscript><h1>Pork Mince Lettuce Wraps — The Split Plate</h1><p>32 oz of 95% lean ground pork browned with ginger garlic paste + green onion, then split: adult side gets fresh red chilies + fish sauce + lemon + sesame chili oil; kid side stays mild and gets a creamy sauce (olive oil + Herdez Avocado Cilantro + bone broth) stirred directly into the mince. Adults wrap in Tanimura &amp; Antle Sweet Gem lettuce with Lift Drizzle on the side. Kids spoon into lettuce OR onto a slider roll — kid-format choice protects against the lettuce-rejection day.</p></noscript>
