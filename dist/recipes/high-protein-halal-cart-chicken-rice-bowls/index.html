    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Halal Cart Chicken Rice Bowls","description":"550 cal / 50g protein / 22g fat / 34g net carbs per adult bowl, 4 servings (2 adults at 8 oz chicken + 3/4 cup rice; 2 kids at 4 oz chicken + 1/2 cup rice). Trader Joe's pre-seasoned shawarma chicken thighs (1.5 lb total) griddled in halal-cart-style edges. Basmati rice (1 cup uncooked) cooked in 1.5 cups Kirkland Sipping Bone Broth + 1 tbsp ghee + turmeric + cumin + garlic/onion powder + 1 Bare Bones Instant Bone Broth Powder stick — yellow rice with built-in protein lift. Adults plate: big white plate with yellow rice, chopped griddled chicken, shredded iceberg, diced Roma tomato, Mezete toum drizzle, Shuug Original Harissa drizzle. Kids plate: sage-green compartment tray with rice in one section, chicken (with toum drizzle) in another, lettuce + tomato in a side white bowl. No harissa on kid plate. Both plate at the same time, assemble at the table.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/hero-split-plate-polished.webp","totalTime":"PT40M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Middle Eastern","recipeIngredient":["1.5 lb Trader Joe's Shawarma-Style Chicken Thighs (or 1.5 lb boneless skinless thighs + DIY marinade — see substitutionNotes)","Cooking spray (Chosen Foods avocado oil)","1 cup uncooked basmati rice, rinsed","1.5 cups Kirkland Organic Chicken Sipping Bone Broth","1 tbsp ghee","1 Bare Bones Instant Bone Broth Powder stick (15g, chicken)","1.5 tsp kosher salt","0.5 tsp garlic powder","0.5 tsp onion powder","0.5 tsp cumin","1 tsp turmeric","1/2 head iceberg lettuce, shredded","2 Roma tomatoes, diced","Pinch kosher salt (for tomatoes)","Mezete Toum sauce (on BOTH plates)","1 big white plate per adult","2 tbsp Mezete Toum (drizzle over chicken + rice)","1 tbsp Shuug Original Harissa Hot Sauce (drizzle over chicken only)","1 compartment kid tray per child (4-section tray, like EZPZ Happy Mat)","1 small white bowl per child (for lettuce + tomato)","1 tbsp Mezete Toum (drizzle over chicken only, NOT the rice)","(NO Shuug harissa — adult-only)"],"recipeInstructions":[{"@type":"HowToStep","name":"Mise","text":"Pull Trader Joe's shawarma chicken from fridge (let sit 10 min to take chill off). Rinse 1 cup basmati under cold water until water runs mostly clear. Measure 1.5 cups Kirkland Sipping Bone Broth, 1 tbsp ghee, spices (1.5 tsp salt / 0.5 tsp garlic powder / 0.5 tsp onion powder / 0.5 tsp cumin / 1 tsp turmeric), and the Bare Bones Instant Bone Broth stick. Set out Mezete toum + Shuug harissa.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/brand-mezete-toum-sauce.webp"},{"@type":"HowToStep","name":"Start The Rice","text":"Rinsed basmati + 1.5 cups bone broth + ghee + Bare Bones powder + all the spices into a pot. Bring to a boil over high heat, then drop to LOWEST heat, cover with a tight lid, simmer undisturbed 15 min. NO peeking — the steam is what cooks the rice.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/step-03-add-bone-broth.webp"},{"@type":"HowToStep","name":"Griddle The Chicken","text":"Griddle or large skillet over medium-high heat. Cooking spray. Chicken thighs in a single layer. 3-4 min undisturbed for the contact-sear, then flip. 2-3 min on second side. Chop into the pan with a spatula at the 5-min mark — halal-cart edges form on the chopped sides. Cook to 165°F internal, ~10 min total.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/step-05-griddle-chicken.webp"},{"@type":"HowToStep","name":"Prep The Cold Side","text":"Dice 2 Roma tomatoes ~1/4-inch. Shred 1/2 head iceberg thin. Pinch of salt on the tomatoes only. Set aside.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/step-07-dice-tomatoes.webp"},{"@type":"HowToStep","name":"Rice Finish","text":"Off heat at the 15-min mark. Let rest covered 10 min (this is non-negotiable — rest is when the steam finishes setting the grains). Fluff with a fork. Should be loose, separate, yellow, fragrant.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/step-08-plate-yellow-rice.webp"},{"@type":"HowToStep","name":"Adult Plate","text":"~3/4 cup yellow rice mounded on one side of the plate. ~8 oz chopped halal-cart chicken next to it. Shredded iceberg + diced Roma alongside or on top. Mezete toum drizzle over the chicken AND rice (~2 tbsp). Shuug Original Harissa drizzle over the chicken only (~1 tbsp).","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/step-09-build-adult-bowl.webp"},{"@type":"HowToStep","name":"Eat Immediately","text":"The contrast is the point — warm rice + crispy chopped chicken edges + cold lettuce + tomato + creamy toum + smoky harissa. Don't let it sit."},{"@type":"HowToStep","name":"Kid Tray","text":"Compartment tray. Section 1: ~1/2 cup yellow rice. Section 2: ~4 oz chopped chicken with 1 tbsp Mezete toum drizzled over. Largest section: small white bowl filled with shredded iceberg + diced Roma tomato. NO HARISSA anywhere on the tray.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/kid-deconstructed-white-sauce-photo.webp"},{"@type":"HowToStep","name":"Assembly (kid Leads)","text":"Most kids eat the rice + chicken first, then graze on lettuce + tomato. Some scoop chicken into the lettuce bowl and eat it together. Either pattern works. Don't pre-mix anything."}],"keywords":"chicken, rice-bowl, halal-style, shawarma, split-cook, weeknight, high-protein, halal-cart, gluten-free, middle-eastern"}</script>

    <noscript><h1>High-Protein Halal Cart Chicken Rice Bowls — The Split Plate</h1><p>550 cal / 50g protein / 22g fat / 34g net carbs per adult bowl, 4 servings (2 adults at 8 oz chicken + 3/4 cup rice; 2 kids at 4 oz chicken + 1/2 cup rice). Trader Joe's pre-seasoned shawarma chicken thighs (1.5 lb total) griddled in halal-cart-style edges. Basmati rice (1 cup uncooked) cooked in 1.5 cups Kirkland Sipping Bone Broth + 1 tbsp ghee + turmeric + cumin + garlic/onion powder + 1 Bare Bones Instant Bone Broth Powder stick — yellow rice with built-in protein lift. Adults plate: big white plate with yellow rice, chopped griddled chicken, shredded iceberg, diced Roma tomato, Mezete toum drizzle, Shuug Original Harissa drizzle. Kids plate: sage-green compartment tray with rice in one section, chicken (with toum drizzle) in another, lettuce + tomato in a side white bowl. No harissa on kid plate. Both plate at the same time, assemble at the table.</p></noscript>
