    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High-Protein Halal Cart Chicken Rice Bowls","description":"550 cal / 50g protein / 22g fat / 34g net carbs per adult bowl, 4 servings (2 adults at 8 oz chicken + 3/4 cup rice; 2 kids at 4 oz chicken + 1/2 cup rice). Trader Joe's pre-seasoned shawarma chicken thighs (1.5 lb total) griddled in halal-cart-style edges. Basmati rice (1 cup uncooked) cooked in 1.5 cups Kirkland Sipping Bone Broth + 1 tbsp ghee + turmeric + cumin + garlic/onion powder + 1 Bare Bones Instant Bone Broth Powder stick — yellow rice with built-in protein lift. Adults plate: big white plate with yellow rice, chopped griddled chicken, shredded iceberg, diced Roma tomato, Mezete toum drizzle, Shuug Original Harissa drizzle. Kids plate: sage-green compartment tray with rice in one section, chicken (with toum drizzle) in another, lettuce + tomato in a side white bowl. No harissa on kid plate. Both plate at the same time, assemble at the table.","image":"https://thesplitplate.com/images/high-protein-halal-cart-chicken-rice-bowls/hero-split-plate-polished.webp","totalTime":"PT40M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"550 calories","proteinContent":"50g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["1.5 lb Trader Joe's Shawarma-Style Chicken Thighs","Cooking spray (Chosen Foods avocado oil)","1 cup uncooked basmati rice, rinsed","1.5 cups Kirkland Organic Chicken Sipping Bone Broth","1 tbsp ghee","1 Bare Bones Instant Bone Broth Powder stick (15g, chicken)","1.5 tsp kosher salt","0.5 tsp garlic powder","0.5 tsp onion powder","0.5 tsp cumin","1 tsp turmeric","1/2 head iceberg lettuce, shredded","2 Roma tomatoes, diced","Pinch kosher salt (for tomatoes)","4 tbsp Mezete Toum (~2 tbsp per adult bowl) [shared with kid plates]","2 tbsp Shuug Original Harissa Hot Sauce (~1 tbsp per adult bowl) [adult]","2 tbsp Mezete Toum (1 tbsp per kid plate, on chicken only) [kid]"],"recipeInstructions":[{"@type":"HowToStep","name":"Mise en Place","text":"Trader Joe's shawarma chicken out of fridge. Rinse 1 cup basmati. Measure spices + bone broth + ghee + Bare Bones powder. Set out Mezete toum + Shuug harissa."},{"@type":"HowToStep","name":"Rinse Rice","text":"Cold water through the basmati until it runs mostly clear. Drain well."},{"@type":"HowToStep","name":"Start The Rice","text":"Rinsed basmati + 1.5 cups bone broth + ghee + Bare Bones powder + spices into a pot. Boil, drop to lowest heat, cover, 15 min undisturbed."},{"@type":"HowToStep","name":"Griddle The Chicken","text":"Medium-high heat, cooking spray, chicken in single layer. 3-4 min undisturbed for sear. Flip. 2-3 min second side. Chop into the pan at the 5-min mark — halal-cart edges. Cook to 165°F."},{"@type":"HowToStep","name":"Prep Cold Side","text":"2 Roma tomatoes diced 1/4-inch. 1/2 head iceberg shredded thin. Pinch of salt on tomatoes."},{"@type":"HowToStep","name":"Rice Finish","text":"Off heat at 15-min mark. Rest covered 10 min. Fluff with a fork."},{"@type":"HowToStep","name":"Adult Build","text":"Big white plate. 3/4 cup yellow rice mounded. 8 oz chopped chicken next to it. Iceberg + tomato. Mezete toum over chicken + rice (2 tbsp). Shuug harissa over chicken only (1 tbsp)."},{"@type":"HowToStep","name":"Kid Build","text":"Compartment tray. 1/2 cup yellow rice in one section. 4 oz chicken with 1 tbsp toum drizzle in another. Lettuce + tomato in a small white side bowl. NO HARISSA."},{"@type":"HowToStep","name":"Eat Immediately","text":"Warm rice + chicken vs cold lettuce + tomato + creamy toum is the halal-cart contrast. Don't let plates sit."}],"keywords":"chicken, rice-bowl, halal-style, shawarma, split-cook, weeknight, high-protein, halal-cart, gluten-free, middle-eastern"}</script>

    <noscript><h1>High-Protein Halal Cart Chicken Rice Bowls — The Split Plate</h1><p>550 cal / 50g protein / 22g fat / 34g net carbs per adult bowl, 4 servings (2 adults at 8 oz chicken + 3/4 cup rice; 2 kids at 4 oz chicken + 1/2 cup rice). Trader Joe's pre-seasoned shawarma chicken thighs (1.5 lb total) griddled in halal-cart-style edges. Basmati rice (1 cup uncooked) cooked in 1.5 cups Kirkland Sipping Bone Broth + 1 tbsp ghee + turmeric + cumin + garlic/onion powder + 1 Bare Bones Instant Bone Broth Powder stick — yellow rice with built-in protein lift. Adults plate: big white plate with yellow rice, chopped griddled chicken, shredded iceberg, diced Roma tomato, Mezete toum drizzle, Shuug Original Harissa drizzle. Kids plate: sage-green compartment tray with rice in one section, chicken (with toum drizzle) in another, lettuce + tomato in a side white bowl. No harissa on kid plate. Both plate at the same time, assemble at the table.</p></noscript>
