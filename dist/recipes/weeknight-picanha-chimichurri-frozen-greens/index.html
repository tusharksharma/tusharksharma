    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Weeknight Picanha with Chimichurri & Frozen Greens","description":"Approximately 480 cal / 40g protein per adult plate. 2 adult plates + 2 deconstructed kid plates. Adults get 6 oz salt-seared picanha, one label serving of Whole Foods Market European Greens with basil-and-garlic sauce, and one label serving of prepared chimichurri spooned over the steak. Kids get two Amylu chicken breakfast patties, half a serving of the same greens, and a toasted slider bun served separately so they can assemble a sandwich or eat the components independently. Two skillets, one cook, done in 25 minutes. Creator pull temp is 135°F for medium; USDA-recommended pull is 145°F + 3 min rest — both preserved on the page. Costco Fotis Fine Foods Chimichurri is the shortcut; the No-Judge Chimichurri cookbook entry is the homemade alternative.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/hero-split-adult-kid-plates-polished.webp","totalTime":"PT25M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"480 calories","proteinContent":"40g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["12 oz picanha steaks (6 oz per adult) [adult]","4 fully-cooked chicken breakfast patties (Amylu, 2 per kid) [kid]","3 label servings Whole Foods Market European Greens with Basil & Garlic Sauce, or comparable frozen blend","2 label servings prepared chimichurri (Fotis Fine Foods from Costco, 1 per adult). Homemade alternative: No-Judge Chimichurri.","2 slider buns (1 per kid, split + toasted) [kid]","Salt, to taste","Avocado-oil cooking spray"],"recipeInstructions":[{"@type":"HowToStep","name":"Salt The Picanha","text":"Season both sides of 12 oz picanha with salt. No pepper, no rub — the chimichurri does the flavor work."},{"@type":"HowToStep","name":"Start The Greens","text":"3 label servings frozen European greens into a medium skillet. Cook per package (~6-8 min medium, stirring occasionally). Basil-and-garlic sauce is built in."},{"@type":"HowToStep","name":"Sear The Picanha","text":"Second skillet medium-high, avocado spray, add the picanha. Press briefly for full pan contact. Sear + flip until browned and cooked to preferred doneness."},{"@type":"HowToStep","name":"Doneness + Safety (read Both)","text":"Creator pulls at 135°F for medium — the video honestly notes this cook landed closer to medium-well. USDA FSIS recommends cooking whole beef steaks to at least 145°F and resting for at least 3 min before carving. Present as two separate choices; do not treat 135°F as a food-safety minimum."},{"@type":"HowToStep","name":"Rest The Picanha","text":"Transfer to a board. Rest 5+ min while the greens finish and the kid patties + buns cook in the steak skillet."},{"@type":"HowToStep","name":"Reheat Kid Patties in The Steak Skillet","text":"Drop 4 Amylu chicken breakfast patties into the same skillet on medium heat. 2-3 min per side per package."},{"@type":"HowToStep","name":"Toast The Slider Buns","text":"Cut heat to medium-low. Split 2 slider buns, place cut-side-down in the residual beef fat for 60 sec until golden."},{"@type":"HowToStep","name":"Slice The Picanha","text":"Thin against the grain. Chop the chicken patties into age-appropriate pieces for the kid plates."},{"@type":"HowToStep","name":"Plate Adults","text":"6 oz sliced picanha + 1 serving basil-garlic frozen greens + 1 serving chimichurri spooned over the steak. Stir the jar thoroughly first — oil separates."},{"@type":"HowToStep","name":"Plate Kids","text":"Divided tray. 2 chopped chicken patties in one compartment, 1/2 serving greens in another, 1 toasted slider bun in a third. No forced sandwich build — each kid decides whether to assemble or eat separately."}],"keywords":"picanha, steak, beef, chimichurri, frozen-vegetables, costco-shortcut, split-cook, family-dinner, weeknight, under-30"}</script>

    <noscript><h1>Weeknight Picanha with Chimichurri &amp; Frozen Greens — The Split Plate</h1><p>Approximately 480 cal / 40g protein per adult plate. 2 adult plates + 2 deconstructed kid plates. Adults get 6 oz salt-seared picanha, one label serving of Whole Foods Market European Greens with basil-and-garlic sauce, and one label serving of prepared chimichurri spooned over the steak. Kids get two Amylu chicken breakfast patties, half a serving of the same greens, and a toasted slider bun served separately so they can assemble a sandwich or eat the components independently. Two skillets, one cook, done in 25 minutes. Creator pull temp is 135°F for medium; USDA-recommended pull is 145°F + 3 min rest — both preserved on the page. Costco Fotis Fine Foods Chimichurri is the shortcut; the No-Judge Chimichurri cookbook entry is the homemade alternative.</p></noscript>
