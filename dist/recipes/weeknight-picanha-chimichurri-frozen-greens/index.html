    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Weeknight Picanha with Chimichurri & Frozen Greens","description":"Approximately 480 cal / 40g protein per adult plate. 2 adult plates + 2 deconstructed kid plates. Adults get 6 oz salt-seared picanha, one label serving of Whole Foods Market European Greens with basil-and-garlic sauce, and one label serving of prepared chimichurri spooned over the steak. Kids get two Amylu chicken breakfast patties, half a serving of the same greens, and a toasted slider bun served separately so they can assemble a sandwich or eat the components independently. Two skillets, one cook, done in 25 minutes. Creator pull temp is 135°F for medium; USDA-recommended pull is 145°F + 3 min rest — both preserved on the page. Costco Fotis Fine Foods Chimichurri is the shortcut; the No-Judge Chimichurri cookbook entry is the homemade alternative.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/hero-split-adult-kid-plates-polished.webp","totalTime":"PT25M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeIngredient":["3 label servings Whole Foods Market European Greens with Basil & Garlic Sauce (1 per adult + 1/2 per kid)","Avocado-oil cooking spray","12 oz picanha steaks total (6 oz per adult)","2 label servings prepared chimichurri (1 per adult — Fotis Fine Foods from Costco or the No-Judge Chimichurri cookbook version)","4 fully-cooked chicken breakfast patties (Amylu — 2 per kid)","2 slider buns (1 per kid, split + toasted)"],"recipeInstructions":[{"@type":"HowToStep","name":"Salt The Picanha","text":"Season both sides of 12 oz picanha with salt. No other seasoning — the chimichurri carries the flavor.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-01-salt-picanha-polished.webp"},{"@type":"HowToStep","name":"Start The Greens","text":"Add 3 label servings frozen European greens to a medium skillet. Cook per the package — usually 6-8 min at medium heat, stirring occasionally.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-02-add-frozen-greens-polished.webp"},{"@type":"HowToStep","name":"Sear The Picanha","text":"Heat a second skillet on medium-high, coat lightly with avocado spray, add the picanha. Press briefly for full pan contact if needed. Sear + flip until browned and cooked to preferred doneness.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-03-press-picanha-polished.webp"},{"@type":"HowToStep","name":"Doneness + Safety","text":"Creator pulls at 135°F for medium (video honestly notes this cook landed closer to medium-well). USDA recommends whole beef steaks cook to 145°F + rest 3 min before slicing. Both are valid — present them as separate choices.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-03-press-picanha-polished.webp"},{"@type":"HowToStep","name":"Rest + Slice","text":"Transfer picanha to a board and rest 5+ min. Then slice thin against the grain.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-06-slice-picanha-polished.webp"},{"@type":"HowToStep","name":"Plate The Adult","text":"6 oz sliced picanha + 1 serving basil-garlic frozen greens.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/final-adult-picanha-chimichurri-polished.webp"},{"@type":"HowToStep","name":"Spoon The Chimichurri","text":"1 serving of prepared chimichurri over the sliced steak. Stir the jar thoroughly first — the oil separates during storage.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-07-spoon-chimichurri-polished.webp"},{"@type":"HowToStep","name":"Reheat Kid Patties","text":"Once the picanha comes out to rest, drop 4 chicken breakfast patties into the same steak skillet on medium heat. Reheat 2-3 min per side per package directions.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-04-cook-kid-chicken-patties-polished.webp"},{"@type":"HowToStep","name":"Toast Slider Buns","text":"Split 2 slider buns. Cut heat to medium-low so the beef fat doesn't burn. Bun halves cut-side-down for 60 sec until golden.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/step-05-toast-slider-buns.webp"},{"@type":"HowToStep","name":"Plate Kid","text":"Chop patties into age-appropriate pieces. Divided tray: 2 chopped patties in one compartment, 1/2 serving greens in another, 1 toasted slider bun in a third. No forced sandwich build — kid decides.","image":"https://thesplitplate.com/images/weeknight-picanha-chimichurri-frozen-greens/final-moving-split-plates-polished.webp"}],"keywords":"picanha, steak, beef, chimichurri, frozen-vegetables, costco-shortcut, split-cook, family-dinner, weeknight, under-30"}</script>

    <noscript><h1>Weeknight Picanha with Chimichurri &amp; Frozen Greens — The Split Plate</h1><p>Approximately 480 cal / 40g protein per adult plate. 2 adult plates + 2 deconstructed kid plates. Adults get 6 oz salt-seared picanha, one label serving of Whole Foods Market European Greens with basil-and-garlic sauce, and one label serving of prepared chimichurri spooned over the steak. Kids get two Amylu chicken breakfast patties, half a serving of the same greens, and a toasted slider bun served separately so they can assemble a sandwich or eat the components independently. Two skillets, one cook, done in 25 minutes. Creator pull temp is 135°F for medium; USDA-recommended pull is 145°F + 3 min rest — both preserved on the page. Costco Fotis Fine Foods Chimichurri is the shortcut; the No-Judge Chimichurri cookbook entry is the homemade alternative.</p></noscript>
