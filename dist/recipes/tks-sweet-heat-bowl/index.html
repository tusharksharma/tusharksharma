ks Sauce","text":"While chicken air-fries (you have ~10 min). Whisk ginger-garlic paste + sesame chili oil + rice vinegar + soy + Bare Bones packet + hot honey sriracha. Full method in TKS Sauce (Cookbook).","image":"https://thesplitplate.com/images/tks-sweet-heat-chicken/sauce-ready.webp"},{"@type":"HowToStep","name":"Make The Fried Rice","text":"While chicken cooks, fry the cold bone broth rice with egg + sauce per the Spicy Umami Fried Rice method. Use 2 servings of cold bone broth rice for 2 adults. Full method in Spicy Umami Fried Rice (Cookbook)."},{"@type":"HowToStep","name":"Pull Kid Chicken","text":"6 oz (about half the cooked batch) onto the kid tray. No sauce yet. This is the split point.","image":"https://thesplitplate.com/images/tks-sweet-heat-chicken/wok-cooked.webp"},{"@type":"HowToStep","name":"Hot Dry Skillet","text":"Medium-high heat, dry pan (no oil), screaming hot. Add the adult chicken (10 oz total, 5 oz per person)."},{"@type":"HowToStep","name":"Glaze","text":"Pour half a batch of TKS Sauce AROUND THE EDGE of the pan — the hiss is the cue. Toss aggressively 60-90 sec until every piece is glossy. Off heat when standing liquid is gone."},{"@type":"HowToStep","name":"Plate","text":"Adult bowl — pile of Spicy Umami Fried Rice on one side, glossy TKS-glazed chicken on the other. Scatter scallions + sesame seeds across both. Real takeout dinner.","image":"https://thesplitplate.com/images/tks-sweet-heat-chicken/hero.webp"},{"@type":"HowToStep","name":"Reheat Kid Rice","text":"Half serving plain bone broth rice in a small bowl, splash of water, microwave 60 sec covered with a damp paper towel."},{"@type":"HowToStep","name":"Slice Peppers","text":"4-6 mini sweet peppers cut into rings or sticks. Raw — kids prefer the crunch."},{"@type":"HowToStep","name":"Plate Kid Tray","text":"3 oz crispy chicken (no sauce) + half-serving plain bone broth rice (use a small ramekin and flip onto the plate as a rice mound — kids respond to playful shapes) + raw sweet peppers on the side. Optional tiny TKS Sauce ramekin as dip. Done.","image":"https://thesplitplate.com/images/tks-sweet-heat-chicken/kid-trays.webp"}],"keywords":"chicken, crazy-cuizine, fried-rice, tks-sauce, air-fryer, split-cook, modular, weeknight, freezer-to-plate"}</script>

    <noscript><h1>Split Plate TKS Sweet Heat Chicken Bowl — The Split Plate</h1><p>Modular dinner that stacks three cookbook bases: Bone Broth Rice (made ahead Sunday, used cold for adult fried rice + warm for kid plain rice), Spicy Umami Fried Rice (adult side), and TKS Sauce (adult chicken glaze). 1 lb Crazy Cuizine chicken in the air fryer → split at the toss step: adult portion (5 oz each) goes into a hot dry pan with TKS Sauce for the cling; kid portion (3 oz each) gets pulled before saucing, plated plain. 20 minutes active time when rice is pre-made.</p></noscript>
