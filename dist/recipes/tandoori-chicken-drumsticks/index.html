    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Tandoori Chicken Drumsticks","description":"60g protein for 525 cal on the adult plate. Skinless drumsticks marinated overnight in fat-free Greek yogurt + lemon + tandoori masala — full strength for adults, about one-sixth the masala for kids. Bake at 425°F, then broil until charred and 165°F. Adults get 3 drumsticks with cucumber and spicy Kashmiri-chili-and-lemon onions. Kids get 1 mild drumstick, cucumber, and about 200 calories of rice, naan, or bhatura.","image":"https://thesplitplate.com/images/tandoori-chicken-drumsticks/hero-adult-three-drumstick-plate-polished.webp","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Indian","recipeIngredient":["8-10 skinless chicken drumsticks","1 container fat-free Greek yogurt (~150-170g)","Juice of 1 lemon","Cucumber","2/3 packet Shan or Everest Tandoori Masala","Pinch red color (optional)","Cucumber + kala namak (black salt)","Onion + Kashmiri chili + lemon","About 1/6 packet tandoori masala (stirred into the reserved yogurt-lemon base)","Cucumber slices","~200 cal of a familiar Indian carb — rice, naan, or bhatura"],"recipeInstructions":[{"@type":"HowToStep","name":"Prep","text":"Pull the skin off, pat the drumsticks dry, cut 2-3 deep slits per piece — to the bone. Split into an adult pile (5-6) and a kid pile (3-4)."},{"@type":"HowToStep","name":"Base","text":"Mix the fat-free Greek yogurt with the lemon juice. Pull out about a third for the kid bowl BEFORE any masala goes in."},{"@type":"HowToStep","name":"Marinate Adult","text":"Load 2/3 packet of tandoori masala into the remaining yogurt base. Massage deep into the slits until every piece is thickly coated."},{"@type":"HowToStep","name":"Marinate Kid","text":"Stir about one-sixth of the packet into the reserved base. Same flavor, quiet enough for a 5-year-old. Massage in."},{"@type":"HowToStep","name":"Rest","text":"Both bowls covered, overnight in the fridge. Minimum 6 hours."},{"@type":"HowToStep","name":"Cook","text":"Space the drumsticks on a wire rack over a sheet pan — no touching. Bake 425°F 15-20 min, then broil 5-7 min per side. OR grill medium-high 10-15 min per side. Pull at 165°F internal with visible char."},{"@type":"HowToStep","name":"Spicy Onions","text":"Toss thin-sliced red onion with Kashmiri chili and a hard squeeze of lemon. Let it sit while the chicken rests — it slumps and turns bright red."},{"@type":"HowToStep","name":"Plate","text":"3 drumsticks per adult on a white plate. Tip the spicy onions on alongside, add sliced cucumber sprinkled with kala namak. 525 cal / 60g protein."},{"@type":"HowToStep","name":"Plate","text":"1 drumstick in the big compartment, cucumber in the round well, the carb in the third. Nothing touching — kids control the assembly."},{"@type":"HowToStep","text":"Adjust the portion to your kid's appetite. 1 drumstick + ~200 cal carb lands around 385 cal / 25g protein."}],"keywords":"chicken, drumsticks, tandoori, indian, grill, oven, split-cook, meal-prep, high-protein, low-carb"}</script>

    <noscript><h1>Tandoori Chicken Drumsticks — The Split Plate</h1><p>60g protein for 525 cal on the adult plate. Skinless drumsticks marinated overnight in fat-free Greek yogurt + lemon + tandoori masala — full strength for adults, about one-sixth the masala for kids. Bake at 425°F, then broil until charred and 165°F. Adults get 3 drumsticks with cucumber and spicy Kashmiri-chili-and-lemon onions. Kids get 1 mild drumstick, cucumber, and about 200 calories of rice, naan, or bhatura.</p></noscript>
