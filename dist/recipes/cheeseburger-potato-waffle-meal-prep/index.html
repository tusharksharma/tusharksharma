    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cheeseburger Potato Waffle Meal Prep","description":"One waffle-iron batch (6 waffles) + one lean-beef skillet + a 2:1 adult:kid portion split → 2 dinners for 4. Adult plate: 1 waffle + 5 oz raw-equivalent 93/7 beef + 1.5 slices Velveeta + Tari. Creator's kid plate: 1 regular bun + half a waffle + 2.5 oz beef + 3/4 slice Velveeta + ketchup. The waffle stays fun; the protein is built around it, not smuggled into it.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/hero-adult-potato-waffle-cheeseburger-polished.webp","prepTime":"PT25M","cookTime":"PT45M","totalTime":"PT70M","recipeYield":"8","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["840 g frozen shredded hash browns (thawed and squeezed dry)","240-300 g liquid egg whites (start at 240g; add 30g only if needed)","168 g / 6 oz reduced-fat shredded cheddar","3 tbsp cornstarch","SPG to taste (creator used Dan-O's SPG)","Light avocado-oil spray for the iron","2 lb / 32 oz 93/7 lean ground beef","1/2 cup bone broth","SPG or preferred burger seasoning to taste","1 potato waffle","5 oz raw-equivalent seasoned beef + 1.5 slices Velveeta (from portioned container)","Tari hot sauce, to taste","1 regular burger bun","1/2 potato waffle","2.5 oz raw-equivalent seasoned beef + 3/4 slice Velveeta (from portioned container)","Ketchup, to taste"],"recipeInstructions":[{"@type":"HowToStep","name":"Thaw + Squeeze The Hash Browns","text":"Thaw 840g frozen shredded hash browns completely. Wrap in a clean kitchen towel and squeeze firmly until no more water drips out.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-01-thawed-hash-browns-polished.webp"},{"@type":"HowToStep","name":"Build The Corrected Waffle Mix","text":"Combine the dry hash browns, 168g cheddar, 3 tbsp cornstarch, and SPG. Add 240g egg whites and mix. Squeeze a handful: if it holds together, stop. If it falls apart, add 30g more egg whites and retest. Do not exceed ~300g.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-02-add-reduced-fat-cheddar-polished.webp"},{"@type":"HowToStep","name":"Preheat + Load The Iron","text":"Fully preheat the waffle iron. Apply a light, even coat of avocado-oil spray. Divide the mixture into six equal portions.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-06-load-waffle-iron-polished.webp"},{"@type":"HowToStep","name":"Cook Six Crisp Waffles","text":"Add one portion, close firmly, cook 6-8 min per waffle until deeply golden and easy to release. If the iron resists opening, give it another minute. Repeat for all six.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-07-crisp-waffle-reveal-polished.webp"},{"@type":"HowToStep","name":"Brown The Beef","text":"Brown 2 lb 93/7 beef in a wide skillet, breaking it into small crumbles. Season with SPG. Add 1/2 cup bone broth; cook until the liquid has absorbed and the beef is moist but not wet.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-09-season-beef-polished.webp"},{"@type":"HowToStep","name":"Portion 2","text":"1 ACROSS EIGHT CONTAINERS: Divide the cooked beef so every adult container gets twice the beef of a kid container. Creator's raw allocation: 5 oz per adult / 2.5 oz per kid, with a small batch cushion.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-11-portion-eight-servings-polished.webp"},{"@type":"HowToStep","name":"Top With Cold Cheese + Store","text":"1.5 slices Velveeta on each adult beef portion; 3/4 slice on each kid portion. Keep the cheese cold in the container — it melts on reheat.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-12-add-cold-cheese-polished.webp"},{"@type":"HowToStep","name":"Reheat","text":"Microwave the adult beef-and-cheese container ~90 seconds until steaming. Air-fry one potato waffle 6-8 min until crisp.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-13-air-fryer-reheat-waffle-polished.webp"},{"@type":"HowToStep","name":"Build + Tari","text":"Stack the melted beef and cheese on the crisp waffle. Drizzle Tari to taste.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-15-tari-adult-finish-polished.webp"},{"@type":"HowToStep","name":"Reheat","text":"Microwave the kid beef-and-cheese container ~90 seconds. Air-fry half a potato waffle 6 min."},{"@type":"HowToStep","name":"Build Burger + Side Waffle","text":"Stack the melted beef and cheese in a regular bun. Serve with half a crisp waffle on the side and ketchup.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/step-14-kid-bun-and-half-waffle-polished.webp"}],"keywords":"beef, potato-waffle, hash-brown, cheeseburger, meal-prep, viral, proteinized, family-dinner, split-plate, waffle-iron, batch-cook"}</script>

    <noscript><h1>Cheeseburger Potato Waffle Meal Prep — The Split Plate</h1><p>One waffle-iron batch (6 waffles) + one lean-beef skillet + a 2:1 adult:kid portion split → 2 dinners for 4. Adult plate: 1 waffle + 5 oz raw-equivalent 93/7 beef + 1.5 slices Velveeta + Tari. Creator's kid plate: 1 regular bun + half a waffle + 2.5 oz beef + 3/4 slice Velveeta + ketchup. The waffle stays fun; the protein is built around it, not smuggled into it.</p></noscript>
