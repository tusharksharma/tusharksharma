    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Cheeseburger Potato Waffle Meal Prep","description":"One waffle-iron batch (6 waffles) + one lean-beef skillet + a 2:1 adult:kid portion split → 2 dinners for 4. Adult plate: 1 waffle + 5 oz raw-equivalent 93/7 beef + 1.5 slices Velveeta + Tari. Creator's kid plate: 1 regular bun + half a waffle + 2.5 oz beef + 3/4 slice Velveeta + ketchup. The waffle stays fun; the protein is built around it, not smuggled into it.","image":"https://thesplitplate.com/images/cheeseburger-potato-waffle-meal-prep/hero-adult-potato-waffle-cheeseburger-polished.webp","totalTime":"PT70M","recipeYield":"8 servings","nutrition":{"@type":"NutritionInformation","calories":"600 calories","proteinContent":"50g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["840 g frozen shredded hash browns (thawed completely and squeezed very dry)","240-300 g liquid egg whites (start at 240g; add 30g only if needed, max ~300g)","168 g / 6 oz reduced-fat shredded cheddar","3 tbsp cornstarch","SPG (salt, pepper, garlic) to taste — creator used Dan-O's SPG","Light avocado-oil spray for the iron","2 lb / 32 oz 93/7 lean ground beef","1/2 cup bone broth","SPG or preferred burger seasoning to taste","4 potato waffles","20 oz raw-equivalent seasoned beef (5 oz per adult serving)","6 slices Velveeta (1.5 per adult serving)","Tari hot sauce to taste","4 regular burger buns","2 potato waffles, cut in half (4 kid sides)","10 oz raw-equivalent seasoned beef (2.5 oz per kid serving; adjust to appetite)","3 slices Velveeta (3/4 per kid serving)","Ketchup to taste"],"recipeInstructions":[{"@type":"HowToStep","name":"Thaw + Squeeze The Potatoes","text":"Thaw 840g shredded hash browns completely. Wrap in a clean kitchen towel and squeeze firmly until no more water drips out. Crispness starts here."},{"@type":"HowToStep","name":"Build The Corrected Waffle Mix","text":"Combine the dry hash browns, 168g cheddar, 3 tbsp cornstarch, and SPG. Add 240g egg whites and mix. Squeeze a handful: if it holds together, stop. If it falls apart, add 30g more egg whites and retest. Do not exceed ~300g. The filmed batch used 414g and was too wet — do not repeat."},{"@type":"HowToStep","name":"Preheat + Load The Iron","text":"Fully preheat the waffle iron. Apply a light, even coat of avocado-oil spray. Divide the mixture into six equal portions."},{"@type":"HowToStep","name":"Cook Six Crisp Waffles","text":"Add one portion, close firmly, cook 6-8 min per waffle until deeply golden and easy to release. If the iron resists opening, give it another minute. Repeat."},{"@type":"HowToStep","name":"Brown The Beef","text":"Brown 2 lb 93/7 beef in a wide skillet, breaking it into small crumbles. Season with SPG. Add 1/2 cup bone broth; cook until the liquid has absorbed and the beef is moist but not wet."},{"@type":"HowToStep","name":"Portion 2","text":"1 ACROSS EIGHT CONTAINERS: Divide the cooked beef so every adult container gets twice the beef of a kid container. Creator's raw allocation: 5 oz per adult / 2.5 oz per kid. Adjust the kid to your own child's appetite."},{"@type":"HowToStep","name":"Top With Cold Cheese + Store","text":"1.5 slices Velveeta on each adult beef portion; 3/4 slice on each kid portion. Cheese stays cold in the container and melts when the beef reheats."},{"@type":"HowToStep","name":"Reheat + Finish","text":"Microwave the beef and cheese ~90 seconds until steaming. Re-crisp each waffle in the air fryer for 6-8 min. Serve adults on one full waffle with Tari. Creator's kids: normal bun + half a waffle + ketchup."}],"keywords":"beef, potato-waffle, hash-brown, cheeseburger, meal-prep, viral, proteinized, family-dinner, split-plate, waffle-iron, batch-cook"}</script>
