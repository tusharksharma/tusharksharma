    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Taco-Seasoned Air-Fryer Chicken Thighs","description":"Fresh boneless chicken thighs seasoned for tacos and cooked in the air fryer. Portion 1.5 ounces of cooked chicken into each of four adult tacos. Serve each child 2 ounces of cooked chicken deconstructed with guacamole; brush the warm corn tortilla lightly with ghee when a dry tortilla would eat too firm. The recently made High-Protein Cilantro Jalapeño Ranch is an optional adult finish.","image":"https://thesplitplate.com/images/next-day-tacos/split-plate-cover-polished.webp","totalTime":"PT30M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Mexican","recipeIngredient":["1 1/2 lb boneless, skinless chicken thighs, enough to yield at least 16 oz cooked","2 tbsp taco seasoning, or to taste","1 tbsp avocado oil","8 small corn tortillas for the two adult plates","2-4 additional small corn tortillas for the two kid plates, based on appetite","1/2 cup white onion, finely diced","1/4 cup fresh cilantro, chopped","1 tbsp lime juice","Pinch of salt","High-Protein Cilantro Jalapeño Ranch, optional","4 oz cooked taco-seasoned chicken total, 2 oz per child","2 individual guacamole portions, or guacamole to taste","Melted ghee for a very light tortilla brush"],"recipeInstructions":[{"@type":"HowToStep","name":"Season","text":"Pat the thighs dry, coat with avocado oil, and season all over with taco seasoning.","image":"https://thesplitplate.com/images/next-day-tacos/step-season-chicken.webp"},{"@type":"HowToStep","name":"Air-fry","text":"Arrange in one layer. Air-fry at 390°F for about 14-18 minutes, turning once, until the thickest piece reaches at least 165°F. Appliance and thigh thickness change the timing.","image":"https://thesplitplate.com/images/next-day-tacos/step-air-fry-chicken.webp"},{"@type":"HowToStep","name":"Rest + Chop","text":"Rest 5 minutes, then chop into bite-size pieces. Weigh the cooked chicken before building plates.","image":"https://thesplitplate.com/images/next-day-tacos/step-chop-chicken.webp"},{"@type":"HowToStep","name":"Adult Onion-cilantro","text":"Mix the diced onion, cilantro, lime, and salt. Rest 5 minutes to soften the raw-onion edge.","image":"https://thesplitplate.com/images/next-day-tacos/step-onion-cilantro.webp"},{"@type":"HowToStep","name":"Assemble","text":"Warm four tortillas per adult. Add 1.5 oz cooked chicken to each, then cilantro-onion and the optional green sauce.","image":"https://thesplitplate.com/images/next-day-tacos/adult-air-fryer-chicken-tacos.webp"},{"@type":"HowToStep","name":"Soften The Tortilla","text":"Brush very lightly with melted ghee and warm only until pliable.","image":"https://thesplitplate.com/images/next-day-tacos/step-ghee-kid-tortilla.webp"},{"@type":"HowToStep","name":"Plate","text":"Add 2 oz chopped chicken per child. Keep the chicken, guacamole, and tortilla separate; do not pre-assemble.","image":"https://thesplitplate.com/images/next-day-tacos/kid-deconstructed-taco-plate.webp"}],"keywords":"tacos, chicken-thighs, air-fryer, weeknight, kid-friendly, deconstructed, split-cook"}</script>
