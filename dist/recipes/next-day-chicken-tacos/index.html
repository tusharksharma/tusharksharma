    <noscript><h1>Split Plate Next-Day Chicken Tacos — The Split Plate</h1><p>Next-day tacos built on leftover Dan-O's thighs (or store rotisserie). Chop the chicken fine — skin and rendered fat included. Adults get Herdez Avocado Hot Sauce + cilantro-onion salad with lime. Kids get a deconstructed plate with Avocado Cilantro mild sauce as a dip — sauce stays separate so they can commit at their own pace.</p></noscript>
