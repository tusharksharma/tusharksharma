 Chop","text":"Rest 5 minutes, then chop. Reserve 12 oz for the two adult plates and 4 oz for the two kid plates."},{"@type":"HowToStep","name":"Adult Topping","text":"Mix white onion, cilantro, lime, and salt. Rest 5 minutes."},{"@type":"HowToStep","name":"Adult Plate","text":"Warm four corn tortillas per adult. Add 1.5 oz cooked chicken to each taco, then cilantro-onion and optional High-Protein Cilantro Jalapeño Ranch."},{"@type":"HowToStep","name":"Kid Tortilla","text":"Brush lightly with melted ghee and warm only until pliable."},{"@type":"HowToStep","name":"Kid Plate","text":"Serve 2 oz cooked chicken per child, deconstructed with guacamole and the soft tortilla. Keep the components separate."}],"keywords":"tacos, chicken-thighs, air-fryer, weeknight, kid-friendly, deconstructed, split-cook"}</script>
