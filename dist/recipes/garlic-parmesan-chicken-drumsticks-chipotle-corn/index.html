    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Garlic Parmesan Chicken Drumsticks + Chipotle Corn","description":"350 cal / 30g protein per adult plate, 4 servings (2 adults at 2 drumsticks + 1 full ear corn; 2 kids at 1 drumstick + 1/2 ear corn + cucumber). 6 chicken drumsticks dry-rubbed with Dan-O's Cheesoning + baking powder + garlic powder + salt + paprika. 3 ears shucked corn roasted on the same wire-rack-over-sheet-pan setup. 425°F for ~40 min until drumsticks hit 175°F+ for tenderness and the skin is crisp-brown. Adult plate: 2 drumsticks + 1 full ear corn + 1 tbsp Smoky Chipotle Crema drizzle on the corn. Kid plate: 1 drumstick + 1/2 ear corn + cucumber sticks + 1/2 tbsp Chosen Foods mayo on the side.","image":"https://thesplitplate.com/images/garlic-parmesan-chicken-drumsticks-chipotle-corn/split-adult-kid-plates-polished.webp","totalTime":"PT50M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"350 calories","proteinContent":"30g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["6 chicken drumsticks (bone-in, skin-on)","1 tbsp Clabber Girl Baking Powder","1 tsp garlic powder","1 tsp kosher salt","1 tsp paprika","2 tbsp Dan-O's Cheesoning","3 ears corn, shucked","2 tbsp Smoky Chipotle Crema total (1 tbsp per adult plate, drizzled over corn)","1 tbsp Chosen Foods Classic Mayo total (1/2 tbsp per kid plate, on the side)","1 small Persian or English cucumber, sliced into sticks (kid plates only)"],"recipeInstructions":[{"@type":"HowToStep","name":"Preheat + Rack","text":"Oven to 425°F. Wire rack set over a rimmed sheet pan."},{"@type":"HowToStep","name":"Pat Dry","text":"Paper-towel all 6 drumsticks aggressively — the drier the skin, the crispier the result. Wet skin steams."},{"@type":"HowToStep","name":"Mix Rub","text":"In a small bowl combine 1 tbsp baking powder + 1 tsp garlic powder + 1 tsp salt + 1 tsp paprika + 2 tbsp Dan-O's Cheesoning. Stir."},{"@type":"HowToStep","name":"Season","text":"Sprinkle the rub from a few inches above the drumsticks, then pat it into every side with your hands. Coat top, bottom, and the ends. No bald spots."},{"@type":"HowToStep","name":"Rack The Pan","text":"Drumsticks on the wire rack, 1 inch apart. Tuck the 3 ears of shucked corn alongside on the same rack. Don't crowd."},{"@type":"HowToStep","name":"Roast · 425°f · 40 Min — no Flipping","text":"Middle rack. Don't open the oven for 35 min. At 35 min probe the thickest drumstick at the bone; pull at 175°F+ for fall-off-bone tenderness."},{"@type":"HowToStep","name":"Adult Plate","text":"2 drumsticks + 1 full ear of corn. Drizzle 1 tbsp Smoky Chipotle Crema over the corn."},{"@type":"HowToStep","name":"Kid Plate","text":"1 drumstick + 1/2 ear of corn (cut crosswise) + cucumber sticks. Small puddle of 1/2 tbsp Chosen Foods mayo on the side. NO chipotle crema."},{"@type":"HowToStep","name":"Eat While Hot","text":"Drumsticks are crispiest in the first 5 min off the oven. Don't let the plate sit."}],"keywords":"chicken, drumsticks, sheet-pan, split-cook, weeknight, high-protein, garlic-parm, corn, gluten-free, kid-friendly"}</script>

    <noscript><h1>Garlic Parmesan Chicken Drumsticks + Chipotle Corn — The Split Plate</h1><p>350 cal / 30g protein per adult plate, 4 servings (2 adults at 2 drumsticks + 1 full ear corn; 2 kids at 1 drumstick + 1/2 ear corn + cucumber). 6 chicken drumsticks dry-rubbed with Dan-O's Cheesoning + baking powder + garlic powder + salt + paprika. 3 ears shucked corn roasted on the same wire-rack-over-sheet-pan setup. 425°F for ~40 min until drumsticks hit 175°F+ for tenderness and the skin is crisp-brown. Adult plate: 2 drumsticks + 1 full ear corn + 1 tbsp Smoky Chipotle Crema drizzle on the corn. Kid plate: 1 drumstick + 1/2 ear corn + cucumber sticks + 1/2 tbsp Chosen Foods mayo on the side.</p></noscript>
