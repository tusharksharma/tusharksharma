sides. Use your hands.","image":"https://thesplitplate.com/images/garlic-parmesan-chicken-drumsticks-chipotle-corn/step-season-drumsticks-polished.webp"},{"@type":"HowToStep","name":"Rack The Pan","text":"Place drumsticks on the wire rack 1 inch apart. Tuck the 3 ears of shucked corn alongside on the same rack. Don't crowd — every piece needs airflow.","image":"https://thesplitplate.com/images/garlic-parmesan-chicken-drumsticks-chipotle-corn/step-rack-chicken-corn-polished.webp"},{"@type":"HowToStep","name":"Roast 425°f · 40 Min — no Flipping","text":"Slide the pan into the middle rack. Don't open the oven for 35 minutes. At 35 min, probe the thickest drumstick at the bone — target 175°F+ for fall-off-bone tenderness (not 165°F). If under, give it 5 more minutes.","image":"https://thesplitplate.com/images/garlic-parmesan-chicken-drumsticks-chipotle-corn/step-oven-roast-polished.webp"},{"@type":"HowToStep","name":"Adult Plate","text":"White plate. 2 drumsticks + 1 full ear of corn. Drizzle 1 tbsp Smoky Chipotle Crema over the corn (NOT on the chicken — the parm rub is already loud).","image":"https://thesplitplate.com/images/garlic-parmesan-chicken-drumsticks-chipotle-corn/hero-final-plate-polished.webp"},{"@type":"HowToStep","name":"Eat While Hot","text":"Drumsticks are crispy at 5 min off the oven, chewy at 15 min. Don't let the plate sit. The chipotle crema is room-temp — pour cold straight from the squeeze bottle."},{"@type":"HowToStep","name":"Kid Plate","text":"Small plate. 1 drumstick + 1/2 ear of corn (cut the ear in half crosswise — easier for small hands). Cucumber sticks alongside. Small puddle of 1/2 tbsp mayo on the plate for dipping."},{"@type":"HowToStep","name":"Assembly (kid Leads)","text":"Most kids eat the drumstick first, graze the corn, dip cucumber in the mayo. Some skip the corn — that's fine. Cucumber sticks are the reset palate."}],"keywords":"chicken, drumsticks, sheet-pan, split-cook, weeknight, high-protein, garlic-parm, corn, gluten-free, kid-friendly"}</script>

    <noscript><h1>Garlic Parmesan Chicken Drumsticks + Chipotle Corn — The Split Plate</h1><p>350 cal / 30g protein per adult plate, 4 servings (2 adults at 2 drumsticks + 1 full ear corn; 2 kids at 1 drumstick + 1/2 ear corn + cucumber). 6 chicken drumsticks dry-rubbed with Dan-O's Cheesoning + baking powder + garlic powder + salt + paprika. 3 ears shucked corn roasted on the same wire-rack-over-sheet-pan setup. 425°F for ~40 min until drumsticks hit 175°F+ for tenderness and the skin is crisp-brown. Adult plate: 2 drumsticks + 1 full ear corn + 1 tbsp Smoky Chipotle Crema drizzle on the corn. Kid plate: 1 drumstick + 1/2 ear corn + cucumber sticks + 1/2 tbsp Chosen Foods mayo on the side.</p></noscript>
