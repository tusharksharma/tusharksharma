    <noscript><h1>Freezer Shortcut Beef Kebab Pitas — The Split Plate</h1><p>~400 cal / 30g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get a loaded pita: quick tzatziki (0% Greek yogurt + drained shredded cucumber + frozen garlic + lemon), shredded iceberg, halved cherry tomatoes, pickled red onion, 2 fully-cooked Mediterranean beef kebabs air-fried 7-8 min, Shuug Original Harissa. Kids get a tray with pita wedges, salad, ~2 tbsp hummus, and 1 kebab to start (offer more per appetite — the photographed 7-year-old asked for a second). Frozen garlic is the no-waste shortcut. Kid macros intentionally not published — hummus quantity + kid appetite vary. HALAL / SOY-FREE / NUT-FREE label claims require verifying the specific kebab / hummus / pita packages before publishing.</p></noscript>
