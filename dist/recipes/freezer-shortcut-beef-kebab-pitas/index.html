    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Freezer Shortcut Beef Kebab Pitas","description":"~400 cal / 30g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get a loaded pita: quick tzatziki (0% Greek yogurt + drained shredded cucumber + frozen garlic + lemon), shredded iceberg, halved cherry tomatoes, pickled red onion, 2 fully-cooked Mediterranean beef kebabs air-fried 7-8 min, Shuug Original Harissa. Kids get a tray with pita wedges, salad, ~2 tbsp hummus, and 1 kebab to start (offer more per appetite — the photographed 7-year-old asked for a second). Frozen garlic is the no-waste shortcut. Kid macros intentionally not published — hummus quantity + kid appetite vary. HALAL / SOY-FREE / NUT-FREE label claims require verifying the specific kebab / hummus / pita packages before publishing.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/hero-split-adult-kid-plates-polished.webp","totalTime":"PT20M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"Middle Eastern","recipeIngredient":["6 fully cooked Mediterranean beef kebabs (keep 2 more available for hungry kids — 8 total from a 24 oz Costco pack)","4 pita breads","1 small 5.3 oz / 150g container plain 0% Greek yogurt","1/2 cucumber, shredded and squeezed VERY dry","3-4 cloves' worth frozen garlic, thawed","1 tbsp lemon juice","Salt, to taste","~2 cups shredded iceberg lettuce","~1 cup halved cherry / grape tomatoes","~1/3 cup pickled red onions","Avocado oil spray (kebab air-fry + pita warm)","Shuug Original Harissa Hot Sauce, to taste","~2 tbsp prepared hummus per kid (sub tzatziki if the kid likes it; adult tray works either way)","(NO Shuug — adult-only)"],"recipeInstructions":[{"@type":"HowToStep","name":"Thaw","text":"Thaw the sealed kebab pouch overnight in the fridge (do this the night before — day-of shortcut works for the tzatziki and assembly, not for the frozen protein).","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/context-beef-kebabs-polished.webp"},{"@type":"HowToStep","name":"Tzatziki — Yogurt","text":"Empty the 5.3 oz Greek yogurt container into a bowl.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/step-01-add-greek-yogurt.webp"},{"@type":"HowToStep","name":"Tzatziki — Cucumber","text":"Shred 1/2 cucumber, salt lightly, wait 5 min, then wring VERY dry in a clean tea towel. Add to the yogurt.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/step-02-add-drained-cucumber.webp"},{"@type":"HowToStep","name":"Tzatziki — Lemon + Garlic","text":"Add 1 tbsp lemon juice + 3-4 frozen garlic cubes (thawed) + salt to taste.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/step-03-add-lemon-and-garlic.webp"},{"@type":"HowToStep","name":"Tzatziki — Mix","text":"Stir until thick and evenly combined. Refrigerate until plating.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/step-04-mix-quick-tzatziki-polished.webp"},{"@type":"HowToStep","name":"Air Fry The Kebabs","text":"Lightly mist the (thawed) kebabs with avocado oil and air fry 7-8 min per the CURRENT PACKAGE TEMPERATURE (physical package = source of truth; brands vary). Kebabs should be thoroughly hot with a light char at 8 min.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/step-05-air-fry-beef-kebabs-polished.webp"},{"@type":"HowToStep","name":"Warm The Pitas","text":"Lightly mist and warm the pitas 20-30 sec per side (dry pan or air fryer). Cut 2 pitas into wedges for the kids' trays."},{"@type":"HowToStep","name":"Build The Adult Pita","text":"Warm pita → generous smear of tzatziki → shredded iceberg → halved cherry tomatoes → pickled red onion → 2 air-fried beef kebabs → drizzle of Shuug to taste. Half-fold and eat immediately.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/step-06-build-adult-pita-polished.webp"},{"@type":"HowToStep","name":"Build The Kid Tray","text":"Warmed pita cut into wedges → shredded iceberg → halved cherry tomatoes → ~2 tbsp hummus in a separate compartment → 1 kebab to the side. Offer a second kebab per appetite.","image":"https://thesplitplate.com/images/freezer-shortcut-beef-kebab-pitas/step-07-build-kid-tray-polished.webp"},{"@type":"HowToStep","name":"Offer More on Hunger","text":"Keep 2 more warm kebabs available (8 total from the 24 oz Costco pack) in case kids want seconds. The photographed 7-year-old asked for a second — real appetite data."}],"keywords":"beef, kebab, pita, mediterranean, weeknight, split-plate, air-fryer, freezer-shortcut, family-dinner, kid-approved, assembly, 20-min"}</script>

    <noscript><h1>Freezer Shortcut Beef Kebab Pitas — The Split Plate</h1><p>~400 cal / 30g protein per adult plate, 4 servings (2 adults + 2 kids). Adults get a loaded pita: quick tzatziki (0% Greek yogurt + drained shredded cucumber + frozen garlic + lemon), shredded iceberg, halved cherry tomatoes, pickled red onion, 2 fully-cooked Mediterranean beef kebabs air-fried 7-8 min, Shuug Original Harissa. Kids get a tray with pita wedges, salad, ~2 tbsp hummus, and 1 kebab to start (offer more per appetite — the photographed 7-year-old asked for a second). Frozen garlic is the no-waste shortcut. Kid macros intentionally not published — hummus quantity + kid appetite vary. HALAL / SOY-FREE / NUT-FREE label claims require verifying the specific kebab / hummus / pita packages before publishing.</p></noscript>
