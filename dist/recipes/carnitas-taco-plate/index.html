    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Carnitas Taco Plate","description":"565 cal / 30g protein / 29g fat / 42g net carbs per adult plate, 4 servings from 1 Del Real tray (2 adults at 5 oz carnitas + 2 kids at 2.5 oz). Del Real Slow-Cooked Carnitas dropped frozen into a stainless skillet, rendered fat drained after the initial sear, then shredded + re-braised with 1/4 cup Kirkland Sipping Bone Broth under a glass lid for 3 min. Mission Yellow Corn Tortillas (Super Soft) warmed in a dry skillet. Adults plate: white plate, carnitas in a small bowl, Wholly Guacamole Classic Mini in a ramekin, Mezzetta Pickled Red Onions in a deli cup, Lucky Dog Hot Sauce on the side, 3-4 tortillas to assemble. Kids plate: compartment tray — large compartment for tortillas (2-3), small compartment for carnitas, small compartment for Wholly mini. No onions, no hot sauce. Both assemble at the table.","image":"https://thesplitplate.com/images/carnitas-taco-plate/split-plate-build-your-own-polished.webp","totalTime":"PT15M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"565 calories","proteinContent":"30g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["1 tray (15 oz) Del Real Slow-Cooked Carnitas","1/4 cup Kirkland Organic Chicken Sipping Bone Broth [braise]","10-14 Mission Yellow Corn Tortillas Super Soft","4 Wholly Guacamole Classic Minis (1 cup per plate)","2-4 tbsp Mezzetta Pickled Red Onions [adult]","Lucky Dog Hot Sauce, to taste [adult]"],"recipeInstructions":[{"@type":"HowToStep","name":"Mise en Place","text":"Open Del Real tray, Wholly Guacamole minis on counter (1 per plate), Mission tortilla bag open, Kirkland bone broth pouch ready. Adult side: Mezzetta + Lucky Dog out."},{"@type":"HowToStep","name":"Sear Frozen Blocks","text":"Stainless skillet over medium-high. Drop the Del Real carnitas straight from the tray into the dry hot pan (frozen, not thawed). 2 min undisturbed — bottom contact-sears."},{"@type":"HowToStep","name":"Drain Fat","text":"Tip the pan, spoon out 2-3 tbsp rendered fat into a heat-safe bowl. Discard. This is the calorie lever."},{"@type":"HowToStep","name":"Shred + Braise With Broth","text":"Tongs shred the meat (medium pieces). Pour in 1/4 cup Kirkland Sipping Bone Broth. Glass lid on. 2-3 min until broth mostly evaporates."},{"@type":"HowToStep","name":"Dry The Surface","text":"Lid off. 60 sec on medium. Stir once. Meat should look glossy-moist. Off heat."},{"@type":"HowToStep","name":"Warm Tortillas","text":"Dry skillet over medium. Corn tortillas 30 sec/side. Hold warm under a clean towel."},{"@type":"HowToStep","name":"Adult Plate","text":"White dinner plate. Small bowl of carnitas in the center (5 oz). Ramekin with Wholly Guacamole mini squeezed in. Deli cup with pickled onions. Stack of 3-4 warm tortillas alongside. Lucky Dog bottle on the side."},{"@type":"HowToStep","name":"Kid Tray","text":"Compartment tray. Large compartment: 2-3 warm tortillas. Small compartment 1: 2.5 oz carnitas. Small compartment 2: Wholly Guacamole mini squeezed in. NO onions, NO hot sauce."},{"@type":"HowToStep","name":"Everyone Assembles at The Table. Adults","text":"tortilla → carnitas → guac smear → pickled onions → hot sauce dashes. Kids: build their own taco order, scoop their own guac. Parent doesn't pre-fold."}],"keywords":"tacos, carnitas, pork, split-cook, build-your-own, weeknight, fastest, mexican, gluten-free"}</script>

    <noscript><h1>Carnitas Taco Plate — The Split Plate</h1><p>565 cal / 30g protein / 29g fat / 42g net carbs per adult plate, 4 servings from 1 Del Real tray (2 adults at 5 oz carnitas + 2 kids at 2.5 oz). Del Real Slow-Cooked Carnitas dropped frozen into a stainless skillet, rendered fat drained after the initial sear, then shredded + re-braised with 1/4 cup Kirkland Sipping Bone Broth under a glass lid for 3 min. Mission Yellow Corn Tortillas (Super Soft) warmed in a dry skillet. Adults plate: white plate, carnitas in a small bowl, Wholly Guacamole Classic Mini in a ramekin, Mezzetta Pickled Red Onions in a deli cup, Lucky Dog Hot Sauce on the side, 3-4 tortillas to assemble. Kids plate: compartment tray — large compartment for tortillas (2-3), small compartment for carnitas, small compartment for Wholly mini. No onions, no hot sauce. Both assemble at the table.</p></noscript>
