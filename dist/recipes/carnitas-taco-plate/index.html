 squeezed-in Wholly Guacamole mini. Deli cup with 1-2 tbsp pickled onions (let the brine show). Stack 3-4 warm tortillas next to the plate. Lucky Dog bottle on the side.","image":"https://thesplitplate.com/images/carnitas-taco-plate/split-plate-build-your-own-polished.webp"},{"@type":"HowToStep","name":"Assemble at The Table","text":"One tortilla at a time. Carnitas first, guac smear, pickled onions on top, hot sauce dashes. Eat over the plate (corn tortillas drip). Repeat. 3-4 tacos per plate."},{"@type":"HowToStep","name":"Kid Tray","text":"Compartment tray on the table. Large compartment: 2-3 warm tortillas stacked. Small compartment 1: 2.5 oz shredded carnitas. Small compartment 2: squeezed-in Wholly Guacamole mini. Hand the kid the tray + a small spoon for scooping guac.","image":"https://thesplitplate.com/images/carnitas-taco-plate/split-plate-build-your-own-polished.webp"},{"@type":"HowToStep","name":"Assembly (kid Leads)","text":"Most kids pick up a tortilla first, then ask 'meat or guac?' Let them choose. Some will spoon guac directly off the tray and eat it like dip with tortilla as the dipper. Either works — the components are the same calories."}],"keywords":"tacos, carnitas, pork, split-cook, build-your-own, weeknight, fastest, mexican, gluten-free"}</script>

    <noscript><h1>Carnitas Taco Plate — The Split Plate</h1><p>565 cal / 30g protein / 29g fat / 42g net carbs per adult plate, 4 servings from 1 Del Real tray (2 adults at 5 oz carnitas + 2 kids at 2.5 oz). Del Real Slow-Cooked Carnitas dropped frozen into a stainless skillet, rendered fat drained after the initial sear, then shredded + re-braised with 1/4 cup Kirkland Sipping Bone Broth under a glass lid for 3 min. Mission Yellow Corn Tortillas (Super Soft) warmed in a dry skillet. Adults plate: white plate, carnitas in a small bowl, Wholly Guacamole Classic Mini in a ramekin, Mezzetta Pickled Red Onions in a deli cup, Lucky Dog Hot Sauce on the side, 3-4 tortillas to assemble. Kids plate: compartment tray — large compartment for tortillas (2-3), small compartment for carnitas, small compartment for Wholly mini. No onions, no hot sauce. Both assemble at the table.</p></noscript>
