    <noscript><h1>Carnitas Taco Plate — The Split Plate</h1><p>565 cal / 30g protein / 29g fat / 42g net carbs per adult plate, 4 servings from 1 Del Real tray (2 adults at 5 oz carnitas + 2 kids at 2.5 oz). Del Real Slow-Cooked Carnitas dropped frozen into a stainless skillet, rendered fat drained after the initial sear, then shredded + re-braised with 1/4 cup Kirkland Sipping Bone Broth under a glass lid for 3 min. Mission Yellow Corn Tortillas (Super Soft) warmed in a dry skillet. Adults plate: white plate, carnitas in a small bowl, Wholly Guacamole Classic Mini in a ramekin, Mezzetta Pickled Red Onions in a deli cup, Lucky Dog Hot Sauce on the side, 3-4 tortillas to assemble. Kids plate: compartment tray — large compartment for tortillas (2-3), small compartment for carnitas, small compartment for Wholly mini. No onions, no hot sauce. Both assemble at the table.</p></noscript>
