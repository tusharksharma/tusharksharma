    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Herb-Garlic Pork Chops + Cowboy Butter Drizzle","description":"4 boneless 6-oz pork loin chops marinated in olive oil + 8 garlic cloves + 2 tbsp soy + 1 tbsp Worcestershire + 1 tbsp Dijon + 1.5 tbsp fresh rosemary + 1.5 tbsp fresh thyme + smoked paprika + chili flakes + lemon. Pan-seared medium-high until deeply colored. Side: snap peas tossed with food-processed Kirkland Parmigiano Stravecchio + crushed Corn Chex (2 tbsp parm + 4 tbsp chex), roasted 18 min. Sauce: Cowboy Butter (Laughing Cow + bone broth + Parm + garlic + lemon + Dijon + Worcestershire + paprika + a pat of butter) — adults get parsley + chives + chili flakes folded in; kids get the plain cream base in their dip well. Adults eat the chop sliced over the peas with sauce drizzled in cross-hatches; kids eat diced pork + peas + sauce on the side.","image":"https://thesplitplate.com/images/pork-chops-cowboy/hero.webp","totalTime":"PT30M","recipeYield":"4","author":{"@type":"Person","name":"Tushar Sharma","url":"https://thesplitplate.com/about"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["4 boneless pork loin chops, 1-inch thick (~6 oz each = 24 oz total)","2 tbsp olive oil","8 garlic cloves, minced","2 tbsp Kikkoman All-Purpose Soy Sauce","1 tbsp Lea & Perrins Worcestershire Sauce","1 tbsp Smash Kitchen Dijon Mustard","1.5 tbsp fresh rosemary, finely chopped","1.5 tbsp fresh thyme leaves","1.5 tsp smoked paprika","1 tsp chili flakes","1 tsp black pepper","1 tsp salt","1 lemon, juiced","2 cups fresh sugar snap peas, trimmed","Olive oil spray","2 tbsp food-processed Kirkland Parmigiano Stravecchio (from a wedge)","4 tbsp crushed Corn Chex (pulse in food processor)","Pinch salt + black pepper","2 tbsp fresh parsley, finely chopped","1 tbsp fresh chives, finely chopped","Extra chili flakes (to taste)","Full Cowboy Butter recipe (cross-link → )","Plain Cowboy Butter (1/3 of the batch, set aside BEFORE folding in herbs)"],"recipeInstructions":[{"@type":"HowToStep","name":"Pat + Dry (if Time)","text":"Chops on a rack in the fridge uncovered for 1-2 hr. Surface dry = real sear."},{"@type":"HowToStep","name":"Marinate","text":"Whisk all marinade ingredients in a large bowl. Add chops, flip to coat. 30 min min, 2 hr ideal.","image":"https://thesplitplate.com/images/pork-chops-cowboy/step1-marinade.webp"},{"@type":"HowToStep","name":"Prep The Crust","text":"Food-process 2 oz Kirkland Parmigiano Stravecchio into coarse grated. Pulse 4 tbsp Corn Chex in the same processor into coarse crumbs.","image":"https://thesplitplate.com/images/pork-chops-cowboy/step2-parm-grind.webp"},{"@type":"HowToStep","text":"PREHEAT OVEN 425°F. Toss snap peas with oil spray + Parm + crushed Chex + salt in a bowl, then spread on parchment-lined sheet pan.","image":"https://thesplitplate.com/images/pork-chops-cowboy/step3-peas-oven.webp"},{"@type":"HowToStep","name":"Bake Peas","text":"18-22 min until deep golden + crispy edges.","image":"https://thesplitplate.com/images/pork-chops-cowboy/step4-peas-done.webp"},{"@type":"HowToStep","name":"Sear The Chops","text":"Stainless or cast iron, medium-HIGH, 2 tsp oil. Lay chops away from you, DON'T MOVE for 4 min. Flip once. 3-4 min side 2. Pull at internal 145°F. Rest 5 min.","image":"https://thesplitplate.com/images/pork-chops-cowboy/step5-sear-sauce.webp"},{"@type":"HowToStep","name":"Slice The Chop","text":"1 chop per adult, sliced thin across the grain."},{"@type":"HowToStep","name":"Plate","text":"Sliced chop over crusted snap peas in a wide bowl. Drizzle adult Cowboy Butter (the parsley + chives + chili flakes one) cross-hatched over the top. DON'T POUR — the pattern is the visual.","image":"https://thesplitplate.com/images/pork-chops-cowboy/hero.webp"},{"@type":"HowToStep","text":"DICE 1/2 CHOP per kid into 1/2-inch cubes. Trim off the heaviest char if your kid rejects visible burn."},{"@type":"HowToStep","name":"Plate Into 3-compartment Tray","text":"Diced chop in compartment 1, crusted snap peas in compartment 2, plain Cowboy Butter (the 1/3 you pulled before the herb fold) in the dip well."}],"keywords":"pork-chops, pan-seared, cowboy-butter, low-carb, split-cook, weeknight, herb-marinade"}</script>

    <noscript><h1>Herb-Garlic Pork Chops + Cowboy Butter Drizzle — The Split Plate</h1><p>4 boneless 6-oz pork loin chops marinated in olive oil + 8 garlic cloves + 2 tbsp soy + 1 tbsp Worcestershire + 1 tbsp Dijon + 1.5 tbsp fresh rosemary + 1.5 tbsp fresh thyme + smoked paprika + chili flakes + lemon. Pan-seared medium-high until deeply colored. Side: snap peas tossed with food-processed Kirkland Parmigiano Stravecchio + crushed Corn Chex (2 tbsp parm + 4 tbsp chex), roasted 18 min. Sauce: Cowboy Butter (Laughing Cow + bone broth + Parm + garlic + lemon + Dijon + Worcestershire + paprika + a pat of butter) — adults get parsley + chives + chili flakes folded in; kids get the plain cream base in their dip well. Adults eat the chop sliced over the peas with sauce drizzled in cross-hatches; kids eat diced pork + peas + sauce on the side.</p></noscript>
