    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Herb-Garlic Pork Chops + Cowboy Butter Drizzle","description":"4 boneless 6-oz pork loin chops marinated in olive oil + 8 garlic cloves + 2 tbsp soy + 1 tbsp Worcestershire + 1 tbsp Dijon + 1.5 tbsp fresh rosemary + 1.5 tbsp fresh thyme + smoked paprika + chili flakes + lemon. Pan-seared medium-high until deeply colored. Side: snap peas tossed with food-processed Kirkland Parmigiano Stravecchio + crushed Corn Chex (2 tbsp parm + 4 tbsp chex), roasted 18 min. Sauce: Cowboy Butter (Laughing Cow + bone broth + Parm + garlic + lemon + Dijon + Worcestershire + paprika + a pat of butter) — adults get parsley + chives + chili flakes folded in; kids get the plain cream base in their dip well. Adults eat the chop sliced over the peas with sauce drizzled in cross-hatches; kids eat diced pork + peas + sauce on the side.","image":"https://thesplitplate.com/images/pork-chops-cowboy/hero.webp","totalTime":"PT30M","recipeYield":"4 servings","nutrition":{"@type":"NutritionInformation","calories":"450 calories","proteinContent":"50g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["4 boneless pork loin chops, 1-inch thick (~6 oz each)","2 tbsp olive oil","8 garlic cloves, minced","2 tbsp Kikkoman All-Purpose Soy Sauce","1 tbsp Lea & Perrins Worcestershire Sauce","1 tbsp Smash Kitchen Dijon Mustard","1.5 tbsp fresh rosemary, finely chopped","1.5 tbsp fresh thyme leaves","1.5 tsp smoked paprika","1 tsp chili flakes","1 tsp black pepper","1 tsp salt","1 lemon, juiced","Parmesan Corn Chex Snap Peas (full side recipe → )","Cowboy Butter (full sauce recipe — adult gets parsley + chives + chili flakes folded in, kid gets plain → )"],"recipeInstructions":[{"@type":"HowToStep","name":"Pat + Dry (ideal)","text":"Chops on a rack in the fridge uncovered for 1-2 hr. Skip if rushed, but the sear suffers."},{"@type":"HowToStep","name":"Marinate","text":"Whisk all marinade ingredients in a large bowl. Add chops, flip to coat. 30 min minimum."},{"@type":"HowToStep","name":"Prep The Parm Crust","text":"Food-process 2 oz Kirkland Parmigiano Stravecchio into coarse grated. Pulse Corn Chex in same processor into coarse crumbs."},{"@type":"HowToStep","text":"PREHEAT OVEN 425°F. Toss snap peas with oil spray + Parm + Chex + salt in a bowl, spread on parchment."},{"@type":"HowToStep","name":"Bake Peas","text":"18-22 min, deep golden + crispy edges."},{"@type":"HowToStep","name":"Sear Chops","text":"Medium-high pan, 2 tsp oil. Chops down, DON'T MOVE 4 min. Flip once. 3-4 min side 2. Internal 145°F. Rest 5 min."},{"@type":"HowToStep","name":"Cowboy Butter","text":"Build in small saucepan (see /cookbook/cowboy-butter for full method). Spoon 1/3 into a small bowl for kids (PLAIN). Into the remaining 2/3, fold 2 tbsp parsley + 1 tbsp chives + chili flakes for adults."},{"@type":"HowToStep","name":"Plate","text":"Adult — slice 1 chop thin, lay over snap peas in a bowl, drizzle adult Cowboy Butter cross-hatched. Kid — dice 1/2 chop, 3-compartment tray with diced pork + snap peas + plain Cowboy Butter in the dip well."}],"keywords":"pork-chops, pan-seared, cowboy-butter, low-carb, split-cook, weeknight, herb-marinade"}</script>

    <noscript><h1>Herb-Garlic Pork Chops + Cowboy Butter Drizzle — The Split Plate</h1><p>4 boneless 6-oz pork loin chops marinated in olive oil + 8 garlic cloves + 2 tbsp soy + 1 tbsp Worcestershire + 1 tbsp Dijon + 1.5 tbsp fresh rosemary + 1.5 tbsp fresh thyme + smoked paprika + chili flakes + lemon. Pan-seared medium-high until deeply colored. Side: snap peas tossed with food-processed Kirkland Parmigiano Stravecchio + crushed Corn Chex (2 tbsp parm + 4 tbsp chex), roasted 18 min. Sauce: Cowboy Butter (Laughing Cow + bone broth + Parm + garlic + lemon + Dijon + Worcestershire + paprika + a pat of butter) — adults get parsley + chives + chili flakes folded in; kids get the plain cream base in their dip well. Adults eat the chop sliced over the peas with sauce drizzled in cross-hatches; kids eat diced pork + peas + sauce on the side.</p></noscript>
