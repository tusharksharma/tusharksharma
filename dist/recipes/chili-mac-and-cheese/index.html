    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chili Mac and Cheese","description":"~380 cal / 39g protein per adult container. 8 meal-prep containers: 4 adult (2 oz dry Carbe Diem elbows + 1 full chili serving + one-quarter of the adult sauce build) + 4 kid (1.5 oz dry Barilla regular elbows + half a chili serving + one-quarter of the kid sauce build). Blended cottage-cheese sauce (cottage cheese + Fairlife + nutritional yeast + cheddar powder) split 2:1 into adult and kid pots. Velveeta melts in per pot (2 oz adult / 1 oz kid). Reserved Hot Dog Chili Base folds in (4 full servings adult pot / 2 full-serving equivalents split across 4 kid containers = half chili serving per kid). Bone broth loosens to creamy. Kid macros intentionally not published — cottage cheese fat percentage was not label-verified. Reheats to 165°F all week with a small splash of milk or bone broth if the sauce tightens.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/hero-adult-kid-chili-mac-containers-polished.webp","totalTime":"PT35M","recipeYield":"8 servings","nutrition":{"@type":"NutritionInformation","calories":"380 calories","proteinContent":"39g"},"author":{"@type":"Person","name":"The Split Plate"},"publisher":{"@type":"Organization","name":"The Split Plate","url":"https://thesplitplate.com"},"recipeCategory":"Dinner","recipeCuisine":"American","recipeIngredient":["12 oz picanha steaks (6 oz per adult) [adult]","4 fully-cooked chicken breakfast patties (Amylu, 2 per kid) [kid]","3 label servings Whole Foods Market European Greens with Basil & Garlic Sauce, or comparable frozen blend","2 label servings prepared chimichurri (Fotis Fine Foods from Costco, 1 per adult). Homemade alternative: No-Judge Chimichurri.","2 slider buns (1 per kid, split + toasted) [kid]","Salt, to taste","Avocado-oil cooking spray"],"recipeInstructions":[{"@type":"HowToStep","name":"Salt The Picanha","text":"Season both sides of 12 oz picanha with salt. No pepper, no rub — the chimichurri does the flavor work."},{"@type":"HowToStep","name":"Start The Greens","text":"3 label servings frozen European greens into a medium skillet. Cook per package (~6-8 min medium, stirring occasionally). Basil-and-garlic sauce is built in."},{"@type":"HowToStep","name":"Sear The Picanha","text":"Second skillet medium-high, avocado spray, add the picanha. Press briefly for full pan contact. Sear + flip until browned and cooked to preferred doneness."},{"@type":"HowToStep","name":"Doneness + Safety (read Both)","text":"Creator pulls at 135°F for medium — the video honestly notes this cook landed closer to medium-well. USDA FSIS recommends cooking whole beef steaks to at least 145°F and resting for at least 3 min before carving. Present as two separate choices; do not treat 135°F as a food-safety minimum."},{"@type":"HowToStep","name":"Rest The Picanha","text":"Transfer to a board. Rest 5+ min while the greens finish and the kid patties + buns cook in the steak skillet."},{"@type":"HowToStep","name":"Reheat Kid Patties in The Steak Skillet","text":"Drop 4 Amylu chicken breakfast patties into the same skillet on medium heat. 2-3 min per side per package."},{"@type":"HowToStep","name":"Toast The Slider Buns","text":"Cut heat to medium-low. Split 2 slider buns, place cut-side-down in the residual beef fat for 60 sec until golden."},{"@type":"HowToStep","name":"Slice The Picanha","text":"Thin against the grain. Chop the chicken patties into age-appropriate pieces for the kid plates."},{"@type":"HowToStep","name":"Plate Adults","text":"6 oz sliced picanha + 1 serving basil-garlic frozen greens + 1 serving chimichurri spooned over the steak. Stir the jar thoroughly first — oil separates."},{"@type":"HowToStep","name":"Plate Kids","text":"Divided tray. 2 chopped chicken patties in one compartment, 1/2 serving greens in another, 1 toasted slider bun in a third. No forced sandwich build — each kid decides whether to assemble or eat separately."}],"keywords":"picanha, steak, beef, chimichurri, frozen-vegetables, costco-shortcut, split-cook, family-dinner, weeknight, under-30"}</script>

    <noscript><h1>Chili Mac and Cheese — The Split Plate</h1><p>~380 cal / 39g protein per adult container. 8 meal-prep containers: 4 adult (2 oz dry Carbe Diem elbows + 1 full chili serving + one-quarter of the adult sauce build) + 4 kid (1.5 oz dry Barilla regular elbows + half a chili serving + one-quarter of the kid sauce build). Blended cottage-cheese sauce (cottage cheese + Fairlife + nutritional yeast + cheddar powder) split 2:1 into adult and kid pots. Velveeta melts in per pot (2 oz adult / 1 oz kid). Reserved Hot Dog Chili Base folds in (4 full servings adult pot / 2 full-serving equivalents split across 4 kid containers = half chili serving per kid). Bone broth loosens to creamy. Kid macros intentionally not published — cottage cheese fat percentage was not label-verified. Reheats to 165°F all week with a small splash of milk or bone broth if the sauce tightens.</p></noscript>
