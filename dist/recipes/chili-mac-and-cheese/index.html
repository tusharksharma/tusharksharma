oz Velveeta Original","1/8 cup Kirkland chicken bone broth"],"recipeInstructions":[{"@type":"HowToStep","name":"Blend The Sauce Base","text":"Cottage cheese + Fairlife into a blender until mostly smooth. Add nutritional yeast + cheddar powder. Blend again until completely smooth and pourable. If curd texture remains, blend 60 sec more.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/step-01-cottage-cheese-polished.webp"},{"@type":"HowToStep","name":"Two Pots, Two Pastas","text":"Cook 8 oz Carbe Diem elbows (adult) and 6 oz Barilla regular elbows (kid) in separate salted-water pots per each pasta's package directions. Drain both, return to their original pots.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/context-adult-high-fiber-elbows-polished.webp"},{"@type":"HowToStep","name":"Divide The Sauce 2","text":"1: Two parts of the blended sauce into the adult pot, one part into the kid pot. Adult pot carries more pasta and gets more sauce.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/step-07-divide-cheese-sauce-polished.webp"},{"@type":"HowToStep","name":"Melt Velveeta","text":"2 oz Velveeta into the adult pot + 1 oz into the kid pot. Stir over LOW heat until fully melted and glossy. Do NOT add the chili yet — Velveeta needs bare pasta + sauce to melt cleanly.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/step-08-add-velveeta-polished.webp"},{"@type":"HowToStep","name":"Add Reserved Chili","text":"4 full servings (~280-320 g) of Hot Dog Chili Base into the adult pot. 2 full-serving equivalents (~140-160 g) into the kid pot — this becomes half a chili serving in each of the 4 kid containers. Fold to combine.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/step-09-add-leftover-chili-polished.webp"},{"@type":"HowToStep","name":"Loosen + Fold","text":"1/4 cup bone broth into the adult pot, 1/8 cup into the kid pot. Fold over low heat until creamy and evenly combined. Sauce should coat the pasta glossy, not pool.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/step-10-add-bone-broth.webp"},{"@type":"HowToStep","name":"Portion 4+4 Containers","text":"Divide the adult pot across 4 airtight containers (~2 oz dry pasta + 1 chili serving + one-quarter of the adult sauce build per container). Divide the kid pot across 4 airtight containers. Cool 20-30 min uncovered before sealing — critical for texture across the week.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/step-11-portion-containers.webp"},{"@type":"HowToStep","text":"ADULT CONTAINER = 2 oz dry Carbe Diem elbows cooked + 1 full chili serving + one-quarter of the adult pot's sauce build + 1/2 oz Velveeta melt-in equivalent. ~380 cal / 39g protein per container.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/final-chili-mac-fork-reveal-polished.webp"},{"@type":"HowToStep","name":"Kid Pot","text":"1.5 oz dry Barilla regular elbows + one-third of the blended sauce + 1 oz Velveeta melted in + 2 full-serving equivalents of Hot Dog Chili Base folded through + 1/8 cup bone broth. Fold until creamy.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/context-kid-regular-elbows.webp"},{"@type":"HowToStep","name":"Portion 4 Kid Containers","text":"Divide the kid pot across 4 airtight containers. Each container ≈ 1.5 oz dry pasta + 1/2 chili serving + one-quarter of the kid sauce build. Cool 20-30 min uncovered before sealing.","image":"https://thesplitplate.com/images/chili-mac-and-cheese/step-11-portion-containers.webp"}],"keywords":"chili-mac, meal-prep, beef, pasta, chain-from, batch-cook, family-dinner, reheats, cottage-cheese-sauce, protein-pasta"}</script>

    <noscript><h1>Chili Mac and Cheese — The Split Plate</h1><p>~380 cal / 39g protein per adult container. 8 meal-prep containers: 4 adult (2 oz dry Carbe Diem elbows + 1 full chili serving + one-quarter of the adult sauce build) + 4 kid (1.5 oz dry Barilla regular elbows + half a chili serving + one-quarter of the kid sauce build). Blended cottage-cheese sauce (cottage cheese + Fairlife + nutritional yeast + cheddar powder) split 2:1 into adult and kid pots. Velveeta melts in per pot (2 oz adult / 1 oz kid). Reserved Hot Dog Chili Base folds in (4 full servings adult pot / 2 full-serving equivalents split across 4 kid containers = half chili serving per kid). Bone broth loosens to creamy. Kid macros intentionally not published — cottage cheese fat percentage was not label-verified. Reheats to 165°F all week with a small splash of milk or bone broth if the sauce tightens.</p></noscript>
